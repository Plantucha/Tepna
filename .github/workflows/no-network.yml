name: no-network

# Privacy invariant gate — the analogue of verify-provenance. Asserts NO remote egress across the
# shipped web-app surfaces (8 bundles + Data Unifier / OverDex + their loose modules) and the
# capture-host Python lens, by booting the self-verifying no-network.html headless and reading its
# own verdict (window.__noNetworkOK). Fast (no render-coverage) → runs on every push.
# Requires the canonical-<link> scanner fix in no-network.html (else the SEO metadata false-positives).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # MERGE QUEUE. The queue tests a PR against the tip it will actually land on, so the required
  # checks MUST fire on `merge_group` — a queue whose checks never run waits forever and jams
  # every merge in the repo. This trigger is wired BEFORE the queue is enabled, deliberately:
  # the reverse order is an outage (BRIEF-COLLISION-RESIDUAL-GAP-2026-08-09-BRIEF §4).
  merge_group:

# Supersede an in-flight run when the same PR is pushed again — the guarded house pattern; full
# measured rationale in tests.yml (the 43-min dead-SHA run) and capture-host-ci.yml (why PR-only).
concurrency:
  group: no-network-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  no-network:
    runs-on: ubuntu-latest
    # A wedged Playwright wait held this job in_progress for hours (2026-08-19, twice in one
    # afternoon; successes run 1–6 min, worst outlier 16). Terminal-and-visible beats pending-forever.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright (chromium only)
        run: |
          npm install --no-save playwright@1.48.0
          npx playwright install --with-deps chromium

      - name: Serve the repo
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/no-network.html >/dev/null && break
            sleep 0.5
          done

      - name: Run the no-network gate
        env:
          BASE_URL: http://127.0.0.1:8080
          NN_ONLY: '1'
        run: node tests/browser-gates.mjs
