name: capture-host-ci

# Python CI for the OUT-OF-SUITE capture-host (the Tepna Vigil box software). The JS suite's Node/browser
# gates are unaffected by it, and vice versa — the two lanes share nothing but this repo.
# Covers the reverse-engineered BLE decoders (oxyii / polar_pmd / viatom), the suite-critical writers
# (Clock Contract / the ~10% HR-bug regression), clockcfg, the live-sample telemetry bus, AND the async
# daemon itself. No BLE hardware needed: the runtime deps are installed below and bleak defers all D-Bus
# contact to connect time, so capture/webmon/bonding/pull_session/polar_psftp import and measure fine.
#
# ⚠️ THE FLOOR IS 100%, STATEMENT **AND** BRANCH. It is a floor, not an aspiration: new code arrives with
# its tests or the build is red. The previous floor was 48 while the tree measured 97 — a 49-point window
# in which coverage could have cratered with CI staying green, which is the one thing a coverage gate
# exists to prevent. Branch mode is on (pyproject `branch = true`) because statement-only coverage counts
# a taken-one-way `if` as covered, and roughly a fifth of what was missing here was exactly that.
#
# Genuinely unreachable code is excluded INLINE with `# pragma: no cover` / `# pragma: no branch` and a
# comment proving why — never by lowering this number. If a branch cannot be reached, say so at the
# branch; if it can, test it.
#
# Runs on a MATRIX of Python versions, and the version the real box runs is required to be one of them —
# see the note on the matrix below for why that is load-bearing rather than tidiness.

# ⚠️ NO `paths:` FILTER, AND THAT IS LOAD-BEARING — DO NOT ADD ONE BACK.
#
# This workflow's two jobs are REQUIRED status checks on `main` (ruleset `protect-main`). GitHub requires
# a required check to actually REPORT: a workflow skipped by a `paths:` filter never reports at all, so
# its checks sit in "Expected — waiting for status" and every PR that does not touch capture-host/ is
# blocked FOREVER. Path-filtering and requiring are mutually exclusive; requiring won.
#
# It was path-filtered until 2026-07-27, and the reason it is now required is what that filter cost:
# PR #469 raised this job's coverage floor to 100 and MERGED WITH THIS WORKFLOW RED, because these
# contexts were not in the required set — auto-merge waited only on the four that were (test,
# no-network, typecheck, biome) and let the Python failure through. main shipped a red gate.
#
# If the ~80 s on every PR ever needs reclaiming, the ONLY safe shape is: keep the trigger unfiltered,
# detect the changed paths INSIDE the job, and skip via a job-level `if:` — a job skipped by a condition
# reports as skipped and satisfies the requirement, whereas a workflow skipped by `paths:` reports
# nothing. The difference is invisible until it deadlocks the repo, which is why this note is this long.
#
# That is exactly what the `changes` job below now does, so the trigger stays unfiltered (the checks
# always report) while a JS-only PR pays ~8 s instead of ~80 s. This matters because coders here merge
# the moment CI is green rather than rebasing, so anything on the critical path is paid by every PR.
# ⚠️ `push:` IS SCOPED TO main — and that is about DUPLICATE RUNS, not about path-filtering.
#
# A bare `push:` fires on every branch push. For a PR from a branch in this repo that is a SECOND run of
# this same workflow on the same commit, alongside the `pull_request:` one. Measured before this change:
# 21 of the last 39 commits had more than one `capture-host-ci` run (54 %), against 0 of 60 for both
# `tests` and `browser-gates`.
#
# That is not merely wasteful — it deadlocks PRs. The two runs register the SAME required contexts
# (`test (py3.12)` / `test (py3.13)`), so if either one wedges, the check sits `in_progress` forever and
# auto-merge waits on it with nothing to report. It happened on PR #776: one run stuck ~9 min with no
# heartbeat while a duplicate had already succeeded. Worse, the duplicate had SKIPPED the python matrix
# (its check registered as the unexpanded literal `test (py${{ matrix.python-version }})`), so "a newer
# run passed" was not evidence the jobs had run — cancelling the wedged one turned a pending required
# check into a CANCELLED one and blocked the PR harder.
#
# Scoping to main is the same shape `tests.yml` already uses, and it does NOT weaken the required-check
# invariant the note above defends: a PR still gets its report from the `pull_request:` trigger, and main
# still gets one from the push after merge. A branch with no PR reports nothing, but has no PR to block.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # MERGE QUEUE. The queue tests a PR against the tip it will actually land on, so the required
  # checks MUST fire on `merge_group` — a queue whose checks never run waits forever and jams
  # every merge in the repo. This trigger is wired BEFORE the queue is enabled, deliberately:
  # the reverse order is an outage (BRIEF-COLLISION-RESIDUAL-GAP-2026-08-09-BRIEF §4).
  merge_group:

# Supersede an in-flight run when the same PR is pushed again — force-pushing a rebase otherwise leaves
# the older run racing the newer one for the same required contexts. `cancel-in-progress` is deliberately
# PR-ONLY: cancelling a run on `main` would leave main's history with a cancelled required check and no
# successor to replace it.
concurrency:
  group: capture-host-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: capture-host

jobs:
  # Relevance check, as a JOB so the gate can report `skipped` rather than never being scheduled.
  # ALLOWLIST, unlike browser-gates' denylist, because the dependency set here is closed and provable:
  # tests/conftest.py puts ONLY capture-host/ on sys.path, so nothing outside this directory can change
  # what the Python suite executes — the sole other input is this workflow file (the matrix, the pins,
  # the coverage floor), which is why it is listed.
  changes:
    name: relevance (capture-host)   # distinct from browser-gates' own `changes` job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"     # push / manual dispatch always runs
            echo "decision: run=true (event=${{ github.event_name }})"; exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" \
                                          "${{ github.event.pull_request.head.sha }}")
          echo "changed files:"; echo "$changed"
          # Pure-shell `case`, NOT grep: `grep -qv` returns the wrong exit status under ugrep, and a
          # filter that mis-answers toward SKIP is a blind gate (see browser-gates.yml for the bite).
          run=false
          if [ -z "$changed" ]; then
            run=true                                # no diff to judge ⇒ run, never silently skip
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                capture-host/*|.github/workflows/capture-host-ci.yml) run=true ;;
                *) ;;
              esac
            done <<< "$changed"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "decision: run=$run"

  test:
    needs: changes
    # ⚠️ NO JOB-LEVEL `if:` HERE — the guard is on the STEPS below, and the difference deadlocks the repo.
    # The note above says "a job skipped by a condition reports as skipped and satisfies the requirement".
    # That is true for a PLAIN job and FALSE for a MATRIX job: a matrix is only expanded when the job
    # runs, so a skipped matrix job registers ONE check under the literal `test (py${{ matrix.python-
    # version }})` and the two REQUIRED contexts `test (py3.12)` / `test (py3.13)` never report at all.
    # Branch protection then waits forever on checks that will never exist.
    # Measured 2026-08-04 on PR #842 (docs-only): `decision: run=false`, 18 checks passing, 0 failing,
    # and `mergeStateStatus: BLOCKED` permanently. The note had even OBSERVED the unexpanded literal on
    # #776 and attributed it to duplicate runs rather than to skipping a matrix.
    # Why this was not constantly red: a docs-only PR only deadlocks when nothing else supplies the
    # contexts. #833 escaped because a `push` run on main happened to report them for the same commit —
    # i.e. the gate's correctness depended on luck, and the better-behaved the PR (rebased right onto
    # main, touching nothing under capture-host/) the more likely it hangs.
    # So: the job ALWAYS runs and the matrix ALWAYS expands; the ~80 s of real work is what is skipped.
    # Cost on an irrelevant PR is checkout + setup-python (~15 s, both legs in parallel).
    runs-on: ubuntu-latest
    # ⚠️ THE BOX'S VERSION MUST BE IN THIS MATRIX. It was pinned to 3.12 alone while the Vigil box ran
    # 3.13.11 — CI was green on a Python the hardware does not execute. That is not hypothetical here:
    # capture.py's clock path calls datetime.utcnow(), deprecated in 3.12 and slated for REMOVAL, so a
    # 3.12-only CI would have stayed green through the exact release that broke the box's clock. When the
    # box is upgraded, add the new version here FIRST and let CI prove it before the box moves.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']   # 3.13 = the box (Vigil, 3.13.11); 3.12 = the older baseline
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Not relevant to this PR — reporting green without running the suite
        if: needs.changes.outputs.run != 'true'
        run: echo "No capture-host/ or workflow change in this PR; the Python suite is not run."
      - name: Install tooling + runtime deps
        if: needs.changes.outputs.run == 'true'
        # The runtime deps are installed even though there is no BLE hardware here. They import fine
        # without an adapter (bleak defers all D-Bus contact to connect time), and WITHOUT them
        # polar_psftp/pull_session cannot even be imported — so any test touching them fails outright, or
        # worse, gets written as an importorskip and silently stops running. A guard that skips in CI is
        # a guard that isn't there. Installing them is also what lets those modules report real coverage.
        run: |
          python -m pip install --upgrade pip
          # ⚠️ `hypothesis` belongs on THIS line, not only in requirements-dev.txt. This job installs a
          # named list plus requirements.txt and never reads requirements-dev — so pinning a test
          # dependency there declares it to humans and to `check.sh`, and NOT to the job that runs the
          # tests. Measured: the property suite passed locally (my venv had it from a manual install)
          # and both matrix legs failed collection here with ModuleNotFoundError.
          pip install pytest pytest-cov ruff shellcheck-py hypothesis
          pip install -r requirements.txt
      - name: Lint (ruff — real errors only)
        if: needs.changes.outputs.run == 'true'
        run: ruff check .
      # ⚠️ THE SHELL FLOOR IS `style` — the STRICTEST level, and it is a floor for the same reason the
      # coverage number is. Python coverage here is 100% statement+branch, but that denominator is .py
      # files: the ~16 shell scripts beside them — including the three holding NOPASSWD root grants and
      # the two that write /etc/sudoers.d — were outside every gate until 2026-08-01.
      #
      # The tree is CLEAN at this level today (it was: 0 error, 0 warning, 13 info). Getting there fixed
      # real things and suppressed nothing silently: the `A && B || C` counter updates in sync-apps.sh /
      # install-services.sh became if/else, and the five remaining suppressions are INLINE
      # `# shellcheck disable=SCxxxx` with a comment proving why at the line — the same house rule as
      # `# pragma: no cover`. If a finding cannot be fixed, prove it at the line; never relax this flag.
      #
      # shellcheck-py is pip-installed above rather than apt-installed so the version is the same one a
      # developer's `pytest` uses (tests/test_shell_surface.py runs the identical check), and so this
      # does not depend on what the runner image happens to ship.
      - name: Lint (shellcheck — every .sh, strictest level)
        if: needs.changes.outputs.run == 'true'
        run: shellcheck --severity=style $(find . -name '*.sh' -not -path './.venv*')
      # ⚠️ find_unwired was a LOCAL-ONLY gate until now: check.sh ran it, this workflow did not, so a
      # published status key or public function that reached nobody could sit on main indefinitely —
      # the "gate that protects nobody" class. It exits 1 on anything unexplained; wire it or allowlist
      # it WITH A REASON in ALLOW_KEYS/ALLOW_FUNCS (the file's own header documents the pattern). Placed
      # before the ~9 min pytest so a structural break fails fast.
      - name: Structural gate (find_unwired — every published key/function wired or explained)
        if: needs.changes.outputs.run == 'true'
        run: python tools/find_unwired.py --check
      - name: Unit tests + coverage (pytest)
        if: needs.changes.outputs.run == 'true'
        # Bare `--cov` (no path) on purpose — it defers to pyproject's `source = [".", "deploy"]`. An
        # explicit `--cov=.` OVERRIDES that list and silently drops deploy/ back out of the denominator,
        # which is how deploy/ezparse.py sat untested and invisible.
        run: pytest -q --cov --cov-branch --cov-report=term-missing --cov-fail-under=100

  # ── DIFF-SCOPED MUTATION GATE ──────────────────────────────────────────────────────────────────────
  # Coverage answers "did this line run?". This answers "would any test NOTICE if it were wrong?", and
  # the 2026-08-02 audit showed those are different questions on this tree: diskguard.py sat at 100%
  # statement+branch while `min_free_gb > 0 and free_gb < min_free_gb` could be flipped to `or` — making
  # the low-disk alert fire on every poll forever — with the whole suite green.
  #
  # ⚠️ SCOPED TO THE DIFF ON PURPOSE, AND IT MUST STAY THAT WAY. A whole-tree kill-rate threshold would
  # red on survivors that are legitimately untestable (log prose, unreachable defensive branches, float
  # boundaries) — measured: 29 of 33 survivors on capture.py's `_now` were log-message wording. A gate
  # that reds on those gets switched off, which is worse than not having one. This one never judges
  # pre-existing code: it mutates only the functions the PR touched, so it cannot inherit a backlog and
  # it enforces exactly one rule — if you changed this line, some test can see it.
  #
  # Separate job, NOT a step in `test`: it is slower and less certain than the suite, and a flaky-ish
  # signal must never be able to mask a deterministic one. It is deliberately NOT in the required set
  # while it earns trust — see the note above `on:` about required checks needing to report.
  mutation-diff:
    needs: changes
    if: needs.changes.outputs.run == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: mutation (diff-scoped)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # the gate diffs against the merge base; a shallow clone has none
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'    # the box's version; see the matrix note above
      - name: Install tooling + runtime deps
        run: |
          python -m pip install --upgrade pip
          # hypothesis for the same reason as the test job above: this one RUNS the suite (mutmut
          # executes it per mutant), so a missing test dependency is a collection error here too.
          # shellcheck-py is NOT optional here even though this job runs no lint step. The mutation
          # BASELINE runs the module's full test selection, which includes
          # tests/test_shell_surface.py, and that test resolves its binary as
          # `which("shellcheck", path=dirname(sys.executable)) or which("shellcheck")`. Without the pin
          # installed, the first lookup finds nothing and PATH hands it the RUNNER'S
          # /usr/bin/shellcheck — an older build that flags three SC2015 sites the pinned 0.11.0 does
          # not. The repo then has two shellchecks that disagree, and the mutation baseline fails on
          # findings no other lane produces, so every mutant reports "no budget" and the gate REFUSES.
          pip install pytest mutmut hypothesis shellcheck-py
          pip install -r requirements.txt
      - name: Mutate only what this PR changed
        # `tools/mutate.py` shells out to `.venv/bin/python`; on the runner the venv is the ambient
        # environment, so point it at the interpreter actually installed here.
        run: |
          mkdir -p .venv/bin && ln -sf "$(command -v python)" .venv/bin/python
          # And put the PINNED shellcheck beside that python, because the scratch tree's
          # `sys.executable` is this symlink — so "look beside the interpreter first" resolves to
          # .venv/bin, and only a binary placed HERE beats /usr/bin on the fallback. Installing the
          # pin above is necessary but not sufficient: without this line the lookup still depends on
          # PATH ordering, which is not ours to rely on.
          # ⚠️ This step runs under `bash -e`, so every line here must succeed. `test -n "$SC" && ln`
          # would ABORT the whole step when the binary is absent — turning a missing tool into a hard
          # CI failure, which is the opposite of what a best-effort link should do.
          SC="$(python -c 'import shutil;print(shutil.which("shellcheck") or "")')"
          if [ -n "$SC" ]; then
            ln -sf "$(readlink -f "$SC")" .venv/bin/shellcheck
            echo "pinned shellcheck: $(.venv/bin/shellcheck --version | sed -n 2p)"
          else
            echo "no shellcheck on PATH — the baseline will skip that test, not fail on a stale binary"
          fi
          python tools/mutate_diff.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --json mutation-diff.json
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-diff
          path: capture-host/mutation-diff.json
          if-no-files-found: ignore

  # ── mypy RATCHET (advisory) ─────────────────────────────────────────────────────────────────────
  # PYTHON-TYPES-AND-FORMAT §P1/§P3. Advisory today: it FAILS only if the count EXCEEDS the recorded
  # baseline, so the number can only go DOWN. §P3 flips this job to REQUIRED and the threshold to 0,
  # in the same PR as check.sh's flip.
  #
  # ⚠️ THIS JOB IS THE CANONICAL MEASUREMENT, AND THE DEVELOPER'S ROOT CHECKOUT IS THE CONVENIENCE ONE.
  # A whole-tree error count is a property of the tree it ran in: measured 2026-08-28, root reported
  # 189 and a clean worktree 188, the single difference being ONE UNTRACKED file that exists only in
  # root. CI's fresh checkout carries no untracked strays, so it — not a working tree — is the
  # population §P3's flip count must be measured against. (§P2b records the same lesson from the other
  # direction.)
  #
  # ⚠️ AND THE 189-vs-188 SPREAD ABOVE IS A DATED OBSERVATION, NOT A STANDING OFFSET. Re-measured
  # 2026-08-29: a fresh worktree off `origin/main` reported 189, exactly what this job reports on
  # main — so the gap was that day's untracked stray, not a property of worktrees. Do not carry a
  # correction factor between trees; measure the tree you are in, and compare a PAIRED before/after
  # inside ONE tree when what you want is the delta.
  #
  # THE BASELINE IS READ FROM check.sh, NOT COPIED HERE. One number, one home; a second hardcoded copy
  # is a second thing to forget. If it cannot be parsed the job REFUSES rather than assuming a value —
  # an unreadable baseline is not a permissive one.
  mypy:
    needs: changes
    runs-on: ubuntu-latest
    name: mypy (advisory ratchet)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'   # the box (Vigil, 3.13.11) — the version whose type errors matter
      - name: Not relevant to this PR — reporting green without running mypy
        if: needs.changes.outputs.run != 'true'
        run: echo "No capture-host/ or workflow change in this PR; the mypy ratchet is not run."
      - name: Install mypy + runtime deps
        if: needs.changes.outputs.run == 'true'
        # The runtime deps matter here for the same reason they do in `test`: without them the modules
        # do not import, and mypy reports a wall of missing-import noise instead of real type errors.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: mypy ratchet — the count may only go DOWN, and touching the baseline obligates reproducing it
        if: needs.changes.outputs.run == 'true'
        # ⚠️ THE RATCHET HAD A HOLE, AND IT FAILED SILENTLY. This step used to fail only when the
        # measured count EXCEEDED the recorded baseline — so a PR that MOVED the baseline passed by
        # construction, in either direction, because the written number was never compared to
        # anything the job had measured. Two lanes cutting the count in parallel is the ordinary
        # case here, and it is not a hypothetical: on 2026-08-29 three PRs were open at once, all
        # editing the one line that holds this number, each measured independently against a 189-era
        # main — 154, 183 and 180. Land the 154 and then the 183 unchanged and the recorded baseline
        # goes UP by 29, with every check green and the second PR's own summary line reading
        # `153 <= 183, ratchet ok`. A wrong number and a right one produce identical output there.
        #
        # NOBODY HAD TO ERR FOR THAT TO HAPPEN. Each PR measured its own tree and wrote down what it
        # measured, which is the correct behaviour; the hazard needs two CORRECT actors acting
        # concurrently, because no lane can see another lane's number. That is why it is a gate's job
        # and not a discipline's: asking people to remember is asking them to have information they
        # do not have.
        #
        # AND CONTENTION IS ONLY THE VISIBLE CLASS. THERE ARE TWO, AND THE SECOND HAS NO EDITOR:
        #   (1) CONTENTION — two lanes each move the line, and the second to land overwrites the
        #       first's number. Loud enough to notice once you look for it.
        #   (2) DRIFT WITH NOBODY EDITING ANYTHING — a PR records a baseline that was CORRECT when
        #       measured, then unrelated work lands on main and moves the count underneath it. No
        #       one touched the line; it went stale by sitting still. Measured 2026-08-29: a PR
        #       holding a correctly-measured 148 went 11 stale within the hour because a different
        #       PR improved main, and main's OWN recorded line went stale the same way without
        #       anyone editing it.
        #
        # (2) generalises (1) and is the honest statement of the hazard: **a recorded baseline goes
        # stale whenever main moves while a PR is open — which is every PR, always.** Any number
        # written before the final rebase is a claim about a tree that no longer exists. Contention
        # is just the case where the staleness has a culprit.
        #
        # WHY THE CHECK BELOW COVERS BOTH, WHICH IS NOT OBVIOUS: the trigger is the branch's value
        # against CURRENT main, not against the merge-base, so a line that has drifted differs just
        # as loudly as one that was overwritten — either way it takes the equality branch and must
        # equal what THIS run measured. ⚠️ The at-merge-time property is NOT free from this run: CI
        # on a BEHIND head measures the pre-merge tree, where a stale number can still look correct.
        # It comes from Kodiak base-merging before it merges, which triggers a FURTHER run whose
        # measurement is taken on the merged ref. So this step is honest on the run that matters and
        # can read green on an earlier one — do not take a green here as proof the number is current.
        #
        # SO THE RULE IS: **touching the threshold obligates reproducing it.** When a PR changes the
        # recorded baseline, the written number must EQUAL the count this run just measured — not
        # merely bound it. Direction alone catches only the raise; equality also catches an unearned
        # LOWERING, a number that came from arithmetic or from a stale tree, which no `<=` test can
        # see because a too-low baseline passes a `<=` check by being too low. When the PR does NOT
        # touch it, the plain ratchet applies and lowering it is optional.
        #
        # The direction check is KEPT ALONGSIDE equality rather than replaced by it: equality alone
        # would wave through "I introduced 20 type errors and wrote the new total", since that also
        # reproduces. A raise therefore still needs DECLARED PROVENANCE — `baseline-raised:<reason>`
        # on the line — which is the same discriminator `commit-shape.mjs` uses, and never a shape
        # rule. The legitimate case is an upstream mypy release reporting more on unchanged code.
        run: |
          set -uo pipefail
          # `.*` not `[^\n]*`: inside a bracket expression `\n` is the two literal characters, so
          # `[^\n]*` would stop the match at the first 'n' — truncating the line before a
          # `baseline-raised:` marker placed after it, and reading a DECLARED raise as undeclared.
          # `grep -o` already matches within one line, so `.*` cannot run past the newline.
          LINE=$(grep -oE 'baseline [0-9]+.*' check.sh | head -1)
          BASE=$(printf '%s' "$LINE" | grep -oE '[0-9]+' | head -1)
          # main's copy of the same line. checkout is shallow, so fetch the blob explicitly; if it
          # cannot be read the step REFUSES rather than assuming the baseline is fine — an unreadable
          # comparison is not a passing one (CLAUDE.md §4b: a check that reports success about
          # something it never examined).
          git fetch --depth=1 origin main >/dev/null 2>&1 || true
          PREV=$(git show FETCH_HEAD:capture-host/check.sh 2>/dev/null \
                 | grep -oE 'baseline [0-9]+' | head -1 | grep -oE '[0-9]+')
          if [ -z "${BASE:-}" ] || [ -z "${PREV:-}" ]; then
            echo "REFUSING: could not read this branch's baseline (${BASE:-unreadable}) or main's (${PREV:-unreadable})."
            echo "A comparison that could not be made is not a comparison that passed."
            exit 2
          fi
          # Capture the exit code of MYPY, never of a pipe — a `| tail` here would report tail's status
          # and a failing type-check would read as green (CLAUDE.md §4b).
          python -m mypy --ignore-missing-imports --explicit-package-bases . > mypy-out.txt 2>&1 || true
          cat mypy-out.txt
          # AGGREGATE from mypy's own summary line, never from a tail of the output. "Success: no issues
          # found" is a genuinely clean run and means zero; an ABSENT summary means mypy did not finish,
          # which is not zero and must not read as one.
          if grep -q '^Success: no issues found' mypy-out.txt; then
            N=0
          else
            N=$(grep -oE '^Found [0-9]+ error' mypy-out.txt | grep -oE '[0-9]+' | head -1)
          fi
          if [ -z "${N:-}" ]; then
            echo "REFUSING: mypy printed neither a 'Found N errors' line nor a success line — it did not finish."
            echo "That is not a clean tree; it is an unfinished measurement."
            exit 2
          fi
          echo "mypy errors: $N   baseline here: $BASE   on origin/main: $PREV   delta: $((N - BASE))"
          echo "measured in CI's FRESH CHECKOUT — the canonical population for §P3's flip count."

          if [ "$BASE" != "$PREV" ]; then
            echo "This PR MOVES the baseline ($PREV -> $BASE), so it must REPRODUCE it."
            if [ "$N" -ne "$BASE" ]; then
              echo "BASELINE NOT REPRODUCED: the line says $BASE, this run measured $N."
              echo "A baseline you did not measure is a number, not a measurement — and it fails in BOTH"
              echo "directions: too high hands back ground another lane won (its own summary would read"
              echo "'ok' while doing so), too low sails past every '<=' test by being too low."
              echo "FIX: write the number THIS JOB just printed ($N). Do not compute it by arithmetic"
              echo "from another PR's delta; the count is a property of the tree, and the lanes' changes"
              echo "are not guaranteed disjoint. If you rebased since measuring, re-measure."
              exit 1
            fi
            if [ "$BASE" -gt "$PREV" ]; then
              case "$LINE" in
                *baseline-raised:*)
                  echo "baseline RAISED $PREV -> $BASE, reproduced, and declared:"
                  echo "  $LINE"
                  echo "Allowed. A declared raise is a decision; an undeclared one is an accident." ;;
                *)
                  echo "RATCHET MAY ONLY TIGHTEN: baseline went UP, $PREV -> $BASE, with no declared reason."
                  echo "Reproducing a higher count proves the errors are real; it does not make raising the"
                  echo "floor to meet them a decision anyone made. If an upstream release genuinely reports"
                  echo "more on unchanged code, say so on the line: baseline-raised:<reason>."
                  exit 1 ;;
              esac
            else
              echo "baseline tightened $PREV -> $BASE and this run reproduced it exactly."
            fi
          else
            echo "This PR leaves the baseline alone; the plain ratchet applies."
            if [ "$N" -gt "$BASE" ]; then
              echo "RATCHET BROKEN: $N > $BASE. The recorded baseline may only go DOWN."
              exit 1
            fi
            echo "ratchet ok ($N <= $BASE). Lowering it is optional; if you do, this job will require"
            echo "the new number to equal what it measures."
          fi
          echo "Advisory until §P3 flips this job to required with a threshold of 0."

  # ── SUPPLY-CHAIN GATES (advisory) ───────────────────────────────────────────────────────────────
  # Two questions with different failure modes, deliberately not merged into one job:
  #   · dependency-review — what does this PR ADD to the dependency graph?
  #   · detect-secrets    — does this PR add a credential that is not in the reviewed baseline?
  #
  # 🔴 FINDINGS ARE ADVISORY; BLINDNESS IS FATAL. A new finding prints and does not fail (the same
  # flip discipline mypy is under — advisory until a stated flip). But an UNPARSEABLE OR MISSING
  # BASELINE exits 2, because that is not "no secrets found", it is "the scanner could not run". The
  # two produce the same silence and mean opposite things, and this repo has spent a lot of the last
  # week on exactly that distinction.
  supply-chain:
    needs: changes
    runs-on: ubuntu-latest
    name: supply-chain (advisory)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # dependency-review needs both endpoints of the PR diff
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Not relevant to this PR — reporting green without scanning
        if: needs.changes.outputs.run != 'true'
        run: echo "No capture-host/ or workflow change in this PR; the supply-chain gates are not run."
      - name: Dependency review (advisory)
        if: github.event_name == 'pull_request' && needs.changes.outputs.run == 'true'
        continue-on-error: true   # advisory until the flip; the report is the product
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never   # the job log is the surface; PR comments are noise at our cadence
      - name: Secrets scan against the reviewed baseline
        if: needs.changes.outputs.run == 'true'
        run: |
          set -uo pipefail
          # 🔴 ANCHORED TO THE WORKSPACE, NOT RELATIVE. This file sets
          # `defaults.run.working-directory: capture-host`, so a bare `.secrets.baseline` resolves to
          # `capture-host/.secrets.baseline` — and the baseline lives at the REPO ROOT. The step
          # therefore took its own missing-baseline branch and exited 2 on EVERY PR that reached it
          # (#1927 itself, #1930, #1933), which is the refusal working exactly as designed, on a path
          # error of my own making. The scan must also RUN from the root or it would cover only
          # capture-host while the baseline describes the whole tree — a narrower scan read as a
          # cleaner one.
          cd "$GITHUB_WORKSPACE"
          BASE="$GITHUB_WORKSPACE/.secrets.baseline"
          # THE BASELINE MUST EXIST AND PARSE. Absent or corrupt is a gate that cannot see, and a gate
          # that cannot see must not report green — the one hard failure in this job.
          if [ ! -f "$BASE" ]; then
            echo "REFUSING: $BASE is missing. That is a scanner with no reference, not a clean tree."
            exit 2
          fi
          python -c "import json,sys; d=json.load(open('$BASE')); sys.exit(0 if 'results' in d and 'plugins_used' in d else 1)" || {
            echo "REFUSING: $BASE does not parse as a detect-secrets baseline."
            echo "An unreadable baseline is not an empty one."
            exit 2
          }
          python -m pip install --quiet detect-secrets
          # `audit --report` compares the tree against the baseline. New findings print; they do not
          # fail this job yet. FLIP CONDITION, pre-stated: this becomes blocking once the baseline has
          # been audited end-to-end (every entry marked true/false positive) — currently it records
          # WHAT WAS FOUND, not what was judged.
          # 🔴 ONE EXCLUSION SET, IN ONE FILE, USED BY BOTH — and getting this wrong is what failed.
          # `--exclude-files` on the command line REPLACES the pattern stored in the baseline; it does
          # not add to it. So a scan whose flags differ from the baseline's generation reports the
          # whole difference as new findings: measured, passing a self-exclusion alone took the set
          # from 19 files to 122 as every previously-excluded bundle, upload and provenance fragment
          # flooded back. `.secrets-exclude` is therefore the single source, read by this job and used
          # verbatim when regenerating the baseline.
          #
          # ⚠️ THE PATTERN EXCLUDES THE BASELINE ITSELF, deliberately: a baseline is a FILE OF HASHED
          # SECRETS by construction, so scanning it feeds the gate its own output — its hashes appear
          # as new high-entropy findings, which grow the file, which adds more. Observed in CI as
          # `"filename": ".secrets.baseline"` entries inside the diff meant to report secrets elsewhere.
          EXCL=$(cat "$GITHUB_WORKSPACE/.secrets-exclude")
          detect-secrets scan --baseline "$BASE" --exclude-files "$EXCL" || true
          if git diff --quiet -- "$BASE"; then
            echo "no new secrets: the tree matches the reviewed baseline"
          else
            echo "⚠ NEW findings not in the baseline — advisory today, blocking after the audit flip:"
            # ⚠️ WRITE, THEN READ THE FILE — never `git diff | head`. Under `set -o pipefail`, `head`
            # closing early SIGPIPEs git and the pipeline returns 141, which as the step's LAST command
            # becomes the step's exit status. That is exactly what failed: EXIT CODE 141, an advisory
            # branch killing the job it was only supposed to narrate. It did not reproduce locally,
            # because the local diff was small enough for `head -60` to consume whole.
            git --no-pager diff -- "$BASE" > /tmp/baseline-drift.txt || true
            head -60 /tmp/baseline-drift.txt
          fi
