name: capture-host-ci

# Python CI for the OUT-OF-SUITE capture-host (the Tepna Vigil box software). The JS suite's Node/browser
# gates are unaffected by it, and vice versa — the two lanes share nothing but this repo.
# Covers the reverse-engineered BLE decoders (oxyii / polar_pmd / viatom), the suite-critical writers
# (Clock Contract / the ~10% HR-bug regression), clockcfg, the live-sample telemetry bus, AND the async
# daemon itself. No BLE hardware needed: the runtime deps are installed below and bleak defers all D-Bus
# contact to connect time, so capture/webmon/bonding/pull_session/polar_psftp import and measure fine.
#
# ⚠️ THE FLOOR IS 100%, STATEMENT **AND** BRANCH. It is a floor, not an aspiration: new code arrives with
# its tests or the build is red. The previous floor was 48 while the tree measured 97 — a 49-point window
# in which coverage could have cratered with CI staying green, which is the one thing a coverage gate
# exists to prevent. Branch mode is on (pyproject `branch = true`) because statement-only coverage counts
# a taken-one-way `if` as covered, and roughly a fifth of what was missing here was exactly that.
#
# Genuinely unreachable code is excluded INLINE with `# pragma: no cover` / `# pragma: no branch` and a
# comment proving why — never by lowering this number. If a branch cannot be reached, say so at the
# branch; if it can, test it.
#
# Runs on a MATRIX of Python versions, and the version the real box runs is required to be one of them —
# see the note on the matrix below for why that is load-bearing rather than tidiness.

# ⚠️ NO `paths:` FILTER, AND THAT IS LOAD-BEARING — DO NOT ADD ONE BACK.
#
# This workflow's two jobs are REQUIRED status checks on `main` (ruleset `protect-main`). GitHub requires
# a required check to actually REPORT: a workflow skipped by a `paths:` filter never reports at all, so
# its checks sit in "Expected — waiting for status" and every PR that does not touch capture-host/ is
# blocked FOREVER. Path-filtering and requiring are mutually exclusive; requiring won.
#
# It was path-filtered until 2026-07-27, and the reason it is now required is what that filter cost:
# PR #469 raised this job's coverage floor to 100 and MERGED WITH THIS WORKFLOW RED, because these
# contexts were not in the required set — auto-merge waited only on the four that were (test,
# no-network, typecheck, biome) and let the Python failure through. main shipped a red gate.
#
# If the ~80 s on every PR ever needs reclaiming, the ONLY safe shape is: keep the trigger unfiltered,
# detect the changed paths INSIDE the job, and skip via a job-level `if:` — a job skipped by a condition
# reports as skipped and satisfies the requirement, whereas a workflow skipped by `paths:` reports
# nothing. The difference is invisible until it deadlocks the repo, which is why this note is this long.
#
# That is exactly what the `changes` job below now does, so the trigger stays unfiltered (the checks
# always report) while a JS-only PR pays ~8 s instead of ~80 s. This matters because coders here merge
# the moment CI is green rather than rebasing, so anything on the critical path is paid by every PR.
on:
  push:
    branches: [main]      # feature-branch pushes are covered by the PR run; this is the post-merge run
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: capture-host

jobs:
  # Relevance check, as a JOB so the gate can report `skipped` rather than never being scheduled.
  # ALLOWLIST, unlike browser-gates' denylist, because the dependency set here is closed and provable:
  # tests/conftest.py puts ONLY capture-host/ on sys.path, so nothing outside this directory can change
  # what the Python suite executes — the sole other input is this workflow file (the matrix, the pins,
  # the coverage floor), which is why it is listed.
  changes:
    name: relevance (capture-host)   # distinct from browser-gates' own `changes` job
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"     # push / manual dispatch always runs
            echo "decision: run=true (event=${{ github.event_name }})"; exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" \
                                          "${{ github.event.pull_request.head.sha }}")
          echo "changed files:"; echo "$changed"
          # Pure-shell `case`, NOT grep: `grep -qv` returns the wrong exit status under ugrep, and a
          # filter that mis-answers toward SKIP is a blind gate (see browser-gates.yml for the bite).
          run=false
          if [ -z "$changed" ]; then
            run=true                                # no diff to judge ⇒ run, never silently skip
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                capture-host/*|.github/workflows/capture-host-ci.yml) run=true ;;
                *) ;;
              esac
            done <<< "$changed"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "decision: run=$run"

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # ⚠️ THE BOX'S VERSION MUST BE IN THIS MATRIX. It was pinned to 3.12 alone while the Vigil box ran
    # 3.13.11 — CI was green on a Python the hardware does not execute. That is not hypothetical here:
    # capture.py's clock path calls datetime.utcnow(), deprecated in 3.12 and slated for REMOVAL, so a
    # 3.12-only CI would have stayed green through the exact release that broke the box's clock. When the
    # box is upgraded, add the new version here FIRST and let CI prove it before the box moves.
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']   # 3.13 = the box (Vigil, 3.13.11); 3.12 = the older baseline
    name: test (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling + runtime deps
        # The runtime deps are installed even though there is no BLE hardware here. They import fine
        # without an adapter (bleak defers all D-Bus contact to connect time), and WITHOUT them
        # polar_psftp/pull_session cannot even be imported — so any test touching them fails outright, or
        # worse, gets written as an importorskip and silently stops running. A guard that skips in CI is
        # a guard that isn't there. Installing them is also what lets those modules report real coverage.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff
          pip install -r requirements.txt
      - name: Lint (ruff — real errors only)
        run: ruff check .
      - name: Unit tests + coverage (pytest)
        # Bare `--cov` (no path) on purpose — it defers to pyproject's `source = [".", "deploy"]`. An
        # explicit `--cov=.` OVERRIDES that list and silently drops deploy/ back out of the denominator,
        # which is how deploy/ezparse.py sat untested and invisible.
        run: pytest -q --cov --cov-branch --cov-report=term-missing --cov-fail-under=100

  # ── one aggregated status ──────────────────────────────────────────────────────────
  # THE required check. Same pattern as tests.yml's `test` job, and here it is not merely tidiness —
  # it is what makes the relevance skip above SAFE.
  #
  # A skipped MATRIX job reports its name UNEXPANDED — literally `test (py${{ matrix.python-version }})`
  # — so `test (py3.12)` / `test (py3.13)` simply do not exist as check runs when the job skips. Requiring
  # those names while allowing the job to skip deadlocks every PR that does not touch capture-host/. That
  # was measured on PR #478, where they were satisfied only by an incidental push-event run; filtering
  # `push` as well (done above) would have exposed it immediately.
  #
  # This job is NOT a matrix, so its name is stable whether the tests ran or were skipped. `skipped` is
  # an ALLOWED result here — it means the PR provably cannot affect the Python suite — while `failure`
  # or `cancelled` reds the gate. Requiring THIS context instead of the matrix names is what lets both
  # properties hold at once: always reports, and only actually runs when relevant.
  capture-host:
    name: capture-host
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Gate on the python matrix
        run: |
          echo "relevance: ${{ needs.changes.outputs.run }}"
          echo "tests:     ${{ needs.test.result }}"
          case "${{ needs.test.result }}" in
            success) echo "✓ python suite green (100% floor held)" ;;
            skipped) echo "✓ nothing under capture-host/ changed — suite not relevant to this PR" ;;
            *)       echo "::error::capture-host python suite did not succeed (${{ needs.test.result }})"
                     exit 1 ;;
          esac
