name: tests

# Runs the headless GanglioR assertion suite on every push / PR, then the provenance
# GATE-A manifestHash check (EXPORT-IDENTITY-FOLLOWUPS-IV §1: bundle manifestHash ↔
# BUILD-MANIFEST.json, the pure-Node sibling of verify-provenance.html). Both are pure
# Node (built-in vm + fs) — no npm install, no browser, no network. They are SEPARATE
# assertions (behavior suite vs provenance) that share this one CI entry.
#
# ── SHARDED (CI-SHARDING, 2026-07-12; widened to 6 on 2026-07-15) ─────────────────────
# The suite was a 4-minute single-threaded step — one core on a multi-core runner, ~75%
# of it inside ecgdex-dsp.js (PROFILED-HOTSPOTS-CI-AND-DSP-2026-07-12-BRIEF §1). It now
# runs as 6 parallel shards. Two things make that safe rather than merely fast:
#
#   1 · The shards PARTITION the suite — every declared group runs in exactly one shard,
#       so the union of the shards IS the unsharded gate. The partition is INDEX-based,
#       never name-based: a pattern shard silently drops any group no pattern claims, and
#       all N shards would go green having never run it. tests/shard-plan.mjs owns it, and
#       LPT-packs the groups by measured cost (round-robin skews 42.7s/25.3s here — the
#       heavy ECGDex groups collide on one residue class).
#   2 · That partition is PROVEN on every push by the `static` job's shard-union check, so
#       sharding cannot quietly shrink the gate. `verify-shard-union.mjs --deep` (a real
#       full run vs the real shard-union, assertion-for-assertion) proved the groups are
#       order-independent; it costs more than sharding saves, so it is not on every push —
#       run it when you change the partition scheme.
#
# Shard count lives in TWO places that must agree: the `matrix.shard` list below and
# CI_SHARDS in tests/verify-shard-union.mjs (GitHub forbids env: inside a matrix literal).
# MEASURED on CI at N=4 (run 29198623082): 4m05s → 1m20s wall. The suite STEP itself went 245 s →
# 63 s (3.9x — the 4.00x plan holds); the remaining wall is ~7 s job setup per shard + the 3 s
# aggregator. Shards came in at 40/63/55/60 s — the spread is runner-to-runner speed variance.
# WIDENED to 6 on 2026-07-15 (TEST-COVERAGE-ANALYSIS): this only paid off once the two heaviest
# ECGDex groups were split — the heaviest indivisible group fell 24.5 s → 15.3 s, so the planner is
# no longer group-bound at N>4. The N=6 plan is balance-bound at 4.00x (makespan ≈ total/6); setup
# overhead is per-job and runs in parallel, so wall improves while the ~15 s floor stays untouched.
#
# ⚠️ THE TWO SENTENCES ABOVE ARE NO LONGER TRUE — re-measured 2026-08-09 (tools/ci-timing.mjs, 25 runs
# of main). BOTH halves failed, and each failed silently:
#
#   1 · group-timings.json had gone stale by 61 %: it described 164 groups against 419 declared. The
#       missing 255 all got the MEDIAN weight, so LPT was bin-packing a 40 %-complete picture of the
#       cost. Measured effect on CI: `suite (shard 1/6)` 10m01s against `shard 6/6` 1m09s — 8.7x, on a
#       planner whose whole purpose is balance. Refreshing the hints puts the makespan at 3.5 min.
#       The file's own header calls drift "safe by construction" because it degrades balance and never
#       correctness. That is true and it is not the whole story: safe here meant SILENTLY EXPENSIVE,
#       ~6.5 min of a lane nobody was watching, because nothing reports per-shard timings.
#   2 · THAT GROUP-BOUND FLOOR IS GONE — re-measured 2026-10-10. The paragraph here used to read
#       "the plan is GROUP-BOUND again, not balance-bound", because `fitClockClosure — three clocks
#       must close to zero` cost 208.9 s of a 481.2 s suite (43 % in ONE group), making total/6
#       "unreachable at any N". That group has since been split: it now costs 4.3 s, the suite totals
#       331.7 s, and the planner's own output reads `planned makespan 55.3 s of 331.7 s total → 6.00x`
#       with the remainder check at `max / mean = 1.000` — the IDEAL split, exactly achieved. No group
#       needs a shard to itself; the heaviest shard is 55.3 s over 83 groups. So balance is no longer
#       the thing to watch here, which is precisely why the UNTIMED count got a ratchet instead
#       (`tests/verify-shard-timings.mjs`, static job): 29 of 727 groups carry no committed timing =
#       3.99 %, against a pre-stated 5 % cap. A SHARE and not a count, because a new group is unpriced
#       by construction and a count cap reds the PR that adds a test — the first version of this gate
#       did exactly that on the next merge. A number that only ever appeared as one mid-run prose line
#       is a number nobody owns; this one now has a cap and an owner.
#       Per-shard wall time, both framings, because they differ by ~2.5x and the gap is the machine:
#       RIG (rig-x870, 6 shards, 2026-10-10) p50 60 s, range 56-78 s, shard 5 the outlier;
#       CI p50 152-155 s. Quote the CI figure when sizing CI, the rig figure only for local work.
#
# ⚠️ AND THE JS LANE IS NOT THE CI CEILING ANYWAY — the python legs still dominate, though by less
# than this comment used to claim: ~12m30 each when written, MEASURED 2026-10-10 at 6.5 min (py3.12)
# and 5.0 min (py3.13) on run 38087359921. Both still exceed the JS lane, so the conclusion holds:
# total CI wall does not improve until the capture-host pytest matrix does. Measure before optimising:
# `node tools/ci-timing.mjs` prints the critical path, which is a MAX over parallel jobs, not a sum.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # MERGE QUEUE. The queue tests a PR against the tip it will actually land on, so the required
  # checks MUST fire on `merge_group` — a queue whose checks never run waits forever and jams
  # every merge in the repo. This trigger is wired BEFORE the queue is enabled, deliberately:
  # the reverse order is an outage (BRIEF-COLLISION-RESIDUAL-GAP-2026-08-09-BRIEF §4).
  merge_group:

# Supersede an in-flight run when the same PR is pushed again — same pattern and rationale as
# capture-host-ci. MEASURED 2026-08-18, the night the runner pool saturated: without this guard a
# branch update was purely ADDITIVE load — a superseded 6-shard run of THIS workflow kept executing
# for 43 minutes against a dead SHA (created 02:54:57, replaced ~05:16, finished `success` 05:59:19),
# and 8 of 11 workflows had the same hole, so collecting a BEHIND PR re-queued ~17 jobs while
# cancelling almost nothing. `cancel-in-progress` is deliberately PR-ONLY: cancelling a run on `main`
# would leave main's history with a cancelled required check and no successor to replace it.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── the assertion suite, split 6 ways ──────────────────────────────────────────────
  suite:
    # measured 2026-10-11 over 175 job run(s): p95 2.7 min, max 2.9 min (tools/ci-timing.mjs `pct`). Cap = ceil(max(p95, max) × 2).
    # max over the six shards
    timeout-minutes: 6
    name: suite (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one shard's red must not cancel the others — surface every failure in one pass
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: GanglioR test suite — shard ${{ matrix.shard }}/6
        run: node tests/run-tests.mjs --shard=${{ matrix.shard }}/6

  # ── the shard gate's own gate, + the static/provenance checks (~15 s, in parallel) ──
  static:
    # measured 2026-10-11 over 29 job run(s): p95 3.3 min, max 3.4 min (tools/ci-timing.mjs `pct`). Cap = ceil(max(p95, max) × 2).
    timeout-minutes: 7
    name: shard-union + build + provenance
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is LOAD-BEARING for the commit-shape scan below — on the default
      # shallow clone it would see one commit, find nothing, and report green forever.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # THE load-bearing check for sharding: prove the 6 shards partition the suite, so no
      # group can fall between them, go unrun, and still leave every shard green. ~0.1 s.
      # AGENT-NEUTRAL-GUARDS §3. The shared-tree guards are Claude-Code PreToolUse hooks, so
      # they enforce nothing for any other operator. This is the detection half, which holds
      # for whoever opened the PR: a commit deleting a changeset is a release ONLY if it
      # deletes nothing outside changes/ AND bumps the version. Validated over full history —
      # 30 releases pass, 0 false positives. Refuses on a shallow clone rather than passing.
      - name: Commit-shape — no blanket-add / ref-move corruption in history
        run: node tools/commit-shape.mjs
      # The residue ledger's id contract is CROSS-TREE and `docs-ledger` check8c is not: it
      # asserts uniqueness within the file it can see. Measured 2026-09-02, the day the ledger
      # shipped — a branch appended R7 while main had advanced to R10, and the full local gate
      # passed 56/56 because that tree could not see R7–R10. Same shallow-clone refusal as above.
      - name: Residue ids — no collision with main's ledger, and no row edited or removed
        run: node tools/residue-ids.mjs --base origin/main
      # A job with no `timeout-minutes` inherits GitHub's 360-minute default, so a hung step burns
      # six hours of the concurrency pool while the fleet correctly reads the queue as serialising
      # (CLAUDE.md §👥.5) — the reading that is right almost always and therefore hides a real hang.
      # Presence only: the number is sized from each job's own measured p95/max and written beside it.
      - name: Workflow timeouts — every job declares a cap
        run: node tools/workflow-timeout-guard.mjs
      - name: Shard-union — the shards partition the suite (no group goes unrun)
        run: node tests/verify-shard-union.mjs
      - name: The untimed-group ratchet (shrink-only; the timings stay a hint)
        run: node tests/verify-shard-timings.mjs
      - name: Owned-build core tests (KAT + determinism + cross-hasher parity)
        run: node tests/build-core-tests.mjs
      - name: Owned bundles ≡ build(source) (deterministic build drift guard)
        run: node tools/build.mjs --check
      - name: Absence regression — no new fabrication patterns introduced
        run: node tools/absence-regression.mjs --base origin/main
      - name: XSS sink gate — no unescaped innerHTML sinks added
        run: node tools/xss-sink-gate.mjs --base origin/main
      - name: Docs constants — documented numbers match code
        run: node tools/docs-constants.mjs
      - name: No third-party project names (owner ruling 2026-10-10; baseline 0)
        run: node tools/no-third-party-names.mjs
      - name: Every Integrator key declares its surface (card | export-only)
        run: node tools/integrator-surface-gate.mjs
      - name: PR body + changeset compliance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Check 6 needs the PR's own number, to exempt a body that closes ITSELF, and a token for
          # the one `gh api` call per cited number. Without the token the lookup fails, the check
          # reports itself as not evaluated, and the other five still run — so this env is what makes
          # check 6 bite in CI rather than only on a rig.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/pr-compliance.mjs
      - name: Self-contained analysis tools ≡ bundle(source) (file://-safe drift guard)
        run: node tools/build-analysis.mjs --check
      # The FIFTH generated tree, and the one that had no guard here until 2026-09-13. `npm run check`
      # has run `tools-index.mjs --check` as step 14/16 all along, so the drift guard EXISTS — it just
      # ran for nobody, because CI checked the other four and never this one. The result is the failure
      # CLAUDE.md §2b-bis describes: a guard protects only whoever happens to run it. Measured that day,
      # `docs/TOOLS-INDEX.md` on main was missing `cohort-fit.mjs` (#2458) and `nsrr-score-pool.mjs`
      # (#2457) — both PRs merged green — and the cost landed on the next contributor to run the full
      # local gate, as a red in a file they had not touched. BLOCKING, like its three siblings above and
      # unlike verify-fixtures below: it is deterministic, needs no corpus and no network, and an outside
      # contributor can fix it by running the tool, so none of the reasons for informational apply.
      - name: Tools index ≡ tools-index(source) (the fifth generated tree)
        run: node tools/tools-index.mjs --check
      # The SIXTH generated tree, and it had no comparator at all until now: `codegen/generated/` is a
      # frozen copy of `dex-gen.js` / `dex-registry-gen.js` output, and nothing re-ran either generator
      # or compared the committed bytes, so the copy could diverge from the generator for any length of
      # time with every gate green (residue `2026-09-20-codegen-generated-never-regenerated`). Same shape
      # as the five guards above — committed artifact ≡ build(source) — pure Node, no corpus, no network.
      - name: Codegen copies ≡ dex-gen(source) (the sixth generated tree)
        run: npm run -s verify:codegen
      # VERDICT-CONTRACT §3 — the producers of a verdict word, ENUMERATED on the tree and held equal to a
      # committed manifest that bins every one (decides · already-json · word-only-with-reason · test).
      # A new tool that prints PASS/FAIL and is in no bin is a red with its name; an adoption is READ
      # (the object run or read, validated under verdict.js), never believed. Pure Node, no corpus.
      - name: Verdict adoption ≡ enumerated producers (every one binned; every adoption read and valid)
        run: node tools/verdict-adoption.mjs --check
      # The SERVED tree (docs/) is a build output of the root tree — and until 2026-07-14 NOTHING
      # guarded it, so it drifted twice, and both times the drift reached main AND the live site:
      #   · the 8 served docs/*.html APP BUNDLES fell behind their root twins (re-bundles moved the
      #     root builds; nobody re-ran build-docs) — tepna.net served pre-1.10.0 app builds, and as
      #     late as v1.10.1 it was still serving a GlucoDex carrying the PRE-FIX long-gap DSP, i.e.
      #     counting interpolated sensor-gap samples as measured glucose for real users;
      #   · docs/llms-full.txt sat a full release behind (the Phase-2/Phase-3 ordering bug, PR #96).
      # This is the guard that would have caught both, on the PR that caused them. Same shape as the
      # two drift guards above (committed artifact ≡ build(source)); pure Node, no uploads/, no network.
      - name: Served docs/ ≡ build-docs(source) (deploy drift guard)
        run: node tools/build-docs.mjs --check
      - name: Verify bundle manifestHash ↔ BUILD-MANIFEST (provenance GATE A, headless)
        run: node tests/verify-manifest.mjs
      # Fixture verification (FIXTURE-VERIFICATION-GATE §3.1) — VISIBILITY, deliberately NOT a blocker.
      # Names any corpus-backed fixture whose COMPUTE CLOSURE moved with nothing having re-run it since:
      # an unverified reproducibility claim, which is what shipped a pre-fix GlucoDex DSP to real users.
      # It needs NO corpus to FAIL (it compares the ledger against computeHash, both committed) — but it
      # needs one to FIX, and an outside contributor has none. Blocking here would wall off contributions,
      # so the HARD wall lives in release.mjs's pre-flight instead: harm materialises on SHIP, and the
      # person cutting a release is the one who HAS the corpus. Report loudly here; block there.
      - name: Fixture verification — unverified reproducibility claims (informational)
        run: node tools/verify-fixtures.mjs --check
        continue-on-error: true

      # Ten analysis tools ship a --selftest: a synthetic corpus with PLANTED truth, which is a
      # stronger check than any real night because the right answer is known. Until 2026-08-01 not
      # one of them ran anywhere — ten known-answer harnesses that executed only when someone
      # remembered to type the flag. All ten passed when finally run, so wiring them cost nothing
      # today and stops the next one rotting unnoticed. Discovered rather than listed, so a new tool
      # is covered the moment it grows the flag.
      - name: Analysis-tool selftests (planted-truth known answers)
        run: |
          found=0; failed=0
          for f in $(grep -rln -- '--selftest' tools/*.mjs | sort); do
            found=$((found+1))
            printf '%-44s' "$f"
            if node "$f" --selftest > /tmp/selftest.log 2>&1; then
              echo 'PASS'
            else
              failed=$((failed+1)); echo 'FAIL'; sed 's/^/    | /' /tmp/selftest.log
            fi
          done
          echo "--- $found tool selftest(s), $failed failed"
          # A tool quietly LOSING its --selftest must not read as success — which is what the old
          # `-ge 10` could not do: it found 156 and asserted 10, so FIFTEEN TIMES the floor could
          # vanish and the step still passed. Measured 2026-10-11. A floor that far below the
          # population answers a question nobody asked.
          # GROW-ONLY RATCHET instead: the count may rise and must never fall. Raise EXPECTED in the
          # same PR that adds a selftest; a drop names a tool that lost its flag or became
          # undiscoverable. Never lower it to make a run pass — lowering it records that a known
          # harness stopped running.
          EXPECTED=156
          if [ "$found" -lt "$EXPECTED" ]; then
            echo "selftest count DROPPED: found $found, expected at least $EXPECTED"
            echo "a tool lost its --selftest, was deleted, or became undiscoverable to the lister"
            exit 1
          fi
          if [ "$found" -gt "$EXPECTED" ]; then
            echo "NOTE: $found > EXPECTED=$EXPECTED — raise EXPECTED in tests.yml; a ratchet nobody tightens stops being one"
          fi
          [ "$failed" -eq 0 ] || exit 1

  # ── one aggregated status ──────────────────────────────────────────────────────────
  # Keeps a single stable check name (`test`) for branch protection, independent of the
  # shard count — so the count can change without touching required-checks config.
  # `if: always()` + explicit result compare so a SKIPPED or CANCELLED shard reds the gate;
  # a bare `needs:` would let those through as "not failed".
  test:
    # measured 2026-10-11 over 29 job run(s): p95 0.1 min, max 0.1 min (tools/ci-timing.mjs `pct`). Cap = ceil(max(p95, max) × 2).
    timeout-minutes: 1
    name: test
    if: always()
    needs: [suite, static]
    runs-on: ubuntu-latest
    steps:
      - name: Gate on every shard
        run: |
          echo "suite:  ${{ needs.suite.result }}"
          echo "static: ${{ needs.static.result }}"
          if [ "${{ needs.suite.result }}" != "success" ] || [ "${{ needs.static.result }}" != "success" ]; then
            echo "::error::the test gate is RED — a shard or the static job did not succeed"
            exit 1
          fi
          echo "✓ all 6 shards + static green — their union is the full gate"
