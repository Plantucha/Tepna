#
# DIFF-SCOPED JS MUTATION — the sibling `capture-host-ci.yml` has had since #1090, and the JS side
# never did. `tools/mutate.mjs --diff` (#1003) has implemented this for months; it was simply never
# wired to a workflow, so the asymmetry was one YAML file wide, not a missing capability.
#
# WHY THIS SHAPE, and not a full sweep:
#   · A full JS fleet sweep is ~11,500 mutants ≈ 150 h. Diff-scoped is a handful of mutants and
#     seconds, and it enforces exactly "if you touched a line, some test can see it" — never judging
#     code nobody touched. `mutate.mjs`'s own header set that boundary before this file existed.
#   · It is LEDGER-AWARE for free: `--diff` runs `classifySurvivors`, so a survivor already recorded
#     in `tools/mutate-equivalence.json` as `no-distinguishing-input` does not red the gate. That
#     matters — MUTATION-PROGRAM §1 makes the ratified target `killed / DISTINGUISHABLE`, and a gate
#     using the raw denominator would demand kills that measurably do not exist.
#
# ADVISORY, DELIBERATELY (`continue-on-error`), and this is the same call `mutate_diff.py` makes.
# The argument is #1102's, learned the hard way: "A gate that runs when it has nothing to say trains
# people to ignore it." A blocking mutation gate on a repo whose equivalence classification is still
# being built (155 entries across 4 of 10 files, 2026-08-09) would block PRs on survivors nobody has
# probed yet. Promote it to required once the classification covers the files people actually touch —
# that is a decision with evidence behind it, not a default.
#
# The verdict is written to the job summary either way, so "advisory" means "does not block", never
# "invisible".
name: mutation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diff:
    name: Mutate only the JS lines this PR changed
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the gate diffs against the base; a shallow clone has no merge base
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No `npm ci`: mutate.mjs is pure Node (child_process + fs + git worktrees) and the suite it
      # runs is too. Installing would only add minutes and a dependency surface neither one uses.
      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref || 'main' }}"
      # ⚠ GitHub runs `run:` under `bash -e`, so a non-zero `node` ABORTS THE STEP — a naive
      # `node …; echo "EXIT=$?"` never reaches the echo on the only runs that matter, and the job
      # then reports the failure of a command whose verdict it never captured. `set +e` around the
      # call, the code taken from the command itself before anything else touches `$?`, and an
      # explicit `exit 0` so "advisory" is a property of THIS step rather than of a
      # `continue-on-error` that would also swallow a genuine harness crash.
      - name: Diff-scoped mutation
        id: mutate
        run: |
          BASE="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          set +e
          node tools/mutate.mjs --diff "$BASE" --json > mutation-diff.ndjson 2> mutation-diff.log
          CODE=$?
          set -e
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "mutate.mjs --diff exited $CODE"
      # THE OBJECT IS THE API (VERDICT-CONTRACT §1). This step used to render the EXIT CODE — `0 →
      # **PASS**` — and exit 0 is also what the gate returns when no mutable JS changed and what it
      # returned when the changed lines carried no mutable operator, so 273 of the 300 commits on main
      # 2026-09-14 → 09-22 read PASS on a gate that decided nothing about them (residue
      # `2026-09-22-mutation-summary-parsed-exit-code`). `mutate.mjs --diff --json` now writes a
      # `tepna.verdict/1` object as the last NDJSON line; `tools/mutation-summary.mjs` renders THAT —
      # NOT_APPLICABLE / NOT_RUN as themselves, a missing or invalid object or a status that disagrees
      # with the exit code as UNKNOWN, never as PASS. The exit code is still shown; it is for the shell.
      - name: Report the verdict
        if: always()
        env:
          CODE: ${{ steps.mutate.outputs.code }}
        run: |
          {
            node tools/mutation-summary.mjs mutation-diff.ndjson "${CODE:-none}"
            echo
            echo '```'
            tail -40 mutation-diff.log 2>/dev/null || echo '(no output)'
            echo '```'
            echo
            echo "A survivor is **not** proof of a bug — it is proof the suite cannot see a change there."
            echo "If no input can distinguish the mutant, record it in \`tools/mutate-equivalence.json\`"
            echo "via \`tools/probe-equivalence.mjs\` — never by hand (MUTATION-EQUIVALENCE §8.4), and"
            echo "never by weakening the assertion that would otherwise have caught it."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the verdict
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-diff-js
          path: |
            mutation-diff.ndjson
            mutation-diff.log
          if-no-files-found: ignore
