name: secret-scan

# Diff-scoped secret gate (owner, 2026-10-20): scans only the commits a PR adds, with the pinned
# scanner and the repo rules in .gitleaks.toml. tools/secret-scan.mjs emits the tepna.verdict/1 object.
#
# It is NOT a required context yet. Measured 2026-10-20 over the last 400 commits on main, 34 would
# have red, 31 of them for a home-directory path in a brief, handoff or residue row. Making the
# context required is the owner's decision, through the protect-main ruleset.
#
# The private literals (device addresses, host names) come from the TEPNA_PRIVATE_TERMS secret, one
# per line. Without it, the pattern rules still run and the tool prints a warning.

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    # Not yet measured in CI. A local run over 400 commits took under 10 s; a cap of 5 leaves room for the download.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the merge base must be reachable; the tool refuses a shallow clone

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install the pinned scanner, verified by checksum
        env:
          GL_VERSION: 8.30.1
          GL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          T="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          # GitHub's release CDN answered 504 for this asset on and off from about 08:00Z to past
          # 10:16Z on 2026-11-08, and every PR's secret-scan went red on the download alone.
          # curl retries a 5xx, a 408 and a 429 by itself, inside the job's 5 min cap; the checksum still decides.
          curl -sSfL --retry 8 --retry-delay 10 --retry-max-time 150 --connect-timeout 20 \
            -o "/tmp/$T" "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/$T"
          echo "${GL_SHA256}  /tmp/$T" | sha256sum -c -
          mkdir -p /tmp/gl && tar -xzf "/tmp/$T" -C /tmp/gl gitleaks
          /tmp/gl/gitleaks version

      - name: Scan the commits this PR adds
        env:
          GITLEAKS: /tmp/gl/gitleaks
          TEPNA_PRIVATE_TERMS: ${{ secrets.TEPNA_PRIVATE_TERMS }}
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'origin/main' }}
        run: node tools/secret-scan.mjs --base "$BASE_REF"
