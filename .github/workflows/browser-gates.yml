name: browser-gates

# The heavy render-coverage gate: the ONLY lane that boots the shipped bundles. The Node suite
# (tests.yml) runs the SOURCE modules and never loads a bundle; GATE A/B are hashes and prove a
# bundle MATCHES its inputs, never that it WORKS. So a bundle that hashes correctly, whose source
# is green, and that crashes on boot is invisible to every other lane.
#
# It was `workflow_dispatch:`-only until 2026-07-22, which meant nobody ran it: its last three runs
# had all FAILED, the most recent on 2026-07-15, and it stayed red and unnoticed for a week. A gate
# that only runs when someone remembers is not a gate. It now runs on every PR.
#
# ── Why paths-IGNORE (a denylist) and not paths (an allowlist) ──────────────────────────────────
# Same reasoning as `computeHash`'s compute closure (CLAUDE.md §🔒): an allowlist that forgets a
# path fails OPEN — the gate silently stops running for exactly the change that needed it — while a
# denylist that forgets one merely runs the gate unnecessarily. We accept wasted minutes; we do not
# accept a blind gate. Each ignored path below was CHECKED to feed no served artifact and no scanned
# surface: `suite.manifest.json.authoritativeContext` (what llms-full.txt concatenates) is exactly
# README/ORIENTATION/ARCHITECTURE-PRINCIPLES/docs-LEXICON/docs-WHY-THIS-EXISTS, and no-network.html
# scans capture-host/*.py + the analysis surfaces — none of which live under briefs/ audits/ changes/.
# Do NOT add `**/*.md` here: README.md IS concatenated into the served llms-full.txt.
#
# ── Why the denylist moved OFF the trigger and INTO a job (2026-07-27) ──────────────────────────
# `browser-gates` is now a REQUIRED status check, and a required check must actually REPORT. The two
# ways to skip a workflow are NOT equivalent:
#   * workflow-level `paths-ignore:` → the workflow never runs → NO check run is ever created → the
#     required check sits in "Expected — waiting for status" and the PR is blocked FOREVER;
#   * job-level `if:` → the workflow runs, the job reports conclusion `skipped`, and GitHub counts a
#     skipped job as satisfying the requirement.
# So the denylist below is unchanged in MEANING — briefs/ audits/ changes/ still do not pay the two
# minutes — it just had to move somewhere that still files a report. This is the same trap that let
# capture-host-ci sit unrequired while its coverage floor merged red (#469 → #472).
on:
  pull_request:
  workflow_dispatch:
  # MERGE QUEUE. The queue tests a PR against the tip it will actually land on, so the required
  # checks MUST fire on `merge_group` — a queue whose checks never run waits forever and jams
  # every merge in the repo. This trigger is wired BEFORE the queue is enabled, deliberately:
  # the reverse order is an outage (BRIEF-COLLISION-RESIDUAL-GAP-2026-08-09-BRIEF §4).
  merge_group:

# A 2-minute gate on a busy PR: keep only the newest run per ref.
concurrency:
  group: browser-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The denylist, evaluated as a job so the gate below can be SKIPPED rather than never scheduled.
  # Deliberately the same denylist semantics as the retired `paths-ignore:`: the gate runs unless
  # EVERY changed file is under briefs/ audits/ changes/. Forgetting a path here therefore runs the
  # gate unnecessarily; it can never silently disable it (CLAUDE.md §🔒's fail-closed rule).
  changes:
    # THIS WORKFLOW RUNS ON NO PUSH, so a main sample reaches neither job here and row
    # `2026-11-03-ci-timing-reaches-no-pull-request-only-job` left this cap unsourced. The
    # 2026-10-11 line below read 29 job run(s) off the main sample, which cannot contain one:
    #   p95 0.7 min, max 1.1 min (tools/ci-timing.mjs `pct`). Cap = ceil(max(p95, max) × 2) = 3.
    # Re-measured through the workflow's own runs (tools/ci-timing.mjs --workflow
    # browser-gates.yml --event pull_request --limit 100):
    # measured 2026-11-05 over 100 job run(s), window 2026-11-04T08:13Z → 2026-11-05T12:18Z:
    # p90 46s, max 1m51s, 5 run(s) ended in a concurrency cancel, so that max is a lower bound.
    # THAT PAGE MISSES THE BINDING OBSERVATION, exactly as `stale-file`'s own page does. Board
    # #2031 read this job CANCELLED at 3m06s against the cap of 3 on 2026-10-28 — a cap-kill, so
    # its real runtime is unknown and at least 3m06s. The page alone sizes the cap at 4, which
    # leaves 1.29× over that bound and sits under the rule's own factor, on a REQUIRED context
    # the walker never re-runs once a cap cancels it.
    # Cap = ceil(max(p95, max) × 2) over 3m06s = 7; max bounds p95. Row
    # `2026-11-05-a-new-cap-ignored-a-censored-cap-kill` records the 4 this file carried for one
    # merge. A page whose max carries no cancel re-derives this downward.
    timeout-minutes: 7
    name: relevance (browser-gates)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # both endpoints of the PR diff must be present
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"   # a manual dispatch always means "run it"
            exit 0
          fi
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" \
                                          "${{ github.event.pull_request.head.sha }}")
          echo "changed files:"; echo "$changed"
          # Pure-shell `case`, NOT grep. `grep -qv` is not portable enough to gate a required check on:
          # it returns the wrong exit status under ugrep (which is what `grep` resolves to on at least
          # one dev machine here), and a filter that mis-answers in the SKIP direction is a blind gate —
          # the one outcome this file's header refuses. `case` is POSIX and behaves identically everywhere.
          run=false
          if [ -z "$changed" ]; then
            run=true                      # no diff to judge ⇒ run, never silently skip
          else
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                briefs/*|audits/*|changes/*) ;;   # ignored, per the denylist above
                *) run=true ;;                    # anything else ⇒ the gate is relevant
              esac
            done <<< "$changed"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"     # false ⇒ job skipped, which SATISFIES the requirement
          echo "decision: run=$run"

  browser-gates:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Same wedge class as no-network (2026-08-19): a hung run sat in_progress 30–65 min against a
    # 4–7 min success history. Terminal-and-visible beats pending-forever.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      # CACHE THE BROWSER, NOT THE npm PACKAGE. `playwright install` downloads a ~170 MB chromium
      # build on every run; the npm package itself is small and `--no-save` keeps it out of the
      # lockfile. The key is the PLAYWRIGHT VERSION because the browser build is pinned to it — a
      # version bump must miss the cache, or the run would test an old chromium against a new client
      # and the mismatch would surface as a browser-gate failure nobody could reproduce locally.
      # restore-keys is deliberately ABSENT for the same reason: a near-miss restore is exactly the
      # mismatch this key exists to prevent, so a miss must be a clean download.
      - name: Cache the Playwright chromium build
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-1.48.0-${{ runner.os }}
      - name: Install Playwright (chromium only)
        run: |
          npm install --no-save playwright@1.48.0
          # --with-deps installs OS packages too, and those are NOT in the cached path, so it runs
          # either way. On a cache hit the browser download is skipped and only the apt work remains.
          # THE apt HALF IS NOT THE GATE, SO IT MUST NOT BE ABLE TO RED ONE. Measured 2026-11-11: the
          # hosted runner lost DNS for the three Ubuntu mirror hosts, `--with-deps` failed to fetch ten
          # FONT packages, playwright exited 100, and BOTH required browser contexts redded on every PR
          # in the repo at once. The chromium build itself comes from the cache step above, so the apt
          # work adds fonts and X font utilities and nothing the DOM assertions read. The fallback
          # therefore installs the browser without the OS packages and ANNOUNCES that it did, because a
          # font-less run must never read as a full one. A browser that still cannot install fails here.
          # THE BOUND, and it has its own measurement. Over the last 18 runs of each workflow (28 step
          # instances, read 2026-11-11): a runner that reached the mirrors finished in 12 s to 18 s (6
          # instances; the 2026-07-12 efficiency audit measured apt at 10.5 s for 9 packages). A runner
          # that lost the mirror DNS sat in apt retries for 606 s to 611 s (19 instances), and one
          # reached 1186 s, where `timeout-minutes: 20` killed the JOB (run 43047834492, head
          # 593c99020): the fallback below was never reached and the gate examined nothing. So the apt
          # wait, unbounded, can outlast the job. 120 s is about 6.7 times the measured healthy maximum
          # and about one fifth of the degraded cluster, so a slow mirror still wins and a dead one
          # fails fast. `timeout` signals playwright, and a sudo apt child can outlive it holding the
          # dpkg lock; the fallback never calls apt, so that costs nothing here.
          rc=0
          timeout --kill-after=10 120 npx playwright install --with-deps chromium || rc=$?
          if [ "$rc" != 0 ]; then
            # `if ! cmd; then` would read `$?` as 0 here, because `!` negates the pipeline status.
            if [ "$rc" = 124 ] || [ "$rc" = 137 ]; then
              echo "::warning title=Playwright OS deps timed out::--with-deps did not finish inside 120 s, so this run installed chromium alone. Text rendering may differ from a full run."
            else
              echo "::warning title=Playwright OS deps unavailable::--with-deps could not install the OS font packages (exit $rc), so this run installed chromium alone. Text rendering may differ from a full run."
            fi
            npx playwright install chromium
          fi
      - name: Serve the repo
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/Dex-Test-Suite.html >/dev/null && break
            sleep 0.5
          done
      - name: Run browser gates (render-coverage + provenance)
        env:
          BASE_URL: http://127.0.0.1:8080
        run: npm run gates:browser
