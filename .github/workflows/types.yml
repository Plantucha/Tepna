name: types

# Phase 4a — machine-checked contracts (SIGNAL-ADAPTER-AND-FRONTIER brief).
# Runs `tsc --noEmit --checkJs` over the clean CORE adapter layer (tsconfig.json).
# CI-ONLY: it emits nothing, ships nothing, adds no runtime dependency or CDN —
# the 100%-local / single-file / offline invariant (CLAUDE.md §5.3) is untouched.
# This is a dev-time gate that gives the next coder a precise, checkable target;
# it is independent of the Node assertion suite (tests.yml) and the browser
# gates (browser-gates.yml).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # MERGE QUEUE. The queue tests a PR against the tip it will actually land on, so the required
  # checks MUST fire on `merge_group` — a queue whose checks never run waits forever and jams
  # every merge in the repo. This trigger is wired BEFORE the queue is enabled, deliberately:
  # the reverse order is an outage (BRIEF-COLLISION-RESIDUAL-GAP-2026-08-09-BRIEF §4).
  merge_group:

# Supersede an in-flight run when the same PR is pushed again — the guarded house pattern; full
# measured rationale in tests.yml (the 43-min dead-SHA run) and capture-host-ci.yml (why PR-only).
concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Type-check CORE contracts (tsc --noEmit --checkJs)
        run: npx -y -p typescript@5.5.4 tsc --noEmit -p tsconfig.json
