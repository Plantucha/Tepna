# Owner 2026-10-18: the daily vigil pull goes to the Synology, not rig's /srv/data (it filled that disk
# every day 2026-10-14..18, rsync exit 11). The guard refuses to run when the NFS mount is absent, so
# the pull can never fall through into an empty /mnt/synology directory on rig's own disk.
[Service]
ExecStartPre=/usr/bin/mountpoint -q /mnt/synology
Environment=TEPNA_ARCHIVE_DEST=/mnt/synology/tepna-backup/vigil-archive/captures
