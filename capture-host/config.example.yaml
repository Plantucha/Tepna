# tepna-capture — example config.  Copy to config.yaml and edit.
# Copyright 2026 Michal Planicka · SPDX-License-Identifier: Apache-2.0

# Where nightly captures are written. The web server serves <root>/app; captures land under
# <root>/captures/<YYYY-MM-DD>/, rolled by the recording's LOCAL start date (writers.night_dir).
# There is NO staging directory: the daemon writes straight into the dated night folder, so nothing
# has to be moved afterwards and an interrupted night is already where you would look for it.
root: /srv/tepna
adapter: "XX:XX:XX:XX:XX:XX"            # BLE adapter MAC for bonding (bluetoothctl select). Omit = default
                                        # controller. On a multi-radio host, pin the bedside dongle here.

web:                                    # monitor + control page (HEALTH-BOX-VISION §4 live-view). Bind LAN only.
  enabled: true
  host: 0.0.0.0                         # the box serves the LAN; use 127.0.0.1 for a localhost-only test
  port: 8760
  # token: ""                          # optional shared secret: when set, every CONTROL action (POST —
                                        #   bond/forget/remember/pull/settings/clock) needs it; GET reads
                                        #   stay open so the monitor still displays. Send it as
                                        #   `Authorization: Bearer <token>` or `X-Tepna-Token: <token>`.
                                        #   Default absent = wide open (fine on a trusted home LAN).

watchdog:                               # auto-recover a WEDGED BLE controller (frozen-monitor failure).
  enabled: true                         #   Acts ONLY on unambiguous wedge signs (InProgress / phantom
  interval_sec: 60                      #   BlueZ link) — NEVER on 'sensors not worn' (clean not-found).
  grace_checks: 2                       #   consecutive wedged checks before a controller power-cycle
  recover_checks: 2                     #   consecutive CLEAN checks before the wedge count is cleared.
  #                                     #     The mirror of grace_checks: one bad poll must not escalate,
  #                                     #     and one good poll must not un-escalate. Without it a
  #                                     #     FLAPPING adapter reset the count every other poll and the
  #                                     #     ladder was never reached (~65 min deferred, 2026-07-24).
  #                                     #     <=1 restores the old behaviour: recover on the first
  #                                     #     clean poll.
  max_adapter_cycles: 3                 #   hard cap so recovery can never loop (external supervisor beyond)
  hci_reset: true                       #   escalation: after the soft power-cycle, `hciconfig <hci> reset`
  # usb_path: "3-1"                     #   LAST-RESORT: re-enumerate the USB dongle (unbind+bind) on the
  #                                     #     final cycle — the only thing that clears an RTL8761B firmware
  #                                     #     hang a soft toggle can't. Set to the bus-port from
  #                                     #     `ls /sys/bus/usb/devices/`. OFF by default.
  # exit_on_giveup: true                #   after exhausting cycles, exit non-zero so systemd re-execs with
  #                                     #     a fresh bleak/D-Bus stack instead of looping deaf all night.

link:                                   # weak-signal warning. Stream-rate health (packet rate vs nominal)
  rssi_enabled: true                    #   is always on & needs no privilege. RSSI dBm enrichment needs a
  rssi_interval_sec: 25                 #   NOPASSWD-sudo helper (tepna-rssi.sh) — connection RSSI is root-
  rssi_retry_sec: 600                   #   only on BlueZ. Without the grant it backs off to this slow
                                        #   re-probe (never stops), so a grant added while the daemon is
                                        #   already running is picked up with NO restart.

# Host clock MUST be NTP-synced and set to your real local timezone — arrival stamps depend on it.
# Stored values are floating wall-clock (Clock Contract); we write the LOCAL civil time, zone-free.
time:                                   # device-clock discipline. The box pushes ITS clock into every
  auto_sync_devices: true               #   sensor, so an undisciplined host makes a night self-consistently
  drift_check_sec: 300                  #   wrong. Poll each device's on-sample clock this often, and re-sync
  resync_jump_sec: 30                   #   only when it has drifted more than resync_jump_sec (avoids churn).
  provenance_poll_sec: 120              #   how often host_clock_poller records the host's own clock trust
                                        #   to the <night>/*_CLOCK.csv sidecar (provenance, not discipline).

devices:
  # Polar H10 chest strap — raw ECG (MANDATORY live stream; onboard keeps only HR/RR).
  - name: Polar H10
    vendor: Polar
    model: H10
    device_id: AAAAAAAA          # short stable id used in filenames + companion pairing (one per physical sensor)
    address: "XX:XX:XX:XX:XX:XX" # BLE MAC (find with: bluetoothctl scan on). Passing MAC > name = faster/robust connect.
    streams: [ecg, acc, hr]      # ecg = the node input; acc/hr = sidecars (paired by device_id+stamp)
    # optional: true            # KNOWN-BUT-NOT-EXPECTED backup device. When set: a connect-timeout is noted
    #                           #   ONCE then quiet (no per-cycle warning spam), the reconnect backs off long
    #                           #   (2-5 min), and nightqc does NOT count its absence as `missing` or flag the
    #                           #   night not-ok. Use for a spare strap you rarely wear (e.g. a backup HR belt).

  # Polar Verity Sense armband — PPG (+ motion). Live OR press the button for onboard offline.
  - name: Polar Verity Sense
    vendor: Polar
    model: VeritySense
    device_id: BBBBBBBB
    address: "YY:YY:YY:YY:YY:YY"
    streams: [ppg, acc]
    # SDK MODE — unlocks the device's extended rate menu (PPG 28/44/55/135/176; ACC/GYRO to 416).
    # WITHOUT IT THE VERITY OFFERS PPG AT 55 Hz ONLY, so the `ppg: 176` below is silently ignored:
    # `polar_pmd.chosen_rate` honours a configured rate only if the device OFFERS it and otherwise
    # falls back, by design, rather than failing the stream. Entered on every connect (it does not
    # survive a power cycle) and it requires every stream stopped first.
    #
    # The daemon does not trust its own ACK — it asks the device and publishes the answer as
    # `status.devices[…].sdk_mode`: true / false / **null when the device never said**. Null is NOT
    # false; the monitor renders it as its own state. Settable from the monitor's Settings card, which
    # only offers the switch on hardware advertising feature 0x9.
    sdk_mode: true
    rates:
      # 176 Hz IS AN OPERATIONAL CALL, and should be read as one rather than as a technical result.
      # Measured on this hardware by decimating ONE night, so subject and physiology are held fixed
      # (`PPG-SAMPLE-RATE-AND-PAT`): rMSSD, per-epoch HR error and PAT residIQR are all FLAT from 44 Hz
      # up — 37.8 ms and 18.6 ms at both 44 and 176 — for 8.60 %/h against 4.74, i.e. ~11.6 h of
      # runtime instead of 21.1. That is one night per charge instead of two. The floor that matters is
      # 25 Hz (below it interpolation fails and PAT precision doubles); on the evidence alone the
      # recommendation is 44–55 Hz. 11.6 h against a ~6 h night is ample, and that is the case for 176.
      ppg: 176
      # ⚠️ GYRO and MAG: `DEVICE-RATE-TRUTH` §5 decides both OFF — drop them from `streams` above rather
      # than setting a rate here. They are 98.4 MB of the armband's 254.4 MB night. GYRO is not unused
      # (it is the max in 99.18 % of PpgDex's motion-index cells) but that is a flat ~3.85 dps pedestal
      # rather than sensitivity, so it changes 0.33 % of gating decisions — `VERITY-OFFLINE-VS-STREAMING`
      # §3. Expect `meanMotionIndex` to fall from ~0.11 to ~0.04 the first night after; that is the
      # pedestal leaving, not a regression.
      acc: 26

  # Muse S — raw EEG. Captured via a child tool, NOT bleak directly. Pick by firmware:
  - name: Muse S
    vendor: Muse
    model: S
    device_id: DDDDDDDD
    address: "ZZ:ZZ:ZZ:ZZ:ZZ:ZZ"
    streams: [eeg]
    muse_tool: muselsl           # "muselsl" (Muse 2 / S gen 1-2) | "openmuse" (Muse S Athena)

  # Wellue O2Ring-S / T8520 (advertises as "S8-AW …") — LIVE SpO2 + pulse via the OxyII protocol
  # (run_oxyii; no bond, no vendor-app round-trip). Older O2Rings on the legacy Viatom protocol:
  # add `protocol: legacy` to route them through run_viatom instead.
  - name: Wellue O2Ring-S
    vendor: Wellue
    model: O2Ring-S
    device_id: CCCCCCCC
    address: "WW:WW:WW:WW:WW:WW"        # Random-Static MAC — rotates on factory reset; re-scan if it changes
    streams: [spo2]

# Lingo (CGM) and CPAP (EDF) are NOT live-captured — drop their exports into captures/<night>/:
#   - Lingo:  encrypted/locked  -> Health Connect / Apple Health export -> drop in   (how-to-collect/libre-cgm.md)
#   - CPAP:   SD card / ezShare Wi-Fi SD pull of DATALOG/*.edf -> drop in             (how-to-collect/cpap-edf.md)

# ── Storage guard (optional) ──────────────────────────────────────────────────────────────────────────
# The box writes ~1.2 GB/night, unattended, forever. Without a policy a full disk silently loses every
# subsequent night. Retention is OPT-IN: keep_nights: 0 never deletes. min_free_gb only ALERTS (see below)
# — it never eats recent recordings to chase space.
storage:
  keep_nights: 0          # delete night dirs older than the newest N (0 = never prune; tonight is always kept)
  min_free_gb: 2          # warn (status.json + alert) when free space drops below this
  poll_sec: 300
  settle_sec: 1200        # a night with no writes for this long is "complete" — the anchor QC/archive/
                          # retention use so a session running PAST MIDNIGHT is judged on file activity,
                          # not the wall-clock date (which would truncate the live night at 00:00).

# ── Device tuning (optional; sane defaults if omitted) ──────────────────────────────────────────────────
stream:
  stall_sec: 90           # started-stream silence before a session is torn down & re-negotiated (0 = off).
                          #   Trusts BYTES, not a handshake: a live link delivering no data is a dead stream.
power:                    # duty-cycle a Polar strap that reports NOT WORN, to save its battery overnight.
  drop_not_worn_sec: 180  #   continuous not-worn before dropping the link (0 = never drop on wear state)
  not_worn_recheck_sec: 90 #  once dropped, how often to reconnect and re-check for skin contact
o2ring:                   # Wellue O2Ring-S / T8520 specifics.
  ppg_fs: 125.738         #   per-unit 125 Hz pleth sample rate (2026-07-18 5.8 h calibration; overrides only
                          #   the timestamp step — the ring's true rate varies slightly per unit)
  rtc_resync_sec: 21600   #   drift backstop: re-push host time into the ring at least this often (6 h)
  ppg_gap_min_ms: 40      #   honest-gap threshold. The ring sends no clock, so samples ride a synthesized
                          #   grid; when BLE loses a frame the survivors must NOT be laid down contiguously
                          #   across the hole (that compresses time and fabricates beat-to-beat variability).
                          #   A hole larger than this is recorded as a real gap. 40 ms sits between the
                          #   measured arrival jitter (sd 16 ms, p95 29 ms) and real losses (median 49 ms).

# ── Push alerts (optional, disabled by default) ───────────────────────────────────────────────────────
# A generic webhook (ntfy.sh, Discord/Slack/Telegram bridge, Home Assistant …). Fires on: a sensor offline
# past offline_sec, its recovery, the daemon (re)starting, and low disk. A lost bedside night is
# unrecoverable — this is the difference between fixing it at 1am and finding out at breakfast.
#
# SETTABLE FROM THE MONITOR — Settings -> Push alerts. That is the intended way to set it on a headless
# box, and the field applies to the RUNNING daemon (no restart, so no dropped BLE links mid-night).
# The monitor will never display a saved URL back to you: for ntfy/Discord/Slack/Telegram the URL *is*
# the credential and the page is LAN-reachable, so it shows only a scheme+host hint. To change it, type
# a new one; leave the field empty and save to keep the current one.
alerts:
  enabled: false
  webhook_url: ""         # e.g. https://ntfy.sh/your-private-topic   (POSTs {"title","message"} JSON)
  offline_sec: 300        # a configured sensor offline this long → alert (edge-triggered; no flap spam)
  poll_sec: 60

# ── Per-night QC summary (optional) ───────────────────────────────────────────────────────────────────
# Rolls up tonight's capture completeness — rows per configured stream, and which declared streams produced
# NOTHING (the header-only files a rejected PMD START or a never-worn sensor leaves). Written to
# <night>/QC-SUMMARY.json and surfaced in status.json as `qc`; read-only, creates no empty folders.
qc:
  poll_sec: 600
  alert_after_sec: 3600   # if a declared stream is STILL empty this long into a night, alert once (needs
                          # alerts.webhook_url). The grace avoids false alarms on a just-started night.

# ── Night offload / archive (optional, disabled by default) ────────────────────────────────────────────
# MIRROR each completed night (not tonight) to a destination — a NAS mount, the tepna-web served dir, a
# backup disk — so finished nights land where they get analysed. Idempotent + resumable; never moves the
# source (the storage guard prunes it on its own schedule).
archive:
  enabled: false
  dest: ""                # e.g. /mnt/nas/tepna  or  /srv/tepna/app/captures
  poll_sec: 3600
  # Non-night trees under captures/ to mirror as well. Nights are the obvious case; these two are not,
  # and they sat outside the backup entirely until 2026-08-01 (audit F2):
  #   stored/  the ONBOARD device-flash pulls — the backup that exists BECAUSE the live BLE link is
  #            lossy. The O2Ring's flash is a small FIFO, so once it rotates the box copy is the only
  #            one that exists anywhere. Measured 1.5 MB.
  #   cpap/    199 nights of harvested ResMed EDFs. Measured 534 MB, and the SD card in the machine is
  #            a de-facto second copy, so this one is the weaker case — drop it if space is tight.
  # For scale: ONE night is ~942 MB, so both together are ~0.4 % of a single night.
  # `incoming/` (partial in-flight downloads) is refused in code and cannot be added here — a mirrored
  # partial looks like data. Mirrored trees are still NEVER pruned; see nightarchive.mirror_subtree.
  include_subtrees: [stored, cpap]
pull:                     # AUTO-PULL the O2Ring's onboard .dat off flash — the belt-and-suspenders backup
  auto: false             #   for a lossy live BLE link (weak signal / dongle in another room). Off by default.
  auto_interval_sec: 3600 #   how often to check; it only pulls while the ring is OFF the finger (never
  auto_retries: 3         #   interrupts a live sleep). Retries per cycle to DRAIN the small FIFO flash
  ftype: 0                #   before a missed session is overwritten. Idempotent — skips what's on disk.
  on_charger: true        #   FAST event trigger: pull a device's onboard sessions `charger_settle_sec`
  charger_settle_sec: 15  #   after it goes ON THE CHARGER (a night ends → device docked). Applies to the
                          #   O2Ring (.dat) AND Polar Verity/H10 (PS-FTP), not just the hourly cadence above.
cpap:                    # ResMed card auto-harvest over an ez Share Wi-Fi SD adapter.
  enabled: false         # opt-in; see briefs/CPAP-AUTOHARVEST-2026-07-26-BRIEF.md
  at_hour: 13            # local hour, ONCE daily. NOT 09:00 — measured on the real card, 6 of the 14
                         # most recent nights were still being written after 09:00 (last-write
                         # 08:35→12:02, median 08:56), and the LATE files are the big ones: on
                         # 20260725 CSL/EVE landed 03:50/06:42 but PLD, SA2 and BRP (the 25 Hz flow
                         # waveform CPAPDex reads) all landed 10:10. 13:00 clears the latest by ~1 h.
  wifi_profile: ezshare  # NetworkManager profile for the card's AP; MUST carry ipv4.never-default yes.
                         # ⚠️ Consulted ONLY on the nmcli backend. With no NetworkManager installed —
                         # which is the vigil box — the wpa_supplicant path runs instead and never
                         # reads this key. There, `wifi_iface` is the setting that matters.
  # wifi_iface: wlp1s0   # wpa backend only. Default: the box's first `wl*` under /sys/class/net.
                         # Set it when the box has several radios, or the discovered one is not the
                         # dongle you mean. A wrong interface now fails fast and NAMES itself, instead
                         # of surfacing as "Wi-Fi profile 'ezshare' would not come up safely" — the one
                         # setting this branch never reads (CAPTURE-HOST-DEEP-AUDIT §E5).
  base_url: http://192.168.4.1
  dest_subdir: captures/cpap   # native ResMed layout mirrored verbatim (§7: no new parser branch)
  max_run_sec: 5400      # hard cap. First backfill ~492 MB @ ~130 KB/s ≈ 65 min; a night ≈ 20 s.
  timeout_sec: 20        # per request — the card drops requests under sustained load
  retries: 5
  # Live waveform over BLE (separate from the Wi-Fi harvest above). The monitor's "Start live stream"
  # button pushes the CPAP's flow + pressure onto the Live-streams grid. Always wired; it does nothing
  # until the button is pressed, and then only if credentials exist AND no wearable is capturing (a BLE
  # stream must not transmit beside the sensors). READ-ONLY.
  ble_stream:
    adapter: hci1              # the FREE radio — never the one the wearables capture on (hci0 default)
    # creds_path: as11_creds.json   # AS11 pairing creds (masterPairKey/clientId/ble_addr); default is
                                     # beside this config file. Written by the pairing flow / operator probe.

# AS11 CPAP session detector (SHADOW — observes only, drives nothing). When enabled, a background task
# short-connects the AS11 on the CPAP free radio (cpap.ble_stream.adapter, hci1) ONLY while the live
# stream is idle, classifies therapy start/stop, and writes SESSIONDETECT.csv + AS11CLOCK.csv (device
# clock offset + rate anchors) beside the night's captures. READ-ONLY; it drives no capture. Default OFF —
# flip `enabled` on to gather a shadow night before acting mode (a separate increment) is built.
as11_detector:
  enabled: false
  poll_interval_sec: 30
