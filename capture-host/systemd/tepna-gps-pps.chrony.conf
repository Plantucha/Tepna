# tepna-capture — systemd/tepna-gps-pps.chrony.conf → /etc/chrony/conf.d/tepna-gps-pps.conf
# Copyright 2026 Michal Planicka · SPDX-License-Identifier: Apache-2.0
#
# The LAN's STANDARD stratum-1 shape, copied from the digipi: the hardware pulse disciplines the clock,
# the network sources resolve which second it is. No `lock GPS`, no `refclock SHM`: gpsd's u-blox SHM
# export was measured to stall while the fix stayed solid, and a PPS locked to a dead feed drops the box
# to stratum 2 without a word. Without `lock`, chrony takes the second from the LAN's other stratum-1
# servers, both within microseconds, and the PPS sets the edge.
#
# Installed by deploy/enable-gps-stratum1.sh, which renders @LAN_CIDR@ from TEPNA_LAN_CIDR or, unset,
# from the subnet of the box's own default-route interface — the network layout is never written here.
refclock PPS /dev/pps0 refid PPS precision 1e-7 prefer
# Serve the LAN, politely.
allow @LAN_CIDR@
ratelimit interval 3 burst 8
# Keep serving at stratum 10 if every source dies; orphans elect by reference ID.
local stratum 10 orphan
