# tepna-gps-pps.chrony.conf — Tepna Vigil  (installed as /etc/chrony/conf.d/tepna-gps-pps.conf)
# Copyright 2026 Michal Planicka · SPDX-License-Identifier: Apache-2.0
#
# The LAN's STANDARD stratum-1 shape, copied from digipi (.75): the hardware pulse disciplines the clock,
# the network sources number the seconds, and the box serves the LAN. Deliberately NO `lock GPS` and NO
# `refclock SHM`: on digipi gpsd's u-blox SHM export stalled within minutes and `lock GPS` chained the PPS
# to that dead feed, killing the PPS with it (DIGIPI 2026-09-16). Without `lock`, chrony resolves WHICH
# second from the NTP250 (.123) and digipi (.75), both within microseconds, and the PPS sets the edge.
# chrony rejects inline `#` on directive lines — comments stay on their own lines.
refclock PPS /dev/pps0 refid PPS precision 1e-7 prefer

# Serve the LAN; rate-limit strangers; keep serving (stratum 10, orphan) if every source dies.
allow 192.168.0.0/24
ratelimit interval 3 burst 8
local stratum 10 orphan
