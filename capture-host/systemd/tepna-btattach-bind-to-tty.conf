# tepna-capture — systemd/tepna-btattach-bind-to-tty.conf
# Copyright 2026 Michal Planicka · SPDX-License-Identifier: Apache-2.0
#
# A DROP-IN FOR tepna-btattach@.service, installed as
# /etc/systemd/system/tepna-btattach@.service.d/bind-to-tty.conf.
#
# `99-tepna-btattach-hotplug.rules` names each board's tty at /dev/tepnabt/<usb-serial>, which systemd
# tracks as the device unit `dev-tepnabt-<usb-serial>.device`. `BindsTo=` stops this instance the moment
# that device goes away, and `After=` holds the start until the device is there. Without the stop half,
# the old instance keeps its line discipline on a tty the kernel has renumbered, which is the defect the
# rule exists to end.
#
# The template keeps `WantedBy=multi-user.target` as the coldplug route, and the 2026-11-01 reboot
# showed both routes give exactly one start (board #2892).
[Unit]
BindsTo=dev-tepnabt-%i.device
After=dev-tepnabt-%i.device
