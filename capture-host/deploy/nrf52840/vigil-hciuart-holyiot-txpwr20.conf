# Vigil overlay for NCS hci_usb with the SoftDevice Controller — pass 1 (generic symbols only).
# Derived from capture-host/deploy/flash-nrf52840-hci.sh's Zephyr-LL overlay; SDC-specific buffer
# symbols are added in pass 2 AFTER reading the generated .config, because an unknown symbol in a
# conf fragment fails the build loudly (good) but a Zephyr-LL-only symbol that Kconfig prunes fails
# SILENTLY (the exact class the flash script's step-4 grep exists to catch).

# Prove we got the SoftDevice Controller, not the open-source LL — if this symbol doesn't exist we
# are not building in NCS context and the build must fail here.
CONFIG_BT_LL_SOFTDEVICE=y

# 4 configured sensors + headroom for a reconnecting device holding its old link.
CONFIG_BT_MAX_CONN=6

# Data Length Extension — the single highest-value line (H10 ECG ~130 Hz + Verity PPG/ACC concurrent).
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251

# HCI transport buffer counts (host-facing; valid in HCI_RAW controller builds).
CONFIG_BT_BUF_ACL_TX_COUNT=12
CONFIG_BT_BUF_EVT_RX_COUNT=16

# 2M PHY — halves air time per packet; what actually buys concurrent-stream headroom.
CONFIG_BT_CTLR_PHY_2M=y

# link_rssi.py polls RSSI every 25 s; without this the LINK.csv sidecar silently goes blank.
CONFIG_BT_CTLR_CONN_RSSI=y

# bonding.py bonds every PMD sensor — explicit so a defconfig change cannot drop it.
CONFIG_BT_CTLR_LE_ENC=y

# ── pass 2: SDC-specific, symbol names read from the pass-1 generated .config ──
# Per-link packet buffers. SDC defaults are TX=3/RX=2 — thin for 4 concurrent streaming centrals
# (H10 ECG ~130 Hz + Verity PPG/ACC). RAM was at 18.7% after pass 1; spend some on headroom.
CONFIG_BT_CTLR_SDC_TX_PACKET_COUNT=6
CONFIG_BT_CTLR_SDC_RX_PACKET_COUNT=6

# NOTE: SDC_PERIPHERAL_COUNT=0 was tried and REFUSED by SDC's own BUILD_ASSERT (hci_driver.c:67 —
# CONFIG_BT_PERIPHERAL enabled requires >=1). Kept at the default 1: BT_MAX_CONN=6 minus 1 peripheral
# still gives 5 central links = 4 sensors + reconnect headroom, the design target.

# Controller-side connection-event anchor timestamps (VS event 0xff/0x82, enable opcode 0xfd1f):
# the radio clock source the RADIO-CLOCK sidecar reads. Off by default in SDC; costs nothing until enabled per link.
CONFIG_BT_CTLR_SDC_CONN_ANCHOR_POINT_REPORT=y

# USB product string carries the image identity so a box can tell the anchor image from its predecessor
# from `lsusb` alone, with no privileged HCI probe (Wren, 2026-09-07: 2fe3:000b is the same before and after).

# ── DISABLE CONTROLLER PRIVACY — the fix for the 0x202d wedge ──
# MEASURED on vigil 2026-09-10: `LE Set Address Resolution Enable` (0x202d) never returns; BlueZ
# disables address resolution during every connection setup, so each attempt stalls and nothing stays
# connected. With no LL Privacy advertised the resolving list does not exist and the command is never
# sent. Confirmed on hardware 2026-09-11: `ll-privacy` absent from supported settings on three units,
# and the anchor report (0xfd1f) still answers status 0x00 — the two changes are independent.
# Given up: controller-side RPA resolution. Free here — every peer is a fixed address (standing ruling).
CONFIG_BT_CTLR_PRIVACY=n

# ── HCI TRANSPORT: USB CDC ACM, not raw hci_usb ──
# WHY THIS BUILD EXISTS. `hci_usb` wedges on CONCURRENT CONNECTION ESTABLISHMENT and the wedge is
# unrecoverable: measured on vigil 2026-09-11, two simultaneous connects produced one link with an
# EMPTY GATT snapshot and one `org.bluez.Error.InProgress`, then `0x200c` (LE Set Scan Enable) stopped
# returning, then `HCI Reset` itself timed out at -110, and a USB de/re-authorize did not bring the
# device back. Scanning alone was unaffected (6 paced cycles, 284 live RSSI samples, 0 errors) — the
# fault is in the transport under bidirectional command/event bursts, not in the radio.
# Upstream has this: zephyrproject-rtos/zephyr#18583 — "connecting a second peripheral while the first
# is exchanging data" fails ~75 % of the time, and enabling BT_DEBUG makes it irreproducible (a
# timing-sensitive race). Siblings: #23280, #40776, #34593, #10678.
# The sample README §"Using a USB CDC ACM UART" is the sanctioned alternative, and this board already
# chooses `zephyr,bt-c2h-uart = &board_cdc_acm_uart` via boards/common/usb/cdc_acm_serial.dtsi.
# ⚠️ HOST SIDE CHANGES: the adapter is no longer auto-created by usb. It needs
#     btattach -B /dev/ttyACM<n> -S 1000000
# so vigil needs a unit for that before this can serve capture. Identify the port by USB SERIAL, never
# by ttyACM index — the index moves on every replug (measured, same evening).
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Zephyr HCI UART anchor np"

# TX power at the antenna (dBm); SDC subtracts the overlay FEM gain for the SoC setting
CONFIG_BT_CTLR_TX_PWR_ANTENNA=20
