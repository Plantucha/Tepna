# tepna-capture — deploy/needrestart-tepna-capture.conf
# Copyright 2026 Michal Planicka · SPDX-License-Identifier: Apache-2.0
#
# Installed to /etc/needrestart/conf.d/50-tepna-capture.conf by deploy/check-system-files.sh.
#
# ── WHY ────────────────────────────────────────────────────────────────────────────────────────────
# needrestart runs after every unattended upgrade and restarts each unit whose processes still link a
# replaced library. `tepna-capture` holds BLE links through the night, and `tepna-update.sh` refuses its
# OWN restart while any link is held, because a restart splits the wearer's night at a seam. needrestart
# carried no such rule, so it restarted the daemon that tepna-update.sh had refused to restart a minute
# earlier (row 2026-10-28-an-apt-upgrade-restarts-the-daemon-through-a-held-night).
#
# Measured on vigil 2026-10-28, read-only. Across the two newest unattended-upgrades logs (2026-09-01 to
# 2026-10-28) needrestart issued `systemctl restart … tepna-capture.service` on 16 dpkg runs over 12
# mornings, every one between 06:00 and 06:54 EDT. It issued 4 of the 10 night-ending stops from 10-19 to
# 10-28. On 10-21 tepna-update.sh logged "deferring the restart — links:1" at 06:43:49, and systemd
# stopped the daemon at 06:44:15 with no sudo line in between.
#
# ── WHAT 0 MEANS, AND WHY NOT blacklist_rc ─────────────────────────────────────────────────────────
# 0 is "do not restart this one automatically". needrestart still LISTS the unit as needing a restart,
# so the box can still say so, and needrestart's own config says to prefer override_rc over
# blacklist_rc, which would hide the unit completely. The daemon picks the new libraries up at its next
# ordinary restart, which tepna-update.sh performs once the night goes idle.
#
# ── TWO WAYS THIS FILE COULD GO WRONG, BOTH SILENT ─────────────────────────────────────────────────
# ⚠ ONE KEY ON THE EXISTING HASH, never `$nrconf{override_rc} = { … }`. needrestart parses conf.d AFTER
# its own config, and the drop-in README says these files "override or modify any previously set config
# option". A whole-hash assignment would DROP the distro's entries, so dbus, the display managers and
# the networking units would then be restarted by every upgrade. That is a worse box than the one this
# rule fixes, and nothing would report it.
#
# ⚠ THE REGEX IS A PREFIX, NOT ANCHORED ON `.service`. needrestart's own entries read `qr(^dbus)`, and a
# rule that matches nothing fails silently: the upgrade restarts the daemon, and no line says the rule
# was the reason it should not have. The prefix also covers tepna-capture-deadman.service, a one-shot
# that loses nothing by waiting.
$nrconf{override_rc}{qr(^tepna-capture)} = 0;
# A `do`-ed perl file returns its last expression, and the assignment above evaluates to 0. A caller
# that reads the return value rather than `$@` would call a well-parsed file a failure, so the file
# ends the conventional way.
1;
