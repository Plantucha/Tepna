# tepna-capture — Python tooling config (out-of-suite; the JS suite is unaffected).
# Copyright 2026 Michal Planicka · SPDX-License-Identifier: Apache-2.0

[tool.pytest.ini_options]
testpaths = ["tests"]
# ⚠️ DO NOT SET `tmp_path_retention_policy` HERE — not "none", and not "failed". This file carried
# "failed" for a few hours on 2026-09-24. It is removed on a COST argument, and the mechanism story
# that first justified removing it was wrong; both halves are recorded so neither is re-derived.
#
# WHAT IT ACTUALLY DOES (established, pytest source): under "failed" a GREEN run removes that session's
# ENTIRE basetemp, not merely the passing tests' directories — `_pytest/tmpdir.py`,
# `pytest_sessionfinish`: "remove base directory if all the tests passed, the policy is 'failed', and
# the basetemp is not specified by a user", guarded by `exitstatus == 0 and policy == "failed"`. So on a
# green run "failed" IS "none", which is not how it reads. Measured here: 0 bytes after 183 passing.
#
# WHAT IT DOES NOT DO — REFUTED BY MEASUREMENT, do not reinstate any of it. It does not let one mutant's
# session delete another's directory, so it cannot make a surviving mutant read as killed. Osprey's 2x2
# (50 pytest sessions launched together in mutmut's own shape — no `--basetemp` — at jobs 1/8/16 under
# both policies, survivor first, with a positive control that deletes a live basetemp from outside and
# IS detected): every session got its own numbered basetemp (8/8, 16/16), 0 reaped, 0 setup errors,
# peak 20 dirs against keep=3 with no live one removed (each holds a `.lock` 6 s old against a 3 h reap
# timeout). Shared-basetemp cascade ruled out by construction, keep-3 and stale-lock by measurement.
#
# WHY IT GOES ANYWAY — the arithmetic, which is the whole argument. Shrinking the fixtures took one
# nightqc run from 2,097,737,728 to 63,004,672 bytes, and pytest keeps three basetemps by default:
#     before the shrink   3 basetemps = 6.29 GB   · the 37 dirs that exhausted /tmp = 21 GB
#     after the shrink    3 basetemps =  189 MB   · those same 37 dirs = 2.33 GB of a 30 GB tmpfs
#     what the POLICY adds on top of the shrink   =  189 MB, 0.63 % of tmpfs
# The SHRINK is the mitigation for the exhaustion, by 33x, and it stays. The policy buys the last
# 0.63 % and carries an unexplained perturbation of the mutation gate: at "all" the verdict is
# identical but the decided count differs by one (Osprey). 0.63 % of a tmpfs is not worth an
# unexplained effect on the one gate whose job is to say whether a test can see a change.
#
# To bound a single mutation run, put `TMPDIR` on a disk-backed directory. NOT `--basetemp`, which
# pytest clears at session start.
markers = [
  "sets_capture_events: this test sets a capture module-global Event as part of its scenario; the autouse fixture scopes it",
  "leaves_writers_open: this test ends with a sample writer open as part of its scenario; the autouse counter tripwire is silenced for it",
]

# Coverage config (CAPTURE-HOST-FOLLOWUPS-III test-coverage; taken to 100% statement+branch by
# the 2026-07-27 coverage pass). Inert for a plain `pytest` run — it only takes effect when CI passes
# `--cov`, so a dev without pytest-cov installed still runs the suite clean. Source only (tests/harness/
# venvs excluded). The bleak/aiohttp runtime modules (capture/webmon/bonding/pull_session/polar_psftp)
# DO measure here: CI installs requirements.txt and bleak defers all D-Bus contact to connect time, so
# they import fine on a box with no radio.
#
# `deploy` is listed as its own source root ON PURPOSE. Coverage's unexecuted-file scan only descends
# into IMPORTABLE subdirectories, and `deploy/` has no `__init__.py` — so with `source = ["."]` alone,
# `deploy/ezparse.py` was not merely uncovered, it was absent from the denominator entirely. An
# untested file that reads as zero coverage DEBT is the one failure mode a coverage gate exists to
# prevent, so every future .py added under deploy/ now counts against the 100% floor by construction.
[tool.coverage.run]
source = [".", "deploy"]
branch = true
omit = ["tests/*", ".venv*/*", "*/site-packages/*"]

[tool.coverage.report]
skip_empty = true
# Standard, reviewable exclusions. `if __name__ == "__main__":` CLI entry blocks are exercised by running
# the module as a script, not by unit tests — every module here that has one is a hand-run diagnostic /
# operator tool (bonding, pull_session, polar_psftp, probe_oxyii_ppg) or the daemon's own launcher
# (capture). Also the usual defensive/typing lines.
#
# Everything else is at 100% (statement AND branch), enforced by `--cov-fail-under=100` in CI. The ONLY
# other way out is an inline `# pragma: no cover` / `# pragma: no branch`, and the house rule for one is
# strict: it carries a comment PROVING the code is unreachable — an argparse `choices` that already
# rejected the value, a guard whose condition an earlier guard settled — not merely "hard to test".
# Fourteen exist across the tree (`grep -rn 'pragma: no ' *.py deploy/*.py`); each names its proof at
# the line, and one of them (cpap_harvest's `was_short`) documents genuinely dead code rather than a
# defensive guard — it is a removal candidate, not a permanent exemption.
exclude_also = [
    'if __name__ == .__main__.:',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
]

[tool.ruff]
line-length = 120
target-version = "py311"

# Starter lint: real errors only (E9 syntax, F pyflakes — undefined names, unused imports, bad f-strings).
# Deliberately NOT the style rules yet, so it flags bugs without churning the reverse-engineered code.
[tool.ruff.lint]
select = ["E9", "F"]

# ── Mutation testing (AUDIT TOOL, not a gate — TEST-AUDIT-FINDINGS §34) ────────────────────────────
# Driven by tools/mutate.py, which writes mutmut's config into a /tmp scratch copy PER MODULE. There is
# deliberately no [tool.mutmut] section here: mutmut 3.x applies `source_paths` BEFORE any mutant-name
# filter, so a tree-wide section makes every run generate mutants for all 27 modules (and with "." it
# walks into .venv and dies generating invalid syntax for aiohttp). One module per run is the only fast
# shape, and it cannot be expressed in a static config. See tools/mutate.py's header for the three
# mutmut-3.x gotchas that cost an hour each.
#
#   .venv/bin/python tools/mutate.py --list
#   .venv/bin/python tools/mutate.py diskguard alerts
