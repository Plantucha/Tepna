        return { t: e.t, tMs: e.tMs, impulse: e.impulse, node: e.node, conf: e.conf, meta: m };
      }
      return e;
    });
    return {
      // DEEP-AUDIT-2026-07-11 §16: NORMALIZE the stamp to the contract shape {version, hash}. Passing
      // opts.kernel through raw exported the DexKernel object itself ({K, VERSION, HASH}), and the
      // Integrator reads the lowercase keys — so this node always audited as kernel 'missing'.
      kernel: opts.kernel
        ? { version: (opts.kernel.version != null ? opts.kernel.version : opts.kernel.VERSION) || null, hash: (opts.kernel.hash != null ? opts.kernel.hash : opts.kernel.HASH) || null }
        : null,
      schema: {
        name: 'ganglior.node-export',
        version: '2.0',
        node: 'GlucoDex',
        nodeVersion: '1.0',
        bus: 'ganglior',
        generated: opts.generated || new Date().toISOString(),
        provenance: opts.provenance || null,
        doc: 'GlucoDex glycemic events → Ganglior bus. t/tMs = floating wall-clock (UTC getters). null = unknown, never fabricated.'
      },
      // EXPORT-IDENTITY §2.1 / -FOLLOWUPS-II §1: identity-free contentId, single-sourced in this
      // shared builder (both app exportGanglior + headless compute reach it). Folds the cleaned CGM series.
      recording: {
        source: r.source,
        contentId:
          typeof SignalFrame !== 'undefined' && SignalFrame && SignalFrame.computeContentId && r.series && r.series.gV && r.series.gV.length
            ? SignalFrame.computeContentId({ signalType: 'cgm', kind: 'samples', samples: r.series.gV, t0Ms: r.t0Ms != null ? r.t0Ms : null, usable: true })
            : null,
        startEpochMs: r.t0Ms != null ? r.t0Ms : null,
        events: events.length,
        /* §F1.1 — CONTINUOUS coverage, the sibling of HRVDex's sparse block (§6.2). GlucoDex declared no
           duration key `adaptEnvelopeNode` reads, so a well-controlled ZERO-EVENT CGM record collapsed to
           a point at t0Ms — the healthiest record was the one that dropped out of fusion.

           ⚠ NODE-EXPORT-DURATION-SEMANTICS-FOLLOWUPS-II §2 — the original of this block claimed `spanSec`
           and `recordedSec` "agree BY MEASUREMENT, which is precisely what the sparse case could not
           claim". They were the SAME EXPRESSION and could not disagree, so a wear with a 6 h sensor
           dropout reported 100 % coverage and the planted 21 600 s hole left no trace at all. The comment
           named HRVDex as its sibling and then did what HRVDex explicitly refuses ("the obvious fix —
           stamp `durSec = lastTMs − firstTMs` — would FABRICATE COVERAGE").

           Now MEASURED. The cleaner already flags every gap cell (`FLAG.GAP` short bridge / `GAP_LONG`)
           and already knows the cadence, so a segment is a maximal run of NON-gap cells and its duration
           is `cells × cadence` — the same arithmetic `activeMin` uses one function away, deliberately
           reusing that definition rather than inventing a second gap threshold. `recordedSec` is the sum
           of those segments and `spanSec` is untouched: the two now CAN disagree, which is the whole
           point. The segments also travel to `adaptEnvelopeNode`, so a CGM dropout stops counting as
           recorded time when the Integrator judges overlap.

           `kind` stays `'continuous'` deliberately. It names the SAMPLING MODALITY — a CGM is a
           continuous monitor whether or not a sensor dropped out — exactly as HRVDex's `'sparse'` names
           spot measurements. Completeness is what `segments`/`recordedSec` are for, and folding it into
           `kind` would re-create the very conflation this fix removes. Nothing switches on `kind`;
           `adaptEnvelopeNode` reads `segments`. */
        coverage: (function () {
          var _c = glucoCells(r.series);
          if (!_c.length || r.t0Ms == null) return null;
          var _sec = Math.max(0, Math.round((_c[_c.length - 1].tMs - r.t0Ms) / 1000));
          var _F = r.series && r.series.FLAG ? r.series.FLAG : null;
          var _cadS = r.series && isFinite(r.series.cadence) && r.series.cadence > 0 ? r.series.cadence * 60 : null;
          /* No cadence or no flags ⇒ the gaps cannot be located, so coverage is UNKNOWN — null, not the
             span. `nWithDuration: 0` says how much of it is actually known, as HRVDex's does. */
          if (_F == null || _cadS == null) return { kind: 'continuous', spanSec: _sec, segments: [{ startMs: r.t0Ms, durSec: null }], recordedSec: null, nWithDuration: 0, n: 1 };
          var _segs = [],
            _cur = null;
          for (var _i = 0; _i < _c.length; _i++) {
            if (_c[_i].f === _F.GAP || _c[_i].f === _F.GAP_LONG) {
              _cur = null;
              continue;
            }
            if (!_cur) {
              _cur = { startMs: _c[_i].tMs, cells: 0 };
              _segs.push(_cur);
            }
            _cur.cells++;
          }
          // `const` after the guard above, not the `var`: TS cannot keep a mutable binding's narrowing
          // across the callback boundary, so reading `_cadS` in there is `possibly null` to typecheck.
          const _cadSec = _cadS;
          var _out = _segs.map(function (s) {
            return { startMs: s.startMs, durSec: Math.round(s.cells * _cadSec) };
          });
          var _rec = 0;
          for (var _j = 0; _j < _out.length; _j++) _rec += _out[_j].durSec;
          return { kind: 'continuous', spanSec: _sec, segments: _out, recordedSec: _rec, nWithDuration: _out.length, n: _out.length };
        })(),
        clamp:
          cs && cs.detected
            ? {
                detected: true,
                vendor: cs.vendor || null,
                floor: cs.floor && cs.floor.saturated && cs.floor.value != null ? cs.floor.value : null,
                ceiling: cs.ceiling && cs.ceiling.saturated && cs.ceiling.value != null ? cs.ceiling.value : null,
                blindMetrics: cs.blindMetrics || []
              }
            : { detected: false }
      },
      glucose: {
        mean: r.mean,
        gmi: r.gmi,
        ea1c: r.ea1c,
        sd: r.sd,
        cv: r.cv,
        tir: r.tir,
        titr: r.titr,
        mage: r.mage == null ? null : r.mage,
        modd: r.modd == null ? null : r.modd,
        adrr: r.adrr == null ? null : r.adrr,
        gvp: r.gvp == null ? null : r.gvp,
        lbgi: r.lbgi,
        hbgi: r.hbgi,
        stabilityScore: r.stabilityScore,
        pctActive: r.pctActive,
        tier: r.tier || null,
        dawn: r.dawn && r.dawn.present ? { present: true, medianDelta: r.dawn.medianDelta } : { present: false },
        daypart: r.daypart || null
      },
      /* §F1.1 / §3.6 — the SLICEABLE trace. Without it `integrator-dsp.js hasCells` was always false, so
         the Integrator stamped the SAME whole-wear glucose CV on every overlapping night, `pearson` over
         that constant series returned null, and the `directional` fallback published a number computed
         from the ECG slope ALONE under a note claiming "Single overlapping night". `glucodex-app.js`
         already emitted this block; both now call `glucoCells` so the two cannot drift. */
      timeseries: (function () {
        var _cells = glucoCells(r.series);
        if (!_cells.length) return null;
        return {
          doc: 'Per-cell trace. cells[] makes this continuous node SLICEABLE: a consumer (the Integrator) recomputes glycemic metrics on any sub-window without GlucoDex pre-segmenting into nights.',
          cadenceMin: r.cadence,
          t0Ms: r.t0Ms,
          unit: 'mg/dL',
          cells: _cells,
          cellsNote:
            'ONE entry per cell in time order; WARMUP cells dropped. tMs = absolute floating wall-clock ms; v = mg/dL; f = clean flag (0 OK · 2 gap-interp SHORT · 3 compression-low · 4 gap-interp LONG). A consumer computing glucose statistics MUST exclude 3 and 4 — flag 4 is straight-line interpolation the sensor never saw, and counting it inflates TIR/CV and any coverage figure derived from the cell count.'
        };
      })(),
      ganglior_events: events,
      reserved: { doc: 'Awaiting other fleet nodes; null until available.' }
    };
  }

  // Headless public surface — parse → analyze (REAL pipeline) → shared node-export.
  // Accepts a CSV string, {text}, or an already-parsed {tMs,vMgdl,unit,t0Ms} frame.
  function compute(input, opts) {
    opts = opts || {};
    let parsed;
    if (input && Array.isArray(input.tMs) && Array.isArray(input.vMgdl)) {
      parsed = input; // pre-parsed frame {tMs,vMgdl,unit,t0Ms} (genSynthetic / SignalSpec.cgm dsp-resolver leg)
    } else if (input && Array.isArray(input.samples) && input.samples.length && input.samples[0] && typeof input.samples[0] === 'object' && typeof input.samples[0].v === 'number') {
      // Canonical cgm SignalFrame (signal-frame.js): samples=[{tMs,v}] + parallel tsMs[], with unit/t0Ms
      // on the frame. signal-orchestrate.emitCgmNodeExport hands this shape STRAIGHT to compute(), so
      // reconstruct the parseCSV-shaped {tMs,vMgdl,unit,t0Ms} the pipeline consumes DIRECTLY from the
      // frame's own already-parsed samples (the libre-cgm adapter already ran GlucoDex.parseCSV — the
      // values are mg/dL-normalised + time-sorted; do NOT re-parse). Without this branch the orchestrate
      // CGM path throws (the {tMs,vMgdl} branch above + the {text} branch below both miss a samples frame).
      const sm = input.samples;
      parsed = {
        tMs: sm.map(function (s) {
          return s.tMs;
        }),
        vMgdl: sm.map(function (s) {
          return s.v;
        }),
        unit: input.unit || 'mg/dL',
        t0Ms: input.t0Ms != null ? input.t0Ms : sm.length ? sm[0].tMs : null
      };
    } else {
      const text =
        typeof input === 'string' ? input : input && typeof input.text === 'string' ? input.text : input && input.samples && typeof input.samples.text === 'string' ? input.samples.text : null;
      if (text == null) throw new Error('GlucoDex.compute: need a CSV string, {text}, a parsed {tMs,vMgdl} frame, or a cgm SignalFrame {samples:[{tMs,v}]}.');
      parsed = parseCSV(text);
    }
    if (opts.source) parsed.source = opts.source;
    const r = analyze(parsed, null, opts);
    return glucoBuildNodeExport(r, opts);
  }

  global.GLUDSP = {
    parseCSV,
    analyze,
    genSynthetic,
    coreMetrics,
    detectClampSaturation,
    TIR_CUT,
    MGDL_PER_MMOL,
    _mean: mean,
    _std: std,
    _median: median,
    _quantile: quantile,
    hhmm,
    parseNutrition,
    pearson,
    // EXPORT-PATH-UNREACHABLE §1: glucodex-app.js builds timeseries.cells with GLUDSP.glucoCells.
    // It was single-sourced here (71b89df) to stop the app's copy drifting from the DSP's, but never
    // PUBLISHED — so the app threw `GLUDSP.glucoCells is not a function` and ⬇ JSON downloaded
    // nothing, while glucoBuildNodeExport (which calls it in lexical scope) kept the gates green.
    glucoCells,
    _ckParse // exposed for the Clock Contract §2.7 range-validation regression gate
  };
  // ONE namespaced global (brief §1A). GlucoDex leaks nothing bare (whole DSP is in
  // this IIFE) → no __DEX_NAMESPACED__ suppression gate needed; this is an explicit
  // named global, collision-free in the co-load realm. Standalone bundles still read GLUDSP.
  // ═══════════════════════════════════════════════════════════════════════════
  //  SELF-INGEST — reload GlucoDex's OWN ganglior.node-export as a review-mode
  //  clinical VIEW (SELF-INGEST-FOLLOWUPS · GlucoDex pass, enrich-first D2 path b).
  //  PURE + DOM-FREE: detect → own-node guard → mark reviewMode → return the
  //  provenance/kernel/glucose/events VERBATIM. Never recomputes, never re-stamps.
  //  The enriched export now carries the `glucose` summary block (mean/GMI/CV/TIR/
  //  MODD/ADRR/dawn/daypart), so the review view renders the glycemic dashboard
  //  from stored values; the full-resolution per-reading trace is greyed.
  // ═══════════════════════════════════════════════════════════════════════════
  function glucoLoadOwnExport(json) {
    if (!(json && json.schema && json.schema.name === 'ganglior.node-export'))
      return { ok: false, reason: 'not-node-export', message: 'Not a node-export \u2014 drop a raw CGM CSV, or GlucoDex\u2019s own .json export.' };
    var node = ((json.schema.node || '') + '').trim();
    if (node !== 'GlucoDex')
      return {
        ok: false,
        reason: 'foreign-node',
        node: node,
        message: 'This is a ' + (node || 'non-GlucoDex') + ' export \u2014 open it in ' + (node || 'its own node') + ', or drop it into the Integrator to fuse.'
      };
    var el = JSON.parse(JSON.stringify(json));
    el._fromExport = true;
    el._reviewMode = true;
    var evAll = Array.isArray(json.ganglior_events) ? json.ganglior_events.slice() : [];
    evAll.sort(function (a, b) {
      return ((a && a.tMs) || 0) - ((b && b.tMs) || 0);
    });
    return {
      ok: true,
      reviewMode: true,
      node: node,
      elements: [el],
      events: evAll,
      provenance: (json.schema && json.schema.provenance) || null,
      generated: (json.schema && json.schema.generated) || null,
      derivedFrom: (json.schema && json.schema.derivedFrom) || null,
      kernel: json.kernel || null,
      recording: json.recording || null,
      glucose: json.glucose || null,
      scrubbed: !!(json.schema && json.schema.scrubbed),
      multiNight: false,
      raw: json
    };
  }

  global.GlucoDex = global.GlucoDex || { compute, parseCSV, analyze, genSynthetic, buildNodeExport: glucoBuildNodeExport, _build: glucoBuildNodeExport };
  global.GlucoDex.loadOwnExport = glucoLoadOwnExport; // SELF-INGEST reload (review-mode clinical view)
  // scrub-for-sharing → the SHARED dexScrubExport (D1); lazy delegate, co-load order irrelevant.
  global.GlucoDex.scrubExport = function (env) {
    if (global.DexExport && typeof global.DexExport.scrubExport === 'function') return global.DexExport.scrubExport(env);
    if (typeof global.dexScrubExport === 'function') return global.dexScrubExport(env);
    return env;
  };
})(window);

// ESM-MIGRATION Phase 2: dsp is now a DUAL-MODE module. The IIFE above still attaches window.GLUDSP /
// window.GlucoDex (the external node API + every classic co-load consumer — the orchestrators and both
// test runners, which classic-load this file via tools/build-core.js `classicify`). These re-exports
// let the owned ESM bundle's glucodex-app.js `import { GLUDSP, GlucoDex }` instead of reading window.
const GLUDSP = window.GLUDSP;
const GlucoDex = window.GlucoDex;

</script>

<script>
  var NODE = (new URLSearchParams(location.search).get('node') || '').toLowerCase();
  // ⚠️ STRIP-ON-LOAD IS NOT AVAILABLE HERE — two mechanisms tested and both are blocked.
  // These DSPs are dual-form: a classic IIFE assigning window.X, followed by ES re-exports
  // (`export const PulseDex = window.PulseDex;`). A <script src> parses the file as a CLASSIC
  // script, so that trailing `export` is a SyntaxError and the WHOLE file fails to execute --
  // including the IIFE that defines the global. Broken from 2026-07-16 (ESM migration, 7d8d3b6d)
  // until the tripwire below, three days after this file was last touched.
  //
  // The obvious fix -- read the text, strip the exports, inject it inline (what
  // `DexBuild.classicify` does at build time) -- CANNOT WORK in this page. Measured 2026-09-16 in
  // Chrome with --allow-file-access-from-files, on a file:// page: BOTH request primitives are
  // refused for a sibling file: URL (one is blocked outright, the other reports status 0 via its
  // error path), and a module-type script is CORS-blocked because a file:// page has origin `null`.
  // ⚠️ The two primitives are deliberately NOT named here: `no-network.html`'s static scan matches
  // their identifiers by word boundary over raw source, comments included, so naming them reds the
  // gate. That cost one CI cycle on this very file.
  // Only <script src> can read a sibling file here, which is why the original used it. The real
  // remedy is BUILD-TIME: give `build-analysis.mjs` ownership of this page so it inlines
  // classicified sources, the way it already does for every analysis tool. Not done here.
  function loadScript(src) {
    return new Promise(function (res, rej) {
      var s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = function () { rej(new Error('load failed: ' + src)); };
      document.head.appendChild(s);
    });
  }
  // sequential load keeps function-declaration order deterministic within the realm
  async function loadAll(list) { for (var i = 0; i < list.length; i++) await loadScript(list[i]); }

  // What each node must have defined once its scripts have run. A realm that cannot provide these
  // is broken, and saying so is strictly better than answering every call with a null score.
  var REQUIRED_GLOBAL = {
    oxydex: ['OxyDex'],
    pulsedex: ['PulseDex'],
    glucodex: ['GlucoDex']
  };

  var SCRIPTS = {
    oxydex:   ['kernel-constants.js', 'clock.js', 'oxydex-util.js', 'oxydex-profile.js', 'oxydex-dsp.js'],
    pulsedex: ['kernel-constants.js', 'clock.js', 'pulsedex-dsp.js'],
    glucodex: ['kernel-constants.js', 'glucodex-dsp.js'],
  };

  function kern() { return (window.DexKernel ? { hash: DexKernel.HASH, version: DexKernel.VERSION } : null); }
  function firstFinite(o) {
    if (o == null) return null;
    if (typeof o === 'number' && isFinite(o)) return o;
    if (typeof o === 'object') { for (var k in o) { var v = firstFinite(o[k]); if (v != null) return v; } }
    return null;
  }

  // ── per-node adapters (run REAL DSP → minimal envelope + scoring companion) ──
  var RUN = {
    // payload = { nights:[{ oxyCSV }] }  → array-of-nights OxyDex summary
    oxydex: function (payload) {
      var slim = [], score = { nights: [] };
      (payload.nights || []).forEach(function (nt) {
        if (!nt.oxyCSV) return;
        var rows = OxyDex._bare.parseCSV(nt.oxyCSV, {});                 // real OxyDex parser
        if (!rows.length) { score.nights.push({ empty: true }); return; }
        var night = OxyDex._bare.processNight(rows, 'cohort.csv');       // real full pipeline
        var st = night.stats || {};
        var dt = (st.durationMin && rows.length) ? st.durationMin * 60000 / rows.length : 1000;
        var desat = night.desat || null;
        var devs = (desat && Array.isArray(desat.events)) ? desat.events : [];
        var detTMs = devs.filter(function (d) { return !d.artifact; }).map(function (d) {
          var idx = (d.nadirIdx != null ? d.nadirIdx : d.startIdx);
          return (idx != null && night.t0Ms != null) ? night.t0Ms + idx * dt : null;
        }).filter(function (v) { return v != null; });
        var estAHI = firstFinite(night.ahiEst);
        slim.push({
          date: night.date, t0Ms: night.t0Ms,
          stats: { n: rows.length, durationMin: st.durationMin, minSpo2: st.minSpo2, meanSpo2: st.meanSpo2 },
          odi4: night.odi4 ? { rate: night.odi4.rate, count: night.odi4.count } : null,
          hb: night.hb ? { rate: night.hb.rate } : null,
          desatProfile: desat ? { events: devs } : null,
          stageProxy: night.stageProxy || null,
          kernel: (window.DexKernel ? { hash: DexKernel.HASH, version: DexKernel.VERSION } : null),
        });
        score.nights.push({
          t0Ms: night.t0Ms, odi: night.odi4 ? night.odi4.rate : null,
          estAHI: estAHI, minSpo2: st.minSpo2, durationMin: st.durationMin,
          nDesat: detTMs.length, detectedDesatTMs: detTMs,
        });
      });
      var envelope = { schema: { name: 'ganglior.node-export', node: 'OxyDex' }, bus: 'ganglior', nights: slim };
      return { envelope: envelope, score: score };
    },

    // payload = { rrText }  → recording.durationMin + hrv.time.{rmssd,sdnn}
    pulsedex: function (payload) {
      /* ⚠️ `PulseDex.parseRRInput`, not the bare global. pulsedex-dsp.js namespaced it and says so
         at its own call site: "in the namespaced realm `parseRRInput` no longer sprays onto window".
         This adapter kept calling the bare name, so every scoring call returned
         `{error:'parseRRInput is not defined'}` — a SECOND break, independent of the SyntaxError
         that stopped the file loading at all, and one that survived fixing the first. */
      var parsed = PulseDex._bare.parseRRInput(payload.rrText || ''); // real PulseDex parser
      var vals = parsed.vals || [];
      if (vals.length < 20) throw new Error('too few RR (' + vals.length + ')');
      var cl = PulseDex._bare.artifactClean(vals);                          // real artifact corrector
      var clean = cl.clean;
      var meanRR = clean.reduce(function (s, v) { return s + v; }, 0) / clean.length;
      var rm = PulseDex._bare.rmssd(clean), sd = PulseDex._bare.std(clean);                // real DSP helpers
      var durMin = (parsed.tsMs && parsed.tsMs.length)
        ? (parsed.tsMs[parsed.tsMs.length - 1] - parsed.tsMs[0]) / 60000
        : clean.reduce(function (s, v) { return s + v; }, 0) / 60000;
      var t0 = parsed.t0Ms;
      var envelope = {
        schema: { name: 'ganglior.node-export', node: 'PulseDex' }, bus: 'ganglior',
        recording: { startEpochMs: t0, durationMin: +durMin.toFixed(1), offsetMin: parsed.offsetMin },
        hrv: { time: { rmssd: +rm.toFixed(1), sdnn: +sd.toFixed(1), meanRR: +meanRR.toFixed(1) } },
        quality: { analyzablePct: +(100 * (1 - cl.pct / 100)).toFixed(1) },
        kernel: kern(),
        ganglior_events: [],
      };
      var score = { rmssd: +rm.toFixed(1), sdnn: +sd.toFixed(1), nBeats: vals.length, artifactPct: cl.pct, durationMin: +durMin.toFixed(1), t0Ms: t0 };
      return { envelope: envelope, score: score };
    },

    // payload = { cgmCSV }  → glycemic.cv + dawn.surge + timeseries.cells + events
    glucodex: function (payload) {
      var parsed = GLUDSP.parseCSV(payload.cgmCSV || '');    // real GlucoDex parser
      var r = GLUDSP.analyze(parsed, null, {});              // real GlucoDex analyze
      var s = r.series || {};
      var cells = [];
      if (s.gT && s.gV) {
        for (var i = 0; i < s.N; i++) {
          var f = s.gF ? s.gF[i] : 0;
          cells.push({ tMs: s.gT[i], v: s.gV[i], f: f });
        }
      }
      var dawnSurge = (r.dawn && (r.dawn.medianRiseMgdl != null ? r.dawn.medianRiseMgdl : firstFinite(r.dawn))) || null;
      var envelope = {
        schema: { name: 'ganglior.node-export', node: 'GlucoDex' }, bus: 'ganglior',
        recording: { startEpochMs: r.t0Ms, durationMin: r.durMin },
        glycemic: { cv: r.cv, mean: r.mean, tir: r.tir ? r.tir.tir : null, gmi: r.gmi },
        dawn: { surge: dawnSurge },
        nocturnalHypo: (r.nocturnalHypo || []).map(function (e) { return { startMs: e.startMs, min: e.min, durMin: e.durMin }; }),
        timeseries: { t0Ms: r.t0Ms, cadenceMin: r.cadence, cells: cells },
        kernel: kern(),
        ganglior_events: r.events || [],
      };
      var score = {
        cv: r.cv, mean: r.mean, gmi: r.gmi, nHypo: (r.nocturnalHypo || []).length,
        dawnSurge: dawnSurge, nReadings: r.nReadings, durDays: r.durDays,
      };
      return { envelope: envelope, score: score };
    },
  };

  window.addEventListener('message', function (ev) {
    var m = ev.data || {};
    if (m.type !== 'run') return;
    var t0 = performance.now();
    try {
      var out = RUN[NODE](m.payload || {});
      ev.source.postMessage({ type: 'result', reqId: m.reqId, node: NODE,
        envelope: out.envelope, score: out.score, timingMs: +(performance.now() - t0).toFixed(2) }, '*');
    } catch (e) {
      ev.source.postMessage({ type: 'result', reqId: m.reqId, node: NODE,
        error: String(e && e.message || e), timingMs: +(performance.now() - t0).toFixed(2) }, '*');
    }
  });

  (async function () {
    if (!SCRIPTS[NODE]) { parent.postMessage({ type: 'ready', node: NODE, error: 'unknown node' }, '*'); return; }
    try {
      /* Sources are INLINED above at build time — nothing is loaded at run time. The previous
         `await loadAll(SCRIPTS[NODE])` re-fetched the raw .js files with <script src>, which is
         exactly the path that threw on the ES re-exports; it kept throwing even once the inlined
         copies had defined the globals, because a classic script's SyntaxError surfaces on
         window.onerror while `onload` still resolves the loader. */
      // ── TRIPWIRE: REFUSE rather than serve nulls ────────────────────────────────────────────
      // `ready` used to be sent on the strength of loadAll resolving, and loadAll resolved even
      // when a script THREW during execution -- a <script src> fires `onload` on a successful
      // fetch, and a SyntaxError inside it surfaces only on window.onerror. So the realm announced
      // itself ready with the node's global never defined, every scoring call came back without a
      // score, and the calling page charted nulls and reported 100%. That is how the 2026-07-16
      // breakage went unnoticed for two months. Assert the thing the realm exists to provide.
      // ⚠️ NO FALLBACK TO `[]`: a node listed in SCRIPTS without a REQUIRED_GLOBAL entry would pass this
      // check with NOTHING examined and announce `ready` — the same silent green this tripwire exists to
      // end, one map over. Gate-pinned: the two key sets must be equal (tests/dex-tests.js).
      var required = REQUIRED_GLOBAL[NODE];
      if (!required || !required.length) throw new Error('node has no REQUIRED_GLOBAL entry — the tripwire cannot examine it');
      var missing = required.filter(function (g) { return !window[g]; });
      if (missing.length) throw new Error('node did not initialise — missing global(s): ' + missing.join(', '));
      parent.postMessage({ type: 'ready', node: NODE }, '*');
    }
    catch (e) { parent.postMessage({ type: 'ready', node: NODE, error: String(e.message || e) }, '*'); }
  })();
</script>
</body></html>
