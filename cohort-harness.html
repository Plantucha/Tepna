      }
    }
    var nadirMinFromStart = +(minIdx / 60).toFixed(0);
    var nadirFracOfNight = +(minIdx / n).toFixed(2);
    return {
      hrNadirMinFromStart: nadirMinFromStart,
      hrNadirFrac: nadirFracOfNight,
      hrNadirSmoothed: isFinite(minHR) ? +minHR.toFixed(1) : null,
      hrNadirLabel: nadirFracOfNight < 0.25 ? 'Early nadir (good alignment)' : nadirFracOfNight > 0.6 ? 'Late nadir (fragmented/REM)' : 'Mid-night (normal)'
    };
  }

  // ── 15. SpO2 Nadir Clock Time ─────────────────────────────────────
  function computeSpO2NadirTime(rows, desat) {
    var n = rows.length;
    if (n < 600 || !desat || !desat.events || !desat.events.length) return null;
    // Find worst event by nadir
    var worst = desat.events.reduce(function (a, b) {
      if (!a) return b;
      if (!b) return a;
      return (a.nadir || 99) < (b.nadir || 99) ? a : b;
    }, null);
    if (!worst || worst.nadirIdx == null) return null;
    var frac = +(worst.nadirIdx / n).toFixed(2);
    var minFromStart = +(worst.nadirIdx / 60).toFixed(0);
    return {
      spo2NadirMinFromStart: minFromStart,
      spo2NadirFrac: frac,
      spo2NadirValue: worst.nadir,
      spo2NadirLabel: frac > 0.65 ? 'Late-night worst (REM-predominant)' : frac < 0.3 ? 'Early worst (supine/onset)' : 'Mid-night'
    };
  }

  // ── 16. RMSSD Arc (per-30min windows) ────────────────────────────
  function computeRMSSDarc(rows) {
    var n = rows.length;
    if (n < 1800) return null;
    var WIN = 1800; // 30-min windows
    var windows = [];
    for (var i = 0; i + WIN <= n; i += WIN) {
      var seg = rows.slice(i, i + WIN).filter(function (r) {
        return r.motion === 0;
      });
      if (seg.length < 60) {
        windows.push(null);
        continue;
      }
      var hr = seg.map(function (r) {
        return r.hr;
      });
      var m2 = hr.length;
      var rmssd2 =
        hr.slice(0, m2 - 1).reduce(function (a, v, j) {
          return a + (hr[j + 1] - v) * (hr[j + 1] - v);
        }, 0) /
        (m2 - 1);
      windows.push(+Math.sqrt(rmssd2).toFixed(1));
    }
    // Build {x, y} pairs using actual window positions (not filtered indices) to preserve time axis
    var validXY = windows
      .map(function (v, i) {
        return v !== null ? { x: i, y: v } : null;
      })
      .filter(function (p) {
        return p !== null;
      });
    var valid = validXY.map(function (p) {
      return p.y;
    });
    if (valid.length < 2) return null;
    var lr = linReg(
      validXY.map(function (p) {
        return p.x;
      }),
      validXY.map(function (p) {
        return p.y;
      })
    );
    var firstHalf = valid.slice(0, Math.floor(valid.length / 2));
    var lastHalf = valid.slice(Math.floor(valid.length / 2));
    var mFirst = +(
      firstHalf.reduce(function (a, b) {
        return a + b;
      }, 0) / firstHalf.length
    ).toFixed(1);
    var mLast = +(
      lastHalf.reduce(function (a, b) {
        return a + b;
      }, 0) / lastHalf.length
    ).toFixed(1);
    return {
      rmssdArcWindows: windows,
      rmssdArcSlope: lr.slope,
      rmssdArcR2: lr.r2,
      rmssdFirstHalf: mFirst,
      rmssdLastHalf: mLast,
      rmssdArcDelta: +(mLast - mFirst).toFixed(1),
      rmssdArcLabel: lr.slope < -0.2 ? 'Declining (REM/arousal load)' : lr.slope > 0.2 ? 'Rising (recovery/deep sleep)' : 'Flat'
    };
  }

  // ── 17. HR 50% Recovery Time Post-Spike ──────────────────────────
  function computeSpike50PctRecovery(rows, spikes) {
    if (!spikes || !spikes.length) return null;
    var times = [];
    spikes.forEach(function (sp) {
      if (!sp || sp.baseline == null || sp.peak == null) return;
      var amplitude = sp.peak - sp.baseline;
      if (amplitude <= 0) return;
      var halfTarget = sp.baseline + amplitude * 0.5;
      var peakIdx = -1;
      // Find peak near the spike timestamp (search within ±5min of spike time)
      var spMfm = sp.mfm || 0;
      var startHr = rows.length > 0 ? rows[0].t.getUTCHours() * 60 + rows[0].t.getUTCMinutes() + rows[0].t.getUTCSeconds() / 60 : 0;
      var approxIdx = Math.round((spMfm - startHr) * 60);
      var searchStart = Math.max(0, approxIdx - 300);
      var searchEnd = Math.min(rows.length, approxIdx + 300);
      for (var i = searchStart; i < searchEnd; i++) {
        if (rows[i].hr >= sp.peak - 2) {
          peakIdx = i;
          break;
        }
      }
      if (peakIdx < 0) return;
      for (var j = peakIdx + 1; j < Math.min(rows.length, peakIdx + 180); j++) {
        if (rows[j].hr <= halfTarget) {
          times.push(j - peakIdx);
          break;
        }
      }
    });
    if (!times.length) return null;
    var mean = +(
      times.reduce(function (a, b) {
        return a + b;
      }, 0) / times.length
    ).toFixed(1);
    return { spike50PctRecovSec: mean, spike50PctRecovN: times.length, spike50PctLabel: mean > 60 ? 'Slow (sympathetic persistence)' : mean > 30 ? 'Moderate' : 'Fast (<30s, good vagal)' };
  }

  // ── 18. REM-Proxy & NREM-Deep Proxy Windows ──────────────────────
  function computeSleepStageProxy(rows) {
    var n = rows.length;
    if (n < 1800) return null;
    var WIN = 120; // 2-min windows
    var hrAll = rows.map(function (r) {
      return r.hr;
    });
    var hrMean =
      hrAll.reduce(function (a, b) {
        return a + b;
      }, 0) / n;
    var remSec = 0,
      nremDeepSec = 0;
    for (var i = WIN; i < n - WIN; i += WIN) {
      var seg = rows.slice(i, i + WIN);
      var still = seg.every(function (r) {
        return r.motion === 0;
      });
      if (!still) continue;
      var hr = seg.map(function (r) {
        return r.hr;
      });
      var segMean =
        hr.reduce(function (a, b) {
          return a + b;
        }, 0) / WIN;
      var segSD = Math.sqrt(
        hr.reduce(function (a, b) {
          return a + (b - segMean) * (b - segMean);
        }, 0) / WIN
      );
      // NREM deep proxy (evaluated first for mutual exclusion): low motion, HR well below mean
      if (segSD < 4 && segMean < hrMean - 6) {
        nremDeepSec += WIN;
      }
      // REM proxy: low motion, low SD, HR near mean (explicitly exclude NREM-Deep windows)
      else if (segSD < 3 && segMean > hrMean - 5 && segMean < hrMean + 5) remSec += WIN;
    }
    /* PLAUSIBILITY GATE (DEEP-AUDIT-2026-07-11 §7).
       These criteria ("still + low HR SD + HR near the night mean") describe the bulk of quiet sleep, not
       REM — REM shows INCREASED heart-rate variability. On the committed corpus the proxy therefore fires
       on most of the night: all 39 real O2Ring nights return 39.6–87.8 % "REM" (median 77.5 %), against a
       physiological norm of ~20–25 %. Every one of them used to render as KPI colour "good" and be exported
       to the Integrator as a comparable single-signal estimate.
       Re-deriving an oximetry REM detector is research, not an audit fix. What the node MUST NOT do is
       assert an impossible number as a healthy finding: past the ceiling, the estimator has failed, and the
       output is reported as IMPLAUSIBLE rather than as a high-REM night. This is the node-side half of
       INTEGRATOR-FUSION-ISSUES §T2 — which was marked ✅ but only ever shipped the Integrator half, so a
       STANDALONE OxyDex user (the common case — every Dex runs alone) saw the bare number with nothing to
       disagree with it. */
    var REM_CEILING_PCT = 30; // adult REM ≈ 20–25 % of sleep; >30 % of the RECORDING is not physiological
    var remPct = +((remSec / n) * 100).toFixed(1);
    var deepPct = +((nremDeepSec / n) * 100).toFixed(1);
    var remPlausible = remPct <= REM_CEILING_PCT;
    return {
      remProxySec: remSec,
      remProxyMin: +(remSec / 60).toFixed(0),
      remProxyPct: remPct,
      nremDeepSec: nremDeepSec,
      nremDeepMin: +(nremDeepSec / 60).toFixed(0),
      nremDeepPct: deepPct,
      // the honest self-assessment the Integrator (and a standalone user) can read
      plausible: remPlausible,
      plausibilityNote: remPlausible
        ? null
        : 'REM proxy implausible (' + remPct + '% of the recording; physiological ≈20–25%) — the HR-stability estimator over-fires on quiet sleep. Not a high-REM night; treat as unreliable.',
      remProxyLabel: !remPlausible ? 'Implausible — estimator unreliable' : remSec / 60 < 45 ? 'Low REM estimate (<45min)' : remSec / 60 > 90 ? 'High REM estimate (>90min)' : 'Normal',
      nremDeepLabel: nremDeepSec / 60 < 30 ? 'Low deep sleep estimate' : nremDeepSec / 60 > 90 ? 'Good deep sleep estimate' : 'Moderate'
    };
  }

  // ═══════════════════════════════════════════════════════════════════
  // v20.7 EXTENSION: VO2max Estimate + BP Projection
  // ═══════════════════════════════════════════════════════════════════
  // Both are ESTIMATES from surrogate markers — not clinical measurements.
  // For informational / trend-tracking only. Consult a physician for
  // clinical interpretation.

  // ── computeVO2maxEstimate ─────────────────────────────────────────
  // Inputs: hrFloor (nocturnal HR min, proxy for HRrest),
  //         maxHr (nocturnal max, less reliable than exercise HRmax),
  //         dfa (DFA α1), rmssd, age (optional, defaults 45)
  // Formula: Uth-Sørensen (2004): VO2max = 15.3 × (HRmax/HRrest)
  // Confidence: high if HRfloor plausible (40-65), low if maxHr noisy
  function computeVO2maxEstimate(rows, hrv, dfa, hrNadirT, age) {
    if (!hrv) return null;
    var n = rows.length;
    if (n < 1800) return null; // need ≥1hr recording

    age = age || 49; // default to space profile age

    // ── Step 1: HRrest proxy = nocturnal HR floor ──────────────────
    // Use 5th percentile of motion-free HR as proxy (more robust than absolute min)
    var stillHR = rows
      .filter(function (r) {
        return r.motion === 0 && r.hr > 30 && r.hr < 120;
      })
      .map(function (r) {
        return r.hr;
      })
      .sort(function (a, b) {
        return a - b;
      });
    if (stillHR.length < 60) return null;

    var p5idx = Math.floor(0.05 * stillHR.length);
    var hrRestNocturnal = stillHR[p5idx]; // 5th percentile nocturnal still HR
    // Prefer manually entered awake resting HR (more accurate for Uth-Sørensen)
    // Nocturnal HR underestimates true resting HR by ~10-15 bpm, inflating VO2max
    var hrRest = UP && UP.hrRestOverride && UP.hrRestOverride > 30 && UP.hrRestOverride < 100 ? UP.hrRestOverride : hrRestNocturnal;

    // Sanity gate: physiologically plausible HRrest
    if (hrRest < 30 || hrRest > 100) return null;

    // ── Step 2: HRmax estimate ─────────────────────────────────────
    // Tanaka 2001: HRmax = 208 - 0.7 × age  (SD ≈ 7 bpm)
    var hrMaxAge = Math.round(208 - 0.7 * age);

    // Nocturnal max is NOT exercise HRmax; use age formula as primary
    // but use nocturnal max as a floor check
    var hrMax = hrMaxAge; // age formula is more reliable
    var hrMaxSource = 'Age formula (Tanaka 2001)';

    // ── Step 3: VO2max — Uth-Sørensen formula ─────────────────────
    // VO2max (ml/kg/min) = 15.3 × (HRmax / HRrest)
    var vo2raw = hrRest && hrRest > 0 ? +(15.3 * (hrMax / hrRest)).toFixed(1) : 0;

    // ── Step 4: DFA α1 modifier ───────────────────────────────────
    // DFA α1 < 0.75 = aerobic training adaptation → small upward adj
    // DFA α1 > 1.0  = sedentary / high load → small downward adj
    var dfaAdj = 0;
    var dfaNote = 'DFA α1 computed on SpO₂ (not HR) — SpO₂ DFA is always >1.0 at short scales; HR-DFA sedentary thresholds do not apply. Adjustment disabled.';
    // NOTE: DFA adjustment removed — SpO₂ short-scale DFA is systematically >1.0
    // regardless of fitness; applying HR-DFA clinical thresholds here is a misapplication.

    // ── Step 5: RMSSD modifier ────────────────────────────────────
    // Higher RMSSD → higher parasympathetic tone → aerobically fitter
    // Regression: each 10ms RMSSD above 30ms adds ~0.5 VO2 unit (approximate)
    // NOTE: hrv.rmssd is a 1Hz proxy in bpm, NOT ms.
    // At sleep HR ~53 bpm: 1 bpm ≈ 21ms, so 30ms ≈ 1.4 bpm; 0.05/ms × 21ms/bpm ≈ 1.05/bpm
    var rmssdAdj = 0,
      rmssdNote = '';
    if (hrv.rmssd != null) {
      var rmssdDelta = hrv.rmssd - 1.4; // reference: 30ms ≈ 1.4 bpm at HR~53
      rmssdAdj = +(rmssdDelta * 1.05).toFixed(1); // 0.05/ms × ~21ms/bpm ≈ 1.05/bpm
      rmssdAdj = Math.max(-3, Math.min(3, rmssdAdj)); // cap ±3
      rmssdNote = 'RMSSD ' + hrv.rmssd + 'bpm (1Hz proxy) → adj ' + (rmssdAdj >= 0 ? '+' : '') + rmssdAdj;
    }

    var vo2est = +(vo2raw + dfaAdj + rmssdAdj).toFixed(1);

    // ── Step 6: Population percentile — age & sex adjusted (ACSM norms) ─
    var vo2Category, vo2Pct;
    // upVO2category lives in oxydex-profile.js (a UI sibling); it IS loaded in the standalone
    // bundle (so this stays byte-identical there). Guard it so the headless compute() path —
    // co-loaded WITHOUT the profile module (signal-orchestrate §3) — doesn't throw; vo2Category
    // then stays null, harmless because the whole vo2est block is profile-coupled + strip-listed.
    var _vc = _ui.upVO2category(vo2est); // uses UP.age and UP.sex
    if (_vc) {
      vo2Category = _vc.cat + ' (' + _vc.pct + ')';
      vo2Pct = _vc.pct;
    } else {
      vo2Category = 'Unknown';
      vo2Pct = '—';
    }

    // ── Step 7: Confidence score (0–100) ─────────────────────────
    var conf = 60; // base
    if (hrRest >= 40 && hrRest <= 65) conf += 15; // plausible resting HR
    if (stillHR.length > 3600) conf += 10; // long recording
    if (hrv.rmssd != null) conf += 10; // RMSSD available
    if (dfa && dfa.alpha1 != null) conf += 5; // DFA available
    conf = Math.min(100, conf);

    // ── Step 8: SEE and range ─────────────────────────────────────
    // Uth-Sørensen SEE: ±10.8 ml/kg/min general population; ±5.4 for trained athletes
    // Using 10.8 for conservative/honest confidence interval (Uth 2004, n=132 mixed fitness)
    // Nocturnal HRrest adds ~±2 additional uncertainty
    var see = 10.8; // general population SEE (trained athletes: 5.4)
    var vo2Low = +(vo2est - see).toFixed(1);
    var vo2High = +(vo2est + see).toFixed(1);

    return {
      vo2est: vo2est,
      vo2Low: vo2Low,
      vo2High: vo2High,
      vo2Category: vo2Category,
      vo2Pct: vo2Pct,
      vo2Conf: conf,
      hrRest: hrRest,
      hrMax: hrMax,
      hrMaxSource: hrMaxSource,
      see: see,
      dfaAdj: dfaAdj,
      dfaNote: dfaNote,
      rmssdAdj: rmssdAdj,
      rmssdNote: rmssdNote,
      formula: 'Uth-Sørensen 2004 (VO2max = 15.3 × HRmax/HRrest)',
      label: vo2est >= 42 ? 'Top-25% for age ' + age : vo2est >= 35 ? 'Above average' : vo2est >= 30 ? 'Average' : 'Below average',
      disclaimer: 'Surrogate estimate ±10.8 ml/kg/min SEE (general pop.) · ±5.4 for trained athletes. Trend tracking only.'
    };
  }

  // computeBPProjection REMOVED 2026-06-21 (external-review WP-A) — cuffless BP from
  // sleep oximetry is indefensible; bpProj is now hard-null. No caller remains.

  // ═══════════════════════════════════════════════════════════════════
  // computeKarvonenZones — Karvonen Heart Rate Reserve training zones
  // + Next-Day Training Readiness score derived from sleep quality
  // ═══════════════════════════════════════════════════════════════════
  // Karvonen formula: THR = (HRmax − HRrest) × %intensity + HRrest
  // HRmax via Tanaka 2001: 208 − 0.7 × age
  // HRrest: nocturnal 5th-percentile still HR (computed in VO2max fn)
  // Zone boundaries: American College of Sports Medicine (ACSM) 2022
  //   Z1 Recovery  50–60% HRR
  //   Z2 Base/Aerobic  60–70% HRR
  //   Z3 Tempo     70–80% HRR
  //   Z4 Threshold 80–90% HRR
  //   Z5 VO2max    90–100% HRR
  // Next-Day Readiness: composite of SpO2 quality, HRV, sleep duration,
  //   hypoxic load, RMSSD, and HR floor — scaled 0–100
  function computeKarvonenZones(rows, hrv, vo2est, odi4, hypDose, sleepArch, stageProxy, age, durationMinHint) {
    if (!hrv) return null;
    var n = rows ? rows.length : 0;
    // Only require rows if we can't get hrRest from profile override or stored vo2est
    var hasHrRestSource = (UP && UP.hrRestOverride && UP.hrRestOverride > 30 && UP.hrRestOverride < 100) || (vo2est && vo2est.hrRest);
    if (!hasHrRestSource && n < 3600) return null;

    age = age || 49;

    // ── HRrest: prefer manual entry, then vo2est, then recompute ──
    var hrRest;
    if (UP && UP.hrRestOverride && UP.hrRestOverride > 30 && UP.hrRestOverride < 100) {
      hrRest = UP.hrRestOverride; // manually entered awake resting HR
    } else if (vo2est && vo2est.hrRest) {
      hrRest = vo2est.hrRest;
    } else {
      if (!rows || rows.length < 60) return null;
      var stillHR = rows
        .filter(function (r) {
          return r.motion === 0 && r.hr > 30 && r.hr < 120;
        })
        .map(function (r) {
          return r.hr;
        })
        .sort(function (a, b) {
          return a - b;
        });
      if (stillHR.length < 60) return null;
      hrRest = stillHR[Math.floor(0.05 * stillHR.length)];
    }
    if (hrRest < 30 || hrRest > 80) return null;

    // ── HRmax via Tanaka ──────────────────────────────────────────
    var hrMax = Math.round(208 - 0.7 * age);
    var hrr = hrMax - hrRest; // Heart Rate Reserve

    // ── Zone boundaries (Karvonen) ────────────────────────────────
    function zone(pctLow, pctHigh) {
      return {
        low: Math.round(hrr * pctLow + hrRest),
        high: Math.round(hrr * pctHigh + hrRest)
      };
    }
    var zones = {
      z1: zone(0.5, 0.6),
      z2: zone(0.6, 0.7),
      z3: zone(0.7, 0.8),
      z4: zone(0.8, 0.9),
      z5: zone(0.9, 1.0)
    };
    zones.z1.name = 'Z1 Recovery';
    zones.z1.color = '#56d364';
    zones.z1.purpose = 'Active recovery, easy walk/swim';
    zones.z2.name = 'Z2 Aerobic Base';
    zones.z2.color = '#79c0ff';
    zones.z2.purpose = 'Fat oxidation, base fitness, Zone 2 training';
    zones.z3.name = 'Z3 Tempo';
    zones.z3.color = '#ffa657';
    zones.z3.purpose = 'Aerobic capacity building, moderate effort';
    zones.z4.name = 'Z4 Threshold';
    zones.z4.color = '#d29922';
    zones.z4.purpose = 'Lactate threshold, race pace';
    zones.z5.name = 'Z5 VO₂max';
    zones.z5.color = '#f85149';
    zones.z5.purpose = 'Peak VO₂max, high-intensity intervals';

    // ── Next-Day Readiness Score (0–100) ─────────────────────────
    // Component weights: HRV 30% | SpO2/hypoxia 25% | Sleep arch 20% | HR floor 15% | HR slope 10%
    var scores = {};

    // 1. RMSSD component (30 pts)
    var rmssdScore = 0;
    if (hrv.rmssd != null) {
      // 1Hz proxy thresholds (bpm): at HR≈53, 1bpm≈21ms. 50ms→2.3, 35ms→1.6, 25ms→1.2, 15ms→0.7
      if (hrv.rmssd >= 2.3) rmssdScore = 30;
      else if (hrv.rmssd >= 1.6) rmssdScore = 24;
      else if (hrv.rmssd >= 1.2) rmssdScore = 18;
      else if (hrv.rmssd >= 0.7) rmssdScore = 10;
      else rmssdScore = 4;
    }
    scores.rmssd = rmssdScore;

    // 2. SpO2 / hypoxic load component (25 pts)
    var spo2Score = 0;
    var odi4Rate = odi4 ? odi4.rate : 0;
    var hd94Rate = hypDose ? hypDose.hd94PerHr : 0;
    if (odi4Rate < 2 && hd94Rate < 30) spo2Score = 25;
    else if (odi4Rate < 5 && hd94Rate < 60) spo2Score = 20;
    else if (odi4Rate < 10 && hd94Rate < 120) spo2Score = 13;
    else if (odi4Rate < 20) spo2Score = 7;
    else spo2Score = 2;
    scores.spo2 = spo2Score;

    // 3. Sleep architecture (20 pts): duration + REM + deep estimates
    var sleepScore = 0;
    var durationMin = n > 0 ? n / 60 : durationMinHint || 360;
    if (durationMin >= 420)
      sleepScore += 10; // ≥7h
    else if (durationMin >= 360) sleepScore += 7;
    else if (durationMin >= 300) sleepScore += 4;
    else sleepScore += 1;
    if (stageProxy) {
      if (stageProxy.remProxyMin >= 45) sleepScore += 5;
      else if (stageProxy.remProxyMin >= 20) sleepScore += 3;
      if (stageProxy.nremDeepMin >= 60) sleepScore += 5;
      else if (stageProxy.nremDeepMin >= 30) sleepScore += 3;
    } else {
      sleepScore += 5; // neutral if no stage data
    }
    scores.sleep = sleepScore;

    // 4. HR floor (15 pts): lower nocturnal floor = better recovery
    var hrFloorScore = 0;
    if (hrRest <= 48) hrFloorScore = 15;
    else if (hrRest <= 54) hrFloorScore = 12;
    else if (hrRest <= 60) hrFloorScore = 8;
    else if (hrRest <= 68) hrFloorScore = 4;
    else hrFloorScore = 1;
    scores.hrFloor = hrFloorScore;

    // 5. HR slope / dipping (10 pts): negative slope = good nocturnal dip
    var hrSlopeScore = 0;
    if (hrv.hrSlope != null) {
      if (hrv.hrSlope < -0.5) hrSlopeScore = 10;
      else if (hrv.hrSlope < 0) hrSlopeScore = 7;
      else if (hrv.hrSlope < 0.5) hrSlopeScore = 4;
      else hrSlopeScore = 1;
    } else hrSlopeScore = 5;
    scores.hrSlope = hrSlopeScore;

    var readiness = rmssdScore + spo2Score + sleepScore + hrFloorScore + hrSlopeScore;
    readiness = Math.min(100, Math.max(0, readiness));

    // ── Readiness tier ─────────────────────────────────────────────
    var readinessTier, readinessColor, zoneRec, trainingNote;
    if (readiness >= 85) {
      readinessTier = 'Optimal';
      readinessColor = 'good';
      zoneRec = 'z4_z5';
      trainingNote = 'Full training. Threshold, intervals, or VO₂max work appropriate.';
    } else if (readiness >= 70) {
      readinessTier = 'Good';
      readinessColor = 'good';
      zoneRec = 'z3_z4';
      trainingNote = 'Tempo or sub-threshold work. Avoid all-out efforts.';
    } else if (readiness >= 55) {
      readinessTier = 'Moderate';
      readinessColor = 'warn';
      zoneRec = 'z2_z3';
      trainingNote = 'Zone 2 aerobic base or moderate tempo. Skip HIIT.';
    } else if (readiness >= 40) {
      readinessTier = 'Low';
      readinessColor = 'warn';
      zoneRec = 'z1_z2';
      trainingNote = 'Recovery or easy Zone 2 only. Prioritize sleep tonight.';
    } else {
      readinessTier = 'Rest Day';
      readinessColor = 'bad';
      zoneRec = 'z1';
      trainingNote = 'Rest or active recovery walk only. Training will deepen deficit.';
    }

    // ── Recommended zones for tomorrow ───────────────────────────
    var recZones = [];
    if (zoneRec === 'z4_z5') recZones = [zones.z3, zones.z4, zones.z5];

  // ═══════════════════════════════════════════════════════════════════════════
  //  SELF-INGEST — reload OxyDex's OWN export as a REVIEW-MODE clinical view
  //  (SELF-INGEST-2026-06-27-BRIEF · prerequisite: the v2.0 envelope)
  // ───────────────────────────────────────────────────────────────────────────
  //  Let a user drop OxyDex's own ganglior.node-export back into OxyDex to get a
  //  faithful, print/PDF-able CLINICAL SUMMARY (findings · KPIs · event timeline ·
  //  evidence badges) to bring to a doctor WITHOUT the raw dataset — showing what
  //  was computed AT EXPORT TIME, never recomputing, re-grading, or re-stamping.
  //
  //  WHY THIS WAS BROKEN: the v2.0 envelope starts with '{' and has NO top-level
  //  date/stats (those live in nights[]) — so parseJSONL (whose array-flatten
  //  branch only fires on a leading '[', and whose line loop needs obj.date &&
  //  obj.stats) returns [] for it, and readFile's single-object branch (needs
  //  .date) misses it too. The fleet's own export was therefore NOT self-reloadable
  //  into its own app. oxyLoadOwnExport closes that.
  //
  //  PURE + DOM-FREE: returns a structured result; the app glue (readFile →
  //  handleFiles → renderAll) sets window._oxyReview, paints the review banner,
  //  greys raw-only panels, and renders the clinical summary. Tested directly in
  //  BOTH runners via OxyDex.loadOwnExport. This path must NEVER call
  //  GangliorProvenance.stamp() — a reload is a VIEW of a past computation, stamped
  //  with the build that MADE it, not a fresh computation (SELF-INGEST §3).
  function oxyLoadOwnExport(json) {
    // 1 · detect — a ganglior.node-export at all?
    if (!(json && json.schema && json.schema.name === 'ganglior.node-export'))
      return { ok: false, reason: 'not-node-export', message: 'Not a node-export \u2014 drop a raw O2Ring CSV, or OxyDex\u2019s own .json export.' };
    // 2 · guard — a node only re-ingests its OWN kind. A foreign export is REJECTED with a redirect
    //     message (mirrors the Integrator's detectNode), never silently coerced.
    var node = ((json.schema.node || '') + '').trim();
    if (node !== 'OxyDex')
      return {
        ok: false,
        reason: 'foreign-node',
        node: node,
        message: 'This is a ' + (node || 'non-OxyDex') + ' export \u2014 open it in ' + (node || 'its own node') + ', or drop it into the Integrator to fuse.'
      };
    // 3 · unwrap to the derived layer — nights[] (a single-record export = the object itself). Reuse
    //     the EXISTING parseJSONL per-element reconstruction (its array-flatten branch) verbatim: no new
    //     parse path, no recompute beyond the deterministic stored-scalar MOS/AHI derive parseJSONL
    //     already does (every nights[] element carries obj.date && obj.stats, so each rebuilds).
    var carrier = Array.isArray(json.nights) ? json.nights : json.date && json.stats ? [json] : [];
    var nights = typeof parseJSONL === 'function' ? parseJSONL(JSON.stringify(carrier)) : [];
    // Mark review-mode on each reconstructed night (the renderer greys raw-only panels + the dashboard
    // takes the review chrome) and PREFER the export's STORED summary over parseJSONL's deterministic
    // re-derive (SELF-INGEST §3 — prefer the stored value; a divergence is a bug, never silently shown).
    nights.forEach(function (n, i) {
      n._reviewMode = true;
      n._fromExport = true;
      var el = carrier[i];
      if (el && el.date === n.date && el.summary != null) n.summary = el.summary;
    });
    // 4 · preserve provenance / kernel / events / crossNight VERBATIM — the view's provenance IS the
    //     export's; the current build's stamp must NOT be written over it (no GangliorProvenance.stamp()).
    return {
      ok: true,
      reviewMode: true,
      node: node,
      nights: nights,
      events: Array.isArray(json.ganglior_events) ? json.ganglior_events : [],
      provenance: (json.schema && json.schema.provenance) || null,
      generated: (json.schema && json.schema.generated) || null,
      derivedFrom: (json.schema && json.schema.derivedFrom) || null,
      kernel: json.kernel || null,
      crossNight: json.crossNight || null,
      recording: json.recording || null,
      scrubbed: !!(json.schema && json.schema.scrubbed),
      multiNight: nights.length > 1,
      raw: json
    };
  }

  function avg(a) {
    return (
      a.reduce(function (x, y) {
        return x + y;
      }, 0) / a.length
    );
  }
  function stdDev(a) {
    var m = avg(a);
    return Math.sqrt(
      avg(
        a.map(function (x) {
          return (x - m) * (x - m);
        })
      )
    );
  }
  function fmtDate(d) {
    return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
  }
  function fmtTime(d) {
    return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) + ':' + pad(d.getUTCSeconds());
  }
  function fmtTimeFull(d) {
    return fmtTime(d) + ' ' + pad(d.getUTCDate()) + '/' + pad(d.getUTCMonth() + 1) + '/' + d.getUTCFullYear();
  }
  function pad(n) {
    return n < 10 ? '0' + n : '' + n;

  //  ganglior.node-export. The export is a single-night SUMMARY element (the SAME
  //  shape oxydex-app.js exportJSON emits, now built by the SHARED

  //  MEASUREMENT INSTANCE BLOCKS — MEASUREMENT-PROVENANCE-ROADMAP §3, the reference path.
  //  OxyDex is the FIRST emitter of the `measurement` block specified by roadmap §1 and validated by
  //  measurement-block.js (which is NOT bundled here — the emitter writes the shape, the gates validate
  //  it). Four headline metrics, one block each, keyed by the registry id so a reader indexes by name and
  //  every block still carries its own `metricId` (the contract's field). The values are the SAME numbers
  //  the element already carries (stats.meanSpo2 / stats.t90pct / odi4.rate / hb.rate) — the block adds
  //  LINEAGE, never a second computation, so numerical invariance is by construction.
  //
  //  code identity: the running bundle reads its own `data-manifest-hash` / `data-compute-hash` off the
  //  <html> tag (stamped at build time OUTSIDE every inline block by tools/build-core.js, so the stamp is
  //  manifestHash-invariant). A headless source-module run has no bundle and takes `opts.code`; with
  //  neither, `code` is null WITH A REASON (§∅) and the block fails validation loudly rather than naming
  //  a hash it does not have. The regen tool supplies the shipped bundle's hashes, which is what makes a
  //  committed fixture's `code.computeHash` checkable against OxyDex.html.
  //
  //  evidence: `inputHash` is `contentId` — the SignalFrame content address of the decoded SpO2 samples
  //  + t0Ms, the suite's 12-hex input identity (recomputable from the committed CSV; the raw file's
  //  sha256[0:16] sits beside it in provenance.inputs[] / the ledger's inputHashes). `envelopeRef` is the
  //  Acquisition Evidence envelope's session_id when one was attached (Phase C); a CSV/legacy input has
  //  none and SAYS so.

  //  statistics read straight off the measured samples → 'measured'; odi4 and hypoxicBurden are computed
  //  through a model (event detection against a baseline; an AUC below a fixed line) → 'derived'.
  // ═══════════════════════════════════════════════════════════════════════════
  function oxyBundleCodeIdentity() {

      var ds = typeof document !== 'undefined' && document && document.documentElement && document.documentElement.dataset;
      if (ds && /^[0-9a-f]{12}$/.test(String(ds.manifestHash || '')) && /^[0-9a-f]{12}$/.test(String(ds.computeHash || '')))

    } catch (_e) {}

  }
  function oxyBuildMeasurementBlocks(n, opts) {
    opts = opts || {};

    if (!n || !stats) return null;
    var t0 = n.t0Ms != null && isFinite(n.t0Ms) ? n.t0Ms : null;
    var tEnd = n.tEndMs != null && isFinite(n.tEndMs) ? n.tEndMs : null;
    if (t0 == null || tEnd == null || tEnd <= t0) return null; // no placeable window → no block (never fabricate one)
    var code = opts.code && typeof opts.code === 'object' ? { manifestHash: opts.code.manifestHash, computeHash: opts.code.computeHash } : oxyBundleCodeIdentity();
    var acq = n.acquisitionEvidence || null;
    var envelopeRef = acq && acq.session_id ? String(acq.session_id) : null;
    var evidence = {
      envelopeRef: envelopeRef,
      inputHash: n.contentId != null ? n.contentId : null

    if (envelopeRef == null)

    if (evidence.inputHash == null) evidence.inputReason = 'contentId unavailable (SignalFrame not co-loaded)';
    var window = {
      startTMs: t0,
      endTMs: tEnd,
      clockDomain: 'device',
      timingSource: n.timingSource || 'device',
      spreadMs: null,
      spreadReason:
        n.rtcOffsetS != null && isFinite(n.rtcOffsetS)

          : 'single device clock — the O2Ring RTC is the only timebase on this input; no host stamp to measure spread against'
    };

    var mk = function (metricId, value, basis) {
      if (value == null || typeof value !== 'number' || !isFinite(value)) return null; // unmeasured ⇒ no block
      var b = {
        metricId: metricId,

        window: window,
        sourceChannel: 'O2Ring:spo2',
        code: code,
        evidence: evidence,
        basis: basis,
        quality: quality,
        uncertainty: null,
        uncertaintyReason: 'not estimated — this node carries no uncertainty model for whole-night oximetry summaries'

      if (code == null) b.codeReason = 'no bundle identity in this runtime (headless source-module run) — the shipped bundle stamps data-manifest-hash/data-compute-hash; pass opts.code';
      return b;

  // ════════════════════════════════════════════════════════════════════════
  //  WAVEFORM-DERIVED SpO₂ TREND (owner-ordered ship, 2026-08-20; moved PpgDex→OxyDex same day — OxyDex is the SpO₂ node — experimental tier)
  //  O2RING-RAW-DUAL-WAVELENGTH §1.2④-REOPENED: the 0x05 two-channel ratio tracks the device's own
  //  SpO₂ at corpus scale (19,006 bins, pooled r 0.500, LOO [0.484,0.511], monotonic dose–response;
  //  functionally ch0=IR, ch1=RED). This ships it HONESTLY: per-session SELF-CALIBRATED against the
  //  co-recorded device SpO₂ (a per-device regression, never a universal curve), badged experimental,
  //  and REFUSED (usable:false + reason) when the pair is absent or the session's ratio does not
  //  track. The device SpO₂ is never replaced — the trend is a second, waveform-provenance estimate
  //  rendered beside it.
  // ════════════════════════════════════════════════════════════════════════

  /** Parse the capture host's `_PPG2W.txt` (Phone timestamp;sensor ns;channel 0;channel 1;motion).
   *  Strict Clock Contract: the ISO phone stamp via the local parseTimestamp; no fabricated dates.
   *  Returns { t0Ms, rows:[{tMs, ch0, ch1, motion}] } or { rows: [] } when nothing parses. */
  function parsePPG2W(text) {
    var rows = [];
    var lines = String(text || '').split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (!ln || ln.charCodeAt(0) === 0x50 /* 'P'hone header */) continue;
      var p = ln.split(';');
      if (p.length < 5) continue;
      var ts = parseTimestamp(p[0]);
      if (!ts) continue;
      var a = +p[2],
        b = +p[3],
        mo = +p[4];
      if (!isFinite(a) || !isFinite(b)) continue;
      rows.push({ tMs: ts.tMs, ch0: a, ch1: b, motion: isFinite(mo) ? mo : 0 });
    }
    return { t0Ms: rows.length ? rows[0].tMs : null, rows: rows };
  }

  /** Per-buffer {ac, dc}: linear-detrended RMS + |mean|. RMS (not peak-to-peak) won the 2026-08-20
   *  brute-force sweep — 1344 estimator/model configs over all 49 corpus sessions; the winning config
   *  (RMS AC · 60 s mean bins · +10 s firmware lag) holds LOO held-out pooled r 0.659, per-session
   *  median r 0.723, 28/28 positive, RMSE 0.56 %. PURE. */
  function _w2AcDc(vals) {
    var n = vals.length;
    var m = 0;
    for (var i = 0; i < n; i++) m += vals[i];
    m /= n;
    var mx = (n - 1) / 2,
      sxx = 0,
      sxy = 0;
    for (i = 0; i < n; i++) {
      sxx += (i - mx) * (i - mx);
      sxy += (i - mx) * (vals[i] - m);
    }
    var sl = sxx > 0 ? sxy / sxx : 0;
    var ss = 0,
      cnt = 0;
    for (i = 2; i < n - 2; i++) {
      var v = vals[i] - m - sl * (i - mx);
      ss += v * v;
      cnt++;
    }
    return { ac: cnt ? Math.sqrt(ss / cnt) : 0, dc: Math.abs(m) };
  }

  /** The trend: buffer-split (re-anchor jumps), per-buffer R = (AC/DC)₀/(AC/DC)₁, 60 s MEAN bins,
   *  device series read at +10 s lag (the firmware's own averaging delay — its 1 Hz output lags the
   *  waveform that produced it; sweep-measured, peak of the lag marginal), per-session OLS
   *  self-calibration SpO₂ ≈ a + b·R against the co-recorded device series, and the calibrated
   *  waveform trend + summary. The three knobs (RMS AC · 60 s mean · +10 s lag) are the winners of
   *  the 2026-08-20 brute-force sweep (1344 configs, 49 sessions, LOO-validated — see the brief's
   *  full-corpus re-fit block); 60 s bins are the single biggest lever (marginal median r 0.368 at
   *  5 s → 0.585 at 60 s). REFUSES (usable:false + reason) rather than guessing:
   *  no device series → 'no co-recorded device SpO₂ (self-calibration impossible)';
   *  < 40 usable bins → 'too little paired data'; |r| < 0.3 → 'ratio does not track this session'.
   *  The r floor is the honesty gate — an uncalibratable session must not render a trend. */
  function spo2WaveformTrend(rec, spo2Rows, opts) {
    opts = opts || {};
    var binS = opts.binS || 60;
    var lagS = opts.lagS != null ? opts.lagS : 10;
    /** @type {{usable:boolean, reason:(string|null), bins:any[], calib:(any|null), summary:(any|null), trend?:any[], oneHz?:any[], compare?:(any|null)}} */
    var out = { usable: false, reason: null, bins: [], calib: null, summary: null };
    if (!rec || !rec.rows || rec.rows.length < 5000) {
      out.reason = 'no usable ppg2w stream (need ≥5000 samples)';
      return out;
    }
    if (!spo2Rows || !spo2Rows.length) {
      out.reason = 'no co-recorded device SpO₂ (self-calibration impossible)';
      return out;
    }
    var sp = {};
    for (var i = 0; i < spo2Rows.length; i++) sp[Math.floor(spo2Rows[i].tMs / 1000)] = spo2Rows[i].spo2;
    // buffer split at re-anchor jumps (|Δ − modal| ≥ 3 ms)
    var rows = rec.rows,
      d = [],
      hist = {};
    for (i = 1; i < rows.length; i++) {
      var dd = Math.round(rows[i].tMs - rows[i - 1].tMs);
      d.push(dd);
      hist[dd] = (hist[dd] || 0) + 1;
    }
    var modal = null,
      best = -1;
    for (var k in hist)
      if (hist[k] > best) {
        best = hist[k];
        modal = +k;
      }
    if (modal == null) {
      out.reason = 'no cadence';
      return out;
    }
    var pts = [],
      s0 = 0;
    var flush = function (b) {
      if (b.length < 90) return;
      var A = _w2AcDc(
        b.map(function (r) {
          return r.ch0;
        })
      );
      var B = _w2AcDc(
        b.map(function (r) {
          return r.ch1;
        })
      );
      if (A.dc < 1 || B.dc < 1 || A.ac <= 0 || B.ac <= 0) return;
      var R = A.ac / A.dc / (B.ac / B.dc);
      var tm = b[(b.length / 2) | 0].tMs;
      var sec = Math.floor(tm / 1000) + lagS;
      var s = sp[sec] != null ? sp[sec] : sp[sec - 1] != null ? sp[sec - 1] : sp[sec + 1];
      if (s != null && isFinite(R) && R > 0) pts.push({ tMs: tm, R: R, s: s });
    };
    for (i = 0; i < d.length; i++) {
      if (Math.abs(d[i] - modal) >= 3) {
        flush(rows.slice(s0, i + 1));
        s0 = i + 1;
      }
    }
    flush(rows.slice(s0));
    // 60 s MEAN bins (sweep winner — mean beats median at every bin width, marginal 0.549 vs 0.482)
    var bins = {},
      kk;
    var med = function (a) {
      var s2 = a.slice().sort(function (x, y) {
        return x - y;
      });
      return s2.length ? s2[s2.length >> 1] : null;
    };
    // only ever called behind the ≥8-points-per-bin guard, so a.length > 0 by construction
    var avg = function (a) {
      var t2 = 0;
      for (var j = 0; j < a.length; j++) t2 += a[j];
      return t2 / a.length;
    };
    for (i = 0; i < pts.length; i++) {
      kk = Math.floor(pts[i].tMs / (binS * 1000));
      if (!bins[kk]) bins[kk] = { R: [], s: [], t: [] };
      bins[kk].R.push(pts[i].R);
      bins[kk].s.push(pts[i].s);
      bins[kk].t.push(pts[i].tMs);
    }
    var B2 = [];
    for (kk in bins) if (bins[kk].R.length >= 8) B2.push({ tMs: med(bins[kk].t), R: avg(bins[kk].R), s: avg(bins[kk].s) });
    B2.sort(function (a, b) {
      return a.tMs - b.tMs;
    });
    if (B2.length < 40) {
      out.reason = 'too little paired data (' + B2.length + ' bins, need ≥40)';
      return out;
    }
    // OLS self-calibration SpO₂ = a + b·R, and its r
    var n = B2.length,
      mR = 0,
      mS = 0;
    for (i = 0; i < n; i++) {
      mR += B2[i].R;
      mS += B2[i].s;
    }
    mR /= n;
    mS /= n;
    var sRR = 0,
      sSS = 0,
      sRS = 0;
    for (i = 0; i < n; i++) {
      var dr = B2[i].R - mR,
        ds = B2[i].s - mS;
      sRR += dr * dr;
      sSS += ds * ds;
      sRS += dr * ds;
    }
    if (!(sRR > 0) || !(sSS > 0)) {
      out.reason = 'zero variance — nothing to calibrate against';
      return out;
    }
    var r = sRS / Math.sqrt(sRR * sSS);
    if (!(r >= 0.3)) {
      out.reason = 'ratio does not track this session (r=' + r.toFixed(2) + ' < 0.3) — trend refused';
      return out;
    }
    var b1 = sRS / sRR,
      a1 = mS - b1 * mR;
    var trend = B2.map(function (bb) {
      var w = a1 + b1 * bb.R;
      return { tMs: bb.tMs, spo2w: Math.max(60, Math.min(100, w)), dev: bb.s };
    });
    var ws = trend.map(function (t) {
      return t.spo2w;
    });
    out.usable = true;
    out.bins = B2;
    out.calib = { a: a1, b: b1, r: r, n: n };
    out.trend = trend;
    out.summary = {
      medianSpo2w: med(ws),
      minSpo2w: Math.min.apply(null, ws),
      pctBelow90:
        Math.round(
          (ws.filter(function (w) {
            return w < 90;
          }).length /
            ws.length) *
            1000
        ) / 10,
      trackR: Math.round(r * 1000) / 1000,
      bins: n
    };
    /* ── 1 Hz SIGNAL + FIRMWARE COMPARATOR (owner-ordered 2026-08-20) ──────────────────────────────
       ECGDex's alignFirmwareRR pattern transposed to SpO₂: the device's own 1 Hz output is compared
       second-by-second against a waveform-derived 1 Hz signal, and the DECAY STRUCTURE is reported,
       never averaged over — a comparison whose agreement silently degrades produces a number rather
       than an error, which is the failure mode this suite keeps paying for (ECGDex measured a night
       flat at ~2.3 ms for five deciles then climbing to 30 ms while every whole-record summary stayed
       green). Direct transpositions: the per-decile |error| fan replaces the per-decile |ΔRR| fan; the
       baseline is the BEST decile (not the first — a bad start must not become the yardstick); the
       tolerance is the looser of 3× best and the DEVICE'S 1 % DISPLAY QUANTUM, which plays exactly the
       role ECGDex gives one ECG sample period — a disagreement below the output's own resolution is
       not a detectable disagreement at all.
       ⚠️ The whole-record BIAS is ~0 BY CONSTRUCTION (the OLS self-calibration zeroes the mean
       residual over its bins), so bias is reported for honesty but carries no information — the fan,
       the worst window, and the longest within-tolerance run are the content. */
    var oneHzHalf = Math.floor(binS / 2);
    var secAgg = {};
    for (i = 0; i < pts.length; i++) {
      var sc = Math.floor(pts[i].tMs / 1000);
      if (!secAgg[sc]) secAgg[sc] = { sum: 0, n: 0 };
      secAgg[sc].sum += pts[i].R;
      secAgg[sc].n++;
    }
    var secKeys = Object.keys(secAgg)
      .map(Number)
      .sort(function (x, y) {
        return x - y;
      });
    var firstSec = secKeys[0];
    var span = secKeys[secKeys.length - 1] - firstSec + 1;
    var series = [];
    if (span > 0 && span < 48 * 3600) {
      var pSum = new Float64Array(span + 1);
      var pN = new Float64Array(span + 1);
      for (i = 0; i < span; i++) {
        var ag = secAgg[firstSec + i];
        pSum[i + 1] = pSum[i] + (ag ? ag.sum : 0);
        pN[i + 1] = pN[i] + (ag ? ag.n : 0);
      }
      for (i = 0; i < span; i++) {
        var loW = Math.max(0, i - oneHzHalf);
        var hiW = Math.min(span, i + oneHzHalf + 1);
        var nW = pN[hiW] - pN[loW];
        if (nW < 8) continue; // a second whose window holds under 8 buffers renders nothing — §2.6
        var wv = a1 + (b1 * (pSum[hiW] - pSum[loW])) / nW;
        series.push({ sec: firstSec + i, spo2w: Math.max(60, Math.min(100, wv)) });
      }
    }
    out.oneHz = series;
    /* Pair each 1 Hz second with the device value at the same +lag the calibration used — with the
       device side put through the SAME 60 s centered mean as the waveform side. ECGDex's
       corrected-vs-corrected rule: both sides at one bandwidth, or a fast real transient (a desat!)
       reads as estimator disagreement when it is only a bandwidth mismatch. */
    var dSecs = Object.keys(sp)
      .map(Number)
      .sort(function (x, y) {
        return x - y;
      });
    var dFirst = dSecs.length ? dSecs[0] : 0;
    var dSpan = dSecs.length ? dSecs[dSecs.length - 1] - dFirst + 1 : 0;
    var devAt = function (sec2) {
      return sp[sec2] != null ? sp[sec2] : sp[sec2 - 1] != null ? sp[sec2 - 1] : sp[sec2 + 1];
    };
    var devSmooth = devAt; // fallback: raw lookup when the span is degenerate
    if (dSpan > 0 && dSpan < 48 * 3600) {
      var dpSum = new Float64Array(dSpan + 1);
      var dpN = new Float64Array(dSpan + 1);
      for (i = 0; i < dSpan; i++) {
        var dvv = sp[dFirst + i];
        dpSum[i + 1] = dpSum[i] + (dvv != null ? dvv : 0);
        dpN[i + 1] = dpN[i] + (dvv != null ? 1 : 0);
      }
      devSmooth = function (sec2) {
        var lo2 = Math.max(0, sec2 - dFirst - oneHzHalf);
        var hi2 = Math.min(dSpan, sec2 - dFirst + oneHzHalf + 1);
        if (hi2 <= lo2) return null;
        var nn2 = dpN[hi2] - dpN[lo2];
        // require the device window at least half-populated — a sparse window is not the same signal
        return nn2 >= (hi2 - lo2) / 2 ? (dpSum[hi2] - dpSum[lo2]) / nn2 : null;
      };
    }
    var pairs = [];
    for (i = 0; i < series.length; i++) {
      var dv = devSmooth(series[i].sec + lagS);
      if (dv != null) pairs.push({ w: series[i].spo2w, d: dv });
    }
    out.compare = null;
    if (pairs.length >= 300) {
      // 300 paired seconds = 5 min, mirroring ECGDex's RR_ALIGN_MIN_PAIRS floor
      var sumE = 0;
      var sumAbs = 0;
      var sumSq = 0;
      var w1 = 0;
      var w2c = 0;
      for (i = 0; i < pairs.length; i++) {
        var e = pairs[i].w - pairs[i].d;
        sumE += e;
        sumAbs += Math.abs(e);
        sumSq += e * e;
        if (Math.abs(e) <= 1) w1++;
        if (Math.abs(e) <= 2) w2c++;
      }
      var mW = 0;
      var mD = 0;
      for (i = 0; i < pairs.length; i++) {
        mW += pairs[i].w;
        mD += pairs[i].d;
      }
      mW /= pairs.length;
      mD /= pairs.length;
      var sWW = 0;
      var sDD = 0;
      var sWD = 0;
      for (i = 0; i < pairs.length; i++) {
        sWW += (pairs[i].w - mW) * (pairs[i].w - mW);
        sDD += (pairs[i].d - mD) * (pairs[i].d - mD);
        sWD += (pairs[i].w - mW) * (pairs[i].d - mD);
      }
      var rHz = sWW > 0 && sDD > 0 ? sWD / Math.sqrt(sWW * sDD) : null;
      // per-decile median |error| — the fan a single median hides
      var W = 10;
      var stepW = Math.floor(pairs.length / W);
      var byWindow = [];
      for (var kd = 0; kd < W; kd++) {
        var errs = [];
        for (i = kd * stepW; i < (kd + 1) * stepW && i < pairs.length; i++) errs.push(Math.abs(pairs[i].w - pairs[i].d));
        if (!errs.length) {
          byWindow.push(null);
          continue;
        }
        errs.sort(function (x, y) {
          return x - y;
        });
        byWindow.push(Math.round(errs[errs.length >> 1] * 100) / 100);
      }
      var seenW = byWindow.filter(function (v) {
        return v != null;
      });
      var bestW = seenW.length ? Math.min.apply(null, seenW) : null;
      var worstW = seenW.length ? Math.max.apply(null, seenW) : null;
      // tolerance: looser of 3× best and the device's 1 % display quantum (the "one sample" floor)
      var tol = bestW != null ? Math.max(3 * bestW, 1.0) : Infinity;
      var nonUniform = bestW != null && worstW != null && worstW > tol;
      // longest contiguous within-tolerance run of deciles — where the match holds, not just how long
      var runFrom = -1;
      var runTo = -1;
      var bestLen = 0;
      var curFrom = -1;
      for (var kk2 = 0; kk2 <= byWindow.length; kk2++) {
        var wv2 = kk2 < byWindow.length ? byWindow[kk2] : null;
        if (wv2 != null && wv2 <= tol) {
          if (curFrom < 0) curFrom = kk2;
        } else {
          if (curFrom >= 0 && kk2 - curFrom > bestLen) {
            bestLen = kk2 - curFrom;
            runFrom = curFrom;
            runTo = kk2 - 1;
          }
          curFrom = -1;
        }
      }
      out.compare = {
        n: pairs.length,
        bias: Math.round((sumE / pairs.length) * 1000) / 1000,
        mae: Math.round((sumAbs / pairs.length) * 100) / 100,
        rmse: Math.round(Math.sqrt(sumSq / pairs.length) * 100) / 100,
        r: rHz != null ? Math.round(rHz * 1000) / 1000 : null,
        within1Pct: Math.round((w1 / pairs.length) * 1000) / 10,
        within2Pct: Math.round((w2c / pairs.length) * 1000) / 10,
        byWindow: byWindow,
        best: bestW,
        worst: worstW,
        tol: Math.round(tol * 100) / 100,
        nonUniform: nonUniform,
        runFrom: runFrom,
        runTo: runTo
      };
    }
    return out;
  }

    // periodic breathing — the corpus plants CSR at ~0.017 Hz) was invisible: respRate reported

    // DEEP-AUDIT-2026-07-14 §3: tp is the band SUM, so vlf+lf+hf==totalPower holds EXACTLY rather than to

  // ─── MAIN CALCULATE ───────────────────────────────────────────────────────────
  let lastResult = null;

  //      the RR value is the last ';' / tab / comma-separated field.
  //   2) Free-form — space / newline / comma-separated RR values in ms.

  // A row with no parseable stamp yields NaN (never now()).

      }

  }
  /* A column whose header DECLARES a foreign unit is not an interval column, whatever its values do.

   300–2000 "looks like an RR interval" window — and was read as 973 ms beats. Polar Sensor Logger
   always declares the unit in the header (`X [mg]`, `Gyro [dps]`, `[uV]`, `[nT]`), so this is a
   deterministic veto with no threshold and no judgement call. Milliseconds are the only unit an
   interval may carry. */

    return _PD_FOREIGN_UNIT.test(String(headerLine[c] || ''));

     motion. Reading the interval column and ignoring this one takes intervals Polar has explicitly

     simultaneous H10 chest strap, over 62 five-minute epochs:

         blocker IGNORED    rMSSD +15 % vs chest   SD-of-diff 12.4 ms   82 % of epochs within 5 ms
         blocker HONOURED   rMSSD  +8 %            SD-of-diff  8.7 ms   89 %

     median 8.0 mg / p90 25.3 against 5.5 / 7.2 at clean ones. 2.76 % of beats were blocked on a night

     are not. Keeping the bad interval is measurably worse — see the table — but the complete fix is

     agree: if the median could be drawn from values the test rejects, the correction hands back a
     beat the function itself considers an artifact. */
  const RR_MIN = 300,
    RR_MAX = 2200;
  function artifactClean(vals) {
    const n = vals.length,
      out = vals.slice(),
      flags = new Uint8Array(n),
      W = 5;
    for (let i = 0; i < n; i++) {
      const lo = Math.max(0, i - W),
        hi = Math.min(n, i + W + 1),
        seg = [];
      /* DEEP-AUDIT-II §3.3 — the local median must not be drawn from the artifacts it is correcting.
         This pushed the RAW `vals[j]`, so a cluster of artifacts (ectopy runs, a dropout burst — the
         normal way artifacts arrive, not the exceptional way) contaminated the very median used to
         replace them. Measured at rMSSD +58 %, and in the direction that reads HEALTHIER, which is
         why it never looked wrong. It also let the replacement land OUTSIDE [RR_MIN, RR_MAX]: a beat
         "corrected" to a value the next line would itself flag as an artifact.
         Restricting the window to physiologically plausible neighbours fixes both — the median is
         clean, and being drawn only from in-range values it is in range by construction. */
      for (let j = lo; j < hi; j++) if (j !== i && vals[j] >= RR_MIN && vals[j] <= RR_MAX) seg.push(vals[j]);
      seg.sort((x, y) => x - y);
      const med = seg[seg.length >> 1] || vals[i];
      const dev = med ? Math.abs(vals[i] - med) / med : 0;
      if (vals[i] < RR_MIN || vals[i] > RR_MAX || dev > 0.2) {
        flags[i] = 1;
        out[i] = med;
      }
    }
    let nArt = 0;
    for (let i = 0; i < n; i++) nArt += flags[i];
    return { clean: out, flags, nArt, pct: +((nArt / n) * 100).toFixed(2) };
  }

  // Beat times (seconds): real wall-clock if present, else cumulative RR.
  function beatTimes(a, tsEpoch) {
    const t = new Array(a.length);
    if (tsEpoch && tsEpoch.length === a.length && isFinite(tsEpoch[0])) {
      const t0 = tsEpoch[0];
      for (let i = 0; i < a.length; i++) t[i] = (tsEpoch[i] - t0) / 1000;
    } else {
      let acc = 0;
      for (let i = 0; i < a.length; i++) {
        t[i] = acc / 1000;
        acc += a[i];
      }
    }
    return t;
  }

  // ─── RECORDING-TYPE CLASSIFIER (feature-based, overridable) ──────────────────
  const MODE_LABEL = { morning: '🌅 Morning spot', exercise: '🏃 Exercise', overnight: '🌙 Overnight', continuous: '🕓 24/7 Continuous', spot: '⏱ Spot reading' };
  function classifyRecording(a, t0Ms, durSec) {
    const n = a.length,
      hr = 60000 / mean(a),
      durMin = durSec / 60;
    const hour = t0Ms != null && isFinite(t0Ms) ? new Date(t0Ms).getUTCHours() : null;
    const k = Math.max(1, Math.floor(n * 0.2));
    const rising = 60000 / mean(a.slice(-k)) - 60000 / mean(a.slice(0, k)); // HR drift last-fifth vs first-fifth
    let mode, conf, why;
    if (durMin >= 20 * 60) {
      mode = 'continuous';
      conf = 0.95;
      why = (durMin / 60).toFixed(1) + ' h continuous record';
    } else if (durMin >= 90) {
      mode = 'overnight';
      conf = 0.9;
      why = (durMin / 60).toFixed(1) + ' h' + (hour != null ? ' from ' + String(hour).padStart(2, '0') + ':00' : '');
    } else if (hr >= 100 || rising > 15) {
      mode = 'exercise';
      conf = 0.75;
      why = 'mean HR ' + hr.toFixed(0) + ' bpm' + (rising > 15 ? ', HR rising ' + rising.toFixed(0) : '');
    } else if (durMin <= 8 && (hour == null || hour < 11)) {
      mode = 'morning';
      conf = 0.7;
      why = durMin.toFixed(1) + ' min' + (hour != null ? ' at ' + String(hour).padStart(2, '0') + ':00' : '') + ' spot';
    } else {
      mode = 'spot';
      conf = 0.6;
      why = durMin.toFixed(1) + ' min reading';
    }
    return { mode, conf, why, durMin: +durMin.toFixed(1), hour, rising: +rising.toFixed(1) };
  }

  // ─── WINDOWED ANALYSIS (overnight / long recordings) ─────────────────────────
  // 5-min time windows → per-window short-term metrics. Aggregate with median+IQR.
  function windowAnalysis(a, t, winSec) {
    const N = a.length;
    let i = 0;
    const tEnd = t[N - 1];
    const wins = [],
      segs = [];
    for (let w0 = 0; w0 <= tEnd; w0 += winSec) {
      const w1 = w0 + winSec,
        seg = [];
      while (i < N && t[i] < w1) {
        seg.push(a[i]);
        i++;
      }
      if (seg.length >= 20) {
        // need enough beats for a valid window
        const m = mean(seg);
        wins.push({ tMin: +(w0 / 60).toFixed(1), hr: +(60000 / m).toFixed(1), rmssd: +rmssd(seg).toFixed(1), sdnn: +std(seg).toFixed(1), pnn: +pnn50(seg).toFixed(1), meanRR: +m.toFixed(1) });
        segs.push(seg);
      }
    }
    return { wins, segs };
  }

  // ─── SIMPLE SVG LINE CHART (no external libs, x in minutes) ──────────────────
  function lineChartSVG(pts, color, medVal) {
    const W = 680,
      H = 150,
      P = { l: 46, r: 14, t: 14, b: 26 },
      n = pts.length;
    if (!n) return '';
    let ymn = Infinity,
      ymx = -Infinity,
      xmn = Infinity,
      xmx = -Infinity;
    for (const p of pts) {
      if (p.y < ymn) ymn = p.y;
      if (p.y > ymx) ymx = p.y;
      if (p.x < xmn) xmn = p.x;
      if (p.x > xmx) xmx = p.x;
    }
    if (ymx === ymn) ymx = ymn + 1;
    if (xmx === xmn) xmx = xmn + 1;
    const sx = (x) => P.l + ((x - xmn) / (xmx - xmn)) * (W - P.l - P.r);
    const sy = (y) => H - P.b - ((y - ymn) / (ymx - ymn)) * (H - P.t - P.b);
    const line = pts.map((p, k) => (k ? 'L' : 'M') + sx(p.x).toFixed(1) + ' ' + sy(p.y).toFixed(1)).join(' ');
    const my = sy(medVal).toFixed(1);
    const xt = [];
    for (let h = Math.ceil(xmn / 60) * 60; h <= xmx; h += 60) xt.push(h);
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">
    <line x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${H - P.b}" stroke="rgba(255,255,255,.12)"/>
    <line x1="${P.l}" y1="${H - P.b}" x2="${W - P.r}" y2="${H - P.b}" stroke="rgba(255,255,255,.12)"/>
    <line x1="${P.l}" y1="${my}" x2="${W - P.r}" y2="${my}" stroke="${color}" stroke-dasharray="4 4" opacity=".55"/>
    <text x="${P.l - 6}" y="${(sy(ymx) + 4).toFixed(1)}" fill="#6F8096" font-size="9" text-anchor="end" font-family="IBM Plex Mono,monospace">${ymx.toFixed(0)}</text>
    <text x="${P.l - 6}" y="${(sy(ymn) + 4).toFixed(1)}" fill="#6F8096" font-size="9" text-anchor="end" font-family="IBM Plex Mono,monospace">${ymn.toFixed(0)}</text>
    ${xt.map((h) => `<text x="${sx(h).toFixed(1)}" y="${H - 8}" fill="#6F8096" font-size="9" text-anchor="middle" font-family="IBM Plex Mono,monospace">${(h / 60).toFixed(0)}h</text>`).join('')}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/>
  </svg>`;
  }

  // ═══════════════════════════════════════════════════════════════════════════
  //  CROSS-SIGNAL COMPARISON  (PPI ↔ RR · PRV ↔ HRV)
  //  Two interval series for the SAME recording (e.g. ECG-RR + PPG-PPI). Beat-match
  //  on floating wall-clock tMs (Clock Contract — both nodes emit the same tMs for
  //  the same wall minute), fall back to index alignment when stamps are absent.
  //  Returns: per-series HRV, beat-level agreement (Bland–Altman), Pearson r, and
  //  the PRV↔HRV discrepancy → pulse-transit-time-variability surrogate.
  // ═══════════════════════════════════════════════════════════════════════════
  function _pdPearson(x, y) {
    const n = Math.min(x.length, y.length);
    if (n < 3) return null;
    let sx = 0,
      sy = 0;
    for (let i = 0; i < n; i++) {
      sx += x[i];
      sy += y[i];
    }
    const mx = sx / n,
      my = sy / n;
    let sxy = 0,
      sxx = 0,
      syy = 0;
    for (let i = 0; i < n; i++) {
      const dx = x[i] - mx,
        dy = y[i] - my;
      sxy += dx * dy;
      sxx += dx * dx;
      syy += dy * dy;
    }
    const d = Math.sqrt(sxx * syy);
    return d > 0 ? +(sxy / d).toFixed(3) : null;
  }
  function _pdSeriesStats(a) {
    if (!a || a.length < 3) return null;
    const m = mean(a);
    return { n: a.length, meanRR: +m.toFixed(1), hr: +(60000 / m).toFixed(1), sdnn: +std(a).toFixed(1), rmssd: +rmssd(a).toFixed(1), pnn50: +pnn50(a).toFixed(1) };
  }
  // each side: { vals, tsMs|null, t0Ms|null, label, kind('ppi'|'rr'|'auto') }
  function compareIntervalSeries(primary, reference) {
    if (!primary || !reference || !primary.vals || !reference.vals) return null;
    const A = artifactClean(primary.vals).clean;
    const B = artifactClean(reference.vals).clean;
    if (A.length < 5 || B.length < 5) return { error: 'Need ≥5 intervals in each signal to compare.' };

    // beat-end timestamps (ms). Prefer absolute floating tMs; else cumulative.
    const endTs = (vals, tsMs) => {
      if (tsMs && tsMs.length === vals.length && isFinite(tsMs[0])) return tsMs.slice();
      const t = new Array(vals.length);
      let acc = 0;
      for (let i = 0; i < vals.length; i++) {
        acc += vals[i];
        t[i] = acc;
      }
      return t;
    };
    const haveAbs = !!(primary.tsMs && reference.tsMs && isFinite(primary.tsMs[0]) && isFinite(reference.tsMs[0]));
    const ta = endTs(A, primary.tsMs),
      tb = endTs(B, reference.tsMs);

    const matchA = [],
      matchB = [],
      diffs = [];
    if (haveAbs) {
      // nearest-beat match on the shared wall-clock (two-pointer), tolerance ≈ ⅓ beat
      let j = 0;
      for (let i = 0; i < B.length; i++) {
        while (j + 1 < A.length && Math.abs(ta[j + 1] - tb[i]) <= Math.abs(ta[j] - tb[i])) j++;
        const dt = Math.abs(ta[j] - tb[i]);
        const tol = Math.max(120, 0.3 * Math.min(A[j], B[i]));
        if (dt <= tol) {
          matchA.push(A[j]);
          matchB.push(B[i]);
          diffs.push(B[i] - A[j]);
        }
      }
    } else {
      // no shared clock → assume 1:1 beat correspondence (both are the same recording)
      const m = Math.min(A.length, B.length);
      for (let i = 0; i < m; i++) {
        matchA.push(A[i]);
        matchB.push(B[i]);
        diffs.push(B[i] - A[i]);
      }
    }
    const nM = diffs.length;
    const statsA = _pdSeriesStats(A),
      statsB = _pdSeriesStats(B);
    const mAll = Math.min(A.length, B.length);
    if (nM < 5) {
      return { matched: nM, matchRatePct: +((nM / mAll) * 100).toFixed(0), statsA, statsB, haveAbs, weak: true, note: 'Too few beats line up — different recordings, or no shared clock.' };
    }

    // ── beat-level agreement (Bland–Altman) ──
    const bias = mean(diffs),
      sdDiff = std(diffs);
    const mad = mean(diffs.map((d) => Math.abs(d)));
    const within25 = (diffs.filter((d) => Math.abs(d) <= 25).length / nM) * 100;
    const r = _pdPearson(matchA, matchB);
    const mp = mean(matchA);
    // ── PRV↔HRV discrepancy (computed on the matched, paired series so it's fair) ──
    const rmA = rmssd(matchA),
      rmB = rmssd(matchB),
      sdA = std(matchA),
      sdB = std(matchB);
    const dRMSSD = +(rmB - rmA).toFixed(1),
      dSDNN = +(sdB - sdA).toFixed(1);
    const rmssdRatio = rmA > 0 ? +(rmB / rmA).toFixed(2) : null;
    // pulse-transit-time variability surrogate: variance PRV adds over HRV.
    // PRV² ≈ HRV² + PTTV²  →  PTTV ≈ √(rmssd_PRV² − rmssd_HRV²).  (vascular/BP jitter)
    const pttv = rmB > rmA ? +Math.sqrt(Math.max(0, rmB * rmB - rmA * rmA)).toFixed(1) : 0;

    // decide which side is the pulse (PRV) signal for framing
    const kA = primary.kind || 'auto',
      kB = reference.kind || 'auto';
    const refIsPulse = kB === 'ppi' || (kB === 'auto' && kA === 'rr');
    const agreeGrade = mad <= 10 && Math.abs(bias) <= 15 ? 'ok' : mad <= 20 ? 'warn' : 'bad';

    // thin the diffs for a Bland–Altman scatter (renderer draws it)
    const step = Math.max(1, Math.floor(nM / 400));
    const ba = [];
    for (let i = 0; i < nM; i++) {
      if (i % step === 0) ba.push([+((matchA[i] + matchB[i]) / 2).toFixed(0), +diffs[i].toFixed(1)]);
    }

    return {
      matched: nM,
      matchRatePct: +((nM / mAll) * 100).toFixed(0),
      haveAbs,
      primaryLabel: primary.label || 'Signal A',
      referenceLabel: reference.label || 'Signal B',
      refIsPulse,
      statsA,
      statsB,
      agreement: {
        biasMs: +bias.toFixed(1),
        sdDiffMs: +sdDiff.toFixed(1),
        loaLoMs: +(bias - 1.96 * sdDiff).toFixed(1),
        loaHiMs: +(bias + 1.96 * sdDiff).toFixed(1),
        madMs: +mad.toFixed(1),
        within25Pct: +within25.toFixed(0),
        pearsonR: r,
        grade: agreeGrade
      },
      discrepancy: {
        dRMSSD,
        dSDNN,
        rmssdRatio,
        pttvMs: pttv,
        meanPairMs: +mp.toFixed(0),
        note: refIsPulse
          ? 'Reference is a pulse signal (PRV). PRV usually carries a touch more variance than ECG-HRV; the excess ≈ pulse-transit-time variability — a vascular / blood-pressure-variability surrogate.'
          : 'Both treated as beat intervals; excess variance shown as a transit-time surrogate where the pulse signal exceeds the electrical one.'
      },
      blandAltman: ba
    };
  }

  // ═══════════════════════════════════════════════════════════════════════════
  //  HEADLESS PUBLIC COMPUTE SURFACE  ·  PulseDex.compute (Phase 9)
  //  ────────────────────────────────────────────────────────────────────────
  //  The migration the parent brief (SIGNAL-ADAPTER-AND-FRONTIER Phase 9) and the
  //  follow-ups (§1/§2/§9a) call for: split READING from COMPUTING and expose a
  //  public, DOM-FREE entry — PulseDex.compute(SignalFrame(rr) | vals[]) →
  //  ganglior.node-export. The Data Unifier and OverDex call THIS through the
  //  shared signal-orchestrate.js chokepoint instead of reaching into private
  //  underscore globals (_pdSeriesStats …), and the app's own exportGanglior uses
  //  the SAME builder so there is ONE windowing/export implementation, not three.
  //
  //  PURITY (Phase 4b positive control): this block references NO document /
  //  window / localStorage. Provenance, kernel and ingest are passed in via opts
  //  by the caller (the app passes window.GangliorProvenance/DexKernel; the
  //  orchestrator passes the isolated host's DexKernel + the adapter ingest).
  // ═══════════════════════════════════════════════════════════════════════════
  function _pdClockS(ms) {
    const d = new Date(ms),
      p = (n) => (n < 10 ? '0' : '') + n;
    return p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds());
  }

  // SignalFrame(rr) | {vals,…} | vals[] → { vals, tsMs, t0Ms, offsetMin }
  function _pdNormalizeRRInput(input) {
    if (Array.isArray(input)) return { vals: input.slice(), tsMs: null, t0Ms: null, offsetMin: null };
    if (input && typeof input === 'object') {
      const vals = input.intervals || input.vals || null;
      if (vals)
        return {
          vals: vals.slice(),
          tsMs: input.tsMs && input.tsMs.length ? input.tsMs.slice() : null,
          t0Ms: input.t0Ms != null ? input.t0Ms : null,
          offsetMin: input.offsetMin != null ? input.offsetMin : null
        };
    }
    return { vals: null, tsMs: null, t0Ms: null, offsetMin: null };
  }

  // Pure reproduction of the EXPORT-relevant subset of calculate(): artifact-clean
  // → timing/coverage → classify → whole-record + windowed HRV → spectrum →
  // composites. Returns a lastResult-shaped object (the fields pdBuildNodeExport
  // reads), or null if there aren't ≥10 usable beats. No DOM, no profile/VO₂.
  function pdComputeResult(input) {
    const f = _pdNormalizeRRInput(input);
    if (!f.vals || f.vals.length < 10) return null;
    const cleanR = artifactClean(f.vals);
    const a = cleanR.clean,
      N = a.length;
    if (N < 10) return null;

    /* ── ENVELOPE vs DATA (NODE-EXPORT-DURATION-SEMANTICS-FOLLOWUPS-II §1) ──────────────────────
       `beatTimes` has two branches: with timestamps it returns a wall SPAN, without them it cumulates
       RR. So `durSec` silently changed meaning between branches, and `coverage` was initialised to
       100 and only ever overwritten on the timestamped path — a completeness claim made from the
       ABSENCE of evidence, which is what the Clock Contract §2.6 and this brief family exist to stop.

       The fix follows HRVDex's sparse block (the in-tree template): the ENVELOPE and the DATA get
       DIFFERENT NAMES so nothing can read one as the other, and the one that cannot be known is
       `null` rather than estimated. An untimed RR stream has no gap information at all, so it has no
       envelope and no coverage — both are null, and `recordedSec` carries what the beats do account
       for.

       `durSec` KEEPS its previous value on purpose. It is not a publication choice: `classifyRecording`
       consumes it immediately and does arithmetic on it, and `adaptEnvelopeNode` reads the exported
       `durationMin` to build this node's fusion window. Nulling it would collapse that window to a
       POINT — the exact DEEP-AUDIT-III §6.2 regression HRVDex already paid for once. So the ambiguity
       is resolved by LABELLING rather than by deletion: `durationBasis` states which of the two a given
       `durationMin` is, and `spanMin`/`recordedMin` publish them separately and unambiguously. */
    const times = beatTimes(a, f.tsMs);
    const durSec = times[N - 1] || (N * mean(a)) / 1000;
    const timedAxis = !!(f.tsMs && isFinite(f.tsMs[0]) && isFinite(f.tsMs[N - 1]));
    let rrSumSec = 0;
    for (let i = 0; i < N; i++) rrSumSec += a[i] / 1000;
    // ENVELOPE — wall span. Unknowable without timestamps, so null, never estimated from the beats.
    const spanSec = timedAxis ? (f.tsMs[N - 1] - f.tsMs[0]) / 1000 : null;
    // COVERAGE — data over envelope. Needs BOTH, so it is null exactly when the envelope is.
    const coverage = spanSec != null && spanSec > 0 ? +Math.min(100, (rrSumSec / spanSec) * 100).toFixed(1) : null;

    const cls = classifyRecording(a, f.t0Ms, durSec);
    const mode = cls.mode;
    const longRec = mode === 'overnight' || mode === 'continuous';

    const meanRR = mean(a),
      sdnn = std(a),
      rm = rmssd(a),
      pn = pnn50(a);
    const hr = +(60000 / meanRR).toFixed(1);

    let win = null,
      dispRm = rm,
      dispSd = sdnn,
      _dispHr = hr,
      dispPn = pn,
      dispMeanRR = meanRR,
      repSeg = a,
      winSpec = null;
    if (longRec) {
      win = windowAnalysis(a, times, 300);
      if (win.wins.length >= 3) {
        const rmA = win.wins.map((w) => w.rmssd),
          sdA = win.wins.map((w) => w.sdnn),
          hrA = win.wins.map((w) => w.hr),
          pnA = win.wins.map((w) => w.pnn),
          rrA = win.wins.map((w) => w.meanRR);
        dispRm = +medianOf(rmA).toFixed(2);
        dispSd = +medianOf(sdA).toFixed(2);
        _dispHr = +medianOf(hrA).toFixed(1);
        dispPn = +medianOf(pnA).toFixed(1);
        dispMeanRR = +medianOf(rrA).toFixed(1);
        let bi = 0,
          bd = Infinity;
        for (let i = 0; i < rmA.length; i++) {
          const d = Math.abs(rmA[i] - dispRm);
          if (d < bd) {
            bd = d;
            bi = i;
          }
        }
        repSeg = win.segs[bi];
        const sh = [],
          sl = [],
          sv = [],
          srr = [],
          slh = [];
        for (const seg of win.segs) {
          const w = lombScargle(seg, 256);
          sh.push(w.hf);
          sl.push(w.lf);
          sv.push(w.vlf);
          if (w.lfhf != null && isFinite(w.lfhf)) slh.push(w.lfhf); // §5.2 — per-segment RATIO
          if (w.respRate > 0) srr.push(w.respRate);
        }
        // DEEP-AUDIT-2026-07-14 §3: define tp as the band SUM, not a 4th independent median — the
        // Task-Force identity vlf+lf+hf==totalPower must hold EXACTLY (median(tp_i) ≠ Σ median(band_i)),
        // mirroring ECGDex:601 / PpgDex. Otherwise Total Power + the HF/LF fraction bars (hf/(tp||1))
        // surface numbers that don't reconcile with the bands beside them (~5–20 % on overnight). The
        // per-segment tp (w.tp) is therefore no longer collected — it never survived the median anyway.
        const _wh = Math.round(medianOf(sh)),
          _wl = Math.round(medianOf(sl)),
          _wv = Math.round(medianOf(sv));
        /* §5.2 — LF/HF IS A PER-SEGMENT QUANTITY, so a night is the MEDIAN OF THE RATIOS, never the
         ratio of the band medians. The Task Force defines LF/HF within one stationary ~5-min spectrum;
         aggregating a night therefore means summarising per-segment ratios, and by Jensen a
         ratio-of-medians differs from a median-of-ratios whenever the per-epoch distribution is skewed
         — which it is on every overnight (measured 4.7 %–18.7 % apart across 13 real nights). It is
         also right-skewed, so the median of the ratios is the appropriate summary.
         ECGDex (`median(epochs.map(e => e.lfhf))`) and PpgDex (`median(lhA)`) already do this; PulseDex
         was the 1-of-3 outlier, and the Integrator read all three into ONE `hrvConsensus.lfhf` spread —
         publishing a purely DEFINITIONAL gap as sensor disagreement on identical beat truth. */
        winSpec = { hf: _wh, lf: _wl, vlf: _wv, tp: _wv + _wl + _wh, lfhf: slh.length ? +medianOf(slh).toFixed(3) : null, respRate: srr.length ? +medianOf(srr).toFixed(1) : 0 };
      }
    }

    const ls = lombScargle(longRec ? repSeg : a);
    const sp = winSpec ? { tp: winSpec.tp, hf: winSpec.hf, lf: winSpec.lf, vlf: winSpec.vlf } : { tp: ls.tp, hf: ls.hf, lf: ls.lf, vlf: ls.vlf };
    const ans = ansBalance(sp.hf, sp.lf);

    const _cMeanRR = longRec ? dispMeanRR : meanRR;
    const cSd = longRec ? dispSd : sdnn,
      cRm = longRec ? dispRm : rm,
      cPn = longRec ? dispPn : pn;
    const stress = stressEst(cSd, cRm),
      hrv = hrvEst(cSd, cRm, cPn),

  function parseTimestamp(s) {

  }

  /* DATE-ONLY → midnight UTC. DEEP-AUDIT-II §5.5.
     Deliberately NOT a branch in `_ckParse`. For a CGM reading a stamp without a time is a MISSING
     instant, and resolving it to midnight would fabricate one — the Clock Contract's "a missing stamp
     must be visible (null), never fabricated". For a nutrition DAILY row the cell genuinely denotes a
     DAY, not an instant, so midnight UTC is its honest anchor rather than an invention. Keeping the
     two apart means a future CGM parser cannot pick this up by accident.
     Every `_ckParse` branch requires a time component, so before this a date-only export parsed to
     null → NaN → `continue`, and EVERY row was skipped. Cronometer's daily-summary export has a Date
     column and no Time column, so that was the whole file: an empty nutrition panel, never an error. */

      // date (2026-13-45, Feb 30) silently ROLLED onto a plausible wrong day and fed the meal↔glucose
      // join (Clock Contract §2.7). Route through the same round-trip every other path uses.
      var mk = _ckMk(+m[1], +m[2] - 1, +m[3], 0, 0, 0, 0);

  }

  function detectDelimiter(headerLine) {
    const counts = { ',': 0, ';': 0, '\t': 0 };
    for (const ch of headerLine) {
      if (ch in counts) counts[ch]++;
    }
    let best = ',',
      bn = -1;
    for (const k in counts) {
      if (counts[k] > bn) {
        bn = counts[k];
        best = k;
      }
    }
    return best;
  }

  // Find which column is the glucose value & which is the timestamp.
  function locateColumns(rows, delim) {
    // Scan up to ~40 rows; a glucose column is mostly numeric in a physiologic band,
    // a timestamp column parses as a date.
    const sample = rows.slice(0, Math.min(rows.length, 60));
    const ncol = Math.max(...sample.map((r) => r.split(delim).length));
    const headCells = (sample[0] || '').split(delim);
    let tsCol = -1,
      gCol = -1,
      gScore = -1;
    for (let c = 0; c < ncol; c++) {
      let dateHits = 0,
        numHits = 0,
        intHits = 0,
        inBand = 0,
        total = 0,
        sum = 0;
      /* SERIAL-INTEGER DETECTION (DEEP-AUDIT-VI F6). Dexcom Clarity's first column is a row
         counter (Index = 1, 2, 3, …) whose values sit inside the [2, 600] "physiologic" band for
         the whole 60-row sample — so it scored within ONE hit of the real glucose column, and a
         single non-numeric glucose cell (the "Low" Clarity writes for below-range readings)
         flipped the pick to it: every headline metric was then computed on ROW NUMBERS, silently.
         A column whose numeric cells are all integers advancing by exactly ±1 is a counter, not a
         measurement — it is disqualified from glucose candidacy outright rather than down-scored,
         because no amount of in-band coverage makes a serial index a glucose series. */
      let prevNum = null,
        stepSign = 0,
        serial = true;
      for (const line of sample) {
        const cells = line.split(delim);
        if (c >= cells.length) continue;
        const cell = (cells[c] || '').trim().replace(/^["']|["']$/g, '');
        if (!cell) continue;
        total++;
        if (isFinite(parseTimestamp(cell)) && /[:\-/]/.test(cell) && cell.length >= 8) dateHits++;
        const num = parseFloat(cell.replace(',', '.'));
        if (isFinite(num) && /^[\s+-]*[\d.,]+\s*$/.test(cell)) {
          numHits++;
          sum += num;
          if ((num >= 2 && num <= 30) || (num >= 30 && num <= 600)) inBand++;
          if (Number.isInteger(num)) intHits++;
          if (prevNum !== null) {
            const st = num - prevNum;
            if (Math.abs(st) !== 1 || (stepSign !== 0 && st !== stepSign)) serial = false;
            else stepSign = st;
          }
          prevNum = num;
        }
      }
      if (total < 3) continue;
      if (dateHits / total > 0.6 && tsCol < 0) tsCol = c;
      const serialCol = serial && numHits >= 5 && intHits === numHits;
      if (serialCol) continue; // a row counter can be a fine tsCol tiebreak-loser, never the glucose
      /* Prefer the numeric column with the most physiologic in-band hits (not the date). A header
         cell naming glucose outranks band statistics (+1 exceeds the whole sc range): the vendor
         DECLARED the column, and the declaration cannot be outvoted by a lucky integer column —
         but only a column that is still mostly numeric may claim the bonus, so a text column
         with a glucose-ish header cannot win. */
      const gHead = /gluco/i.test((headCells[c] || '').trim());

  }

  function parseCSV(text) {

    // fixes the order for the WHOLE file (a European DMY Libre export can no longer let ambiguous rows
    // silently flip to the MDY default mid-file). preferDMY:false = the CGM tiebreaker (Libre/Dexcom MDY).

        .trim()
        .replace(/^["']|["']$/g, '')

      vals = Vs;

  }

  // ════════════════════════════════════════════════════════════════════════
  //  CLEAN — cadence detect · warm-up suppress · gap flag+interp · compression-low
  // ════════════════════════════════════════════════════════════════════════
  /* GAP vs GAP_LONG (DEEP-AUDIT-2026-07-11 §5). A SHORT gap is a physiologic bridge — interpolating across
   one missed 5-min reading is sound, and those cells stay analyzable. A LONG gap (a sensor change, a
   dropout) is hours of straight line the sensor never saw; it must NOT be counted as measured glucose.
   Both used to carry FLAG.GAP, and analyzableIndex filtered neither — so a routine 14 h sensor-change gap
   was interpolated straight into TIR/GMI/CV/MAGE, the validated-tier headline KPIs (TIR read 11 % where
   the truth was 0 %). The distinction is the fix; the code's own comment already claimed it existed. */
  const FLAG = { OK: 0, WARMUP: 1, GAP: 2, COMPRESSION: 3, GAP_LONG: 4 };

  // ── disambiguate a genuine sharp nocturnal hypo from a positional (compression) artifact ──
  // GLUCODEX-HYPO-DISAMBIG (June 2026): the compression-rejection pass used to eat true sharp
  // nocturnal hypos (sub-70 dive + Somogyi rebound) because a hypo's recovery shoulder is the exact
  // bracket it screens for. This pure predicate enforces the discriminator the existing comment
  // already names ("gradual, within an already-low trend"): a genuine insulin hypo sits SUSTAINED
  // < 70 mg/dL, reaches a REAL nadir (≤ ~60), and is entered/left GRADUALLY (descent & rebound span
  // multiple cells). A positional artifact is a near-vertical single-cell drop onto a low plateau
  // and a near-vertical single-cell recovery. Protect a sustained+deep run UNLESS BOTH edges are

    // GRADUAL basal dip to 61-69 (nadir above 60) short-circuited HERE, before the edge-steepness
    // test, and was handed to the compression rule — erasing true insulin hypos from TBR/LBGI/min/

    // gradual dip anywhere in the 54-70 band is protected; only near-vertical single-cell artifact
    // edges (checked below) are still eaten.

  function clean(parsed, progress) {
    const { tMs, vMgdl, unit, t0Ms } = parsed;
    progress && progress(20, 'Detecting cadence & cleaning…');
    const n = tMs.length;
    // cadence = median dt (minutes)
    const dts = [];
    for (let i = 1; i < n; i++) {
      const d = (tMs[i] - tMs[i - 1]) / 60000;
      if (d > 0 && d < 240) dts.push(d);
