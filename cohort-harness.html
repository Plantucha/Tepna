/* ════════════════════════════════════════════════════════════════════════
 * Copyright 2026 Michal Planicka
 * SPDX-License-Identifier: Apache-2.0
   kernel-constants.js — Tepna Physiology Kernel (P8 / KERNEL-BUILD-BRIEF)
   ────────────────────────────────────────────────────────────────────────
   ONE frozen source of truth for every cross-fleet physiology threshold, plus
   a synchronous, content-derived hash stamped into every node export. The
   P12 drift-guard catches divergent constants WITHIN one source tree at test
   time; this hash makes divergence ACROSS deployments visible at fusion time
   (an OxyDex bundle built with one rulebook fused with an ECGDex built with a
   different one no longer "agrees with itself" silently).

   Plain global, no build step, no TypeScript, no CDN. Load FIRST in every
   *.src.html (before the dsp/cross/app scripts), first in tests/run-tests.mjs
   and the first <script> in Dex-Test-Suite.html.

   Hash: 32-bit FNV-1a over VERSION + '|' + JSON.stringify(K). Not sha256 —
   we're offline and a content hash detects drift just as well; sha256 isn't
   worth a dependency. Two builds with identical VERSION + constants produce
   the same HASH by construction; any threshold edit changes it.
   ════════════════════════════════════════════════════════════════════════ */
(function (g) {
  var K = Object.freeze({
    SIGNIF_P: 0.1,
    SIGNIF_TAU: 0.15, // cross-night Mann-Kendall significance
    Z_HEADLINE: 1.2,
    Z_WARN: 1,
    Z_BAD: 2, // baseline z-score thresholds
    ODI_DROP: 4,
    ODI_HYST: 2, // SpO2 desat drop + hysteresis (%)
    MOS_SHORT: 5,
    MOS_LONG: 15, // McGill OxiMetry ODI-4 grade thresholds
    QFLOOR: 50 // HRV consensus quality floor (%)
  });
  function fnv1a(s) {
    var h = 0x811c9dc5;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ('00000000' + h.toString(16)).slice(-8);
  }
  var KERNEL_VERSION = '1.0.0';
  var KERNEL_HASH = fnv1a(KERNEL_VERSION + '|' + JSON.stringify(K));
  g.DexKernel = { K: K, VERSION: KERNEL_VERSION, HASH: KERNEL_HASH, fnv1a: fnv1a };
})(typeof window !== 'undefined' ? window : globalThis);

 * delegating *-dsp.js (dex-coload.js enforces host membership).

  'use strict';

  function tzOffset(instantMs) {
    return new Date(instantMs).getTimezoneOffset() * 60000;
  }

    return n < 10 ? '0' + n : '' + n;

  function _ckNumEpoch(n) {

   single row can no longer flip the order mid-file. A row the lock cannot explain (its month field lands
   outside 1..12) is a contradiction, and a contradiction is null — never a guess.
   Unlocked (no pre-scan) keeps the historical per-call behavior for back-compat. */
  function _ckDMY(a, b, preferDMY, locked) {
    if (locked) {
      var ld = preferDMY ? a : b,
        lmo = preferDMY ? b : a;
      return lmo >= 1 && lmo <= 12 && ld >= 1 && ld <= 31 ? { d: ld, mo: lmo } : null;

    if (b > 12) return { d: b, mo: a };

   Both proofs present ⇒ the file contradicts itself ⇒ refuse (contradictory:true) rather than guess.
   Neither ⇒ genuinely ambiguous ⇒ fall back to the caller's preferDMY, unlocked.
   Pass the result into parseTimestamp as { preferDMY: r.dmy, dmyLocked: r.locked }.
   Only the two ambiguous vendor shapes are scanned (4a "HH:MM:SS D/M/Y" and 4c "D/M/Y HH:MM"); ISO and

  function resolveDMY(rawStamps, preferDMY) {
    var pref = preferDMY !== false,
      sawDMY = false,
      sawMDY = false;
    var RE_A = /^(\d{1,2}):(\d{2}):(\d{2})\s+(\d{1,2})\/(\d{1,2})\/(\d{4})$/; // 4a — O2Ring

    var list = rawStamps || [];
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (typeof s !== 'string') continue;
      s = s.trim().replace(/^["']|["']$/g, '');
      var a = null,
        b = null;
      var mA = s.match(RE_A);
      var mC = mA ? null : s.match(RE_C);
      if (mA) {
        a = +mA[4];
        b = +mA[5];
      } else if (mC) {
        a = +mC[1];
        b = +mC[2];
      } else continue;
      if (a > 12) sawDMY = true;
      if (b > 12) sawMDY = true;
      if (sawDMY && sawMDY) break; // contradiction proven — no need to scan further
    }
    if (sawDMY && sawMDY) return { dmy: pref, locked: false, contradictory: true };
    if (sawDMY) return { dmy: true, locked: true, contradictory: false };
    if (sawMDY) return { dmy: false, locked: true, contradictory: false };

       and the doc-comment above has always said "refuse rather than guess" — but the flag was computed
       and thrown away by every caller, so the file silently fell back to the caller's PREFERENCE. One
       anomalous row moved a proven-MDY O2Ring night 2026-06-12 → 2026-12-06, with the date, t0Ms,
       exportName(), the crossnight axis and the Integrator's date join all confidently wrong.
       We refuse the ROW, not the FILE: only the two AMBIGUOUS slash shapes (4a/4c) return null, because
       only they depend on the unresolvable order. An ISO, epoch, 14-digit or time-only stamp in the same

       would be its own kind of dishonesty. */

    var anchor = opts.dateAnchorMs != null && isFinite(opts.dateAnchorMs) ? opts.dateAnchorMs : null;
    if (raw == null) return null;
    if (typeof raw === 'number') return _ckNumEpoch(raw);
    var s = String(raw)
      .trim()
      .replace(/^["']|["']$/g, '');

      if (!dm) return null; // row contradicts the file's proven order → honest null

      if (dmyContradictory) return null; // §1.1 — the file's day/month order is unresolvable; this SHAPE cannot be read

      if (!dm2) return null; // row contradicts the file's proven order → honest null

      if (t == null) return null; // §12.3 — an out-of-range time-only stamp (e.g. 25:99) → honest null
      if (opts.prevTMs != null && isFinite(opts.prevTMs)) {

           backwards step as a midnight wrap, so ONE duplicated row turned a 120-minute night into a
           claimed 1560 minutes and collapsed SBII 13× — while start/end still read correctly and
           `clockNonMonotonic` stayed false, because OxyDex's guard only catches a NEGATIVE span.
           The two in-repo siblings (`oxydex-fusion.js:42`, `cpapdex-coimport.js:49`) use a 1-second
           tolerance, and the audit's own fix sketch proposed the same — but executing it disproved
           it: with −1 s only a 1-second blip is absorbed, and 2 s, 5 s, 60 s and 3600 s all still
           rolled a whole day. A real wrap is ~23 h backwards. The threshold therefore has to be a
           FRACTION OF A DAY, not a jitter allowance: roll only when the step back is larger than any
           plausible clock disorder within one recording. 12 h is the natural split — it is the
           largest backwards step that cannot be a wrap (a wrap is ≥ ~23 h) and the smallest that no
           duplicated/jittered row can reach. */
        while (t < opts.prevTMs - CK_ROLL_SLACK_MS) t += 86400000;

  // ══════════════════════════════════════════════════════════════════════════════════════
  //  Every Polar-Sensor-Logger / capture-host stream carries TWO clocks on EVERY row:
  //      col 0  "Phone timestamp"        — the capture HOST (vigil box: chrony local-stratum-1, 0.008 ppm)
  //      col 1  "sensor timestamp [ns]"  — the DEVICE's own crystal
  //  The nodes historically read the host stamp ONCE (to anchor t0Ms) and then rode the DEVICE
  //  crystal for the rest of the night — ppgdex `relSec = ns/1e9`, ecgdex `t0 + i/fs` with fs from
  //  the device's own ms column. That puts an uncorrected crystal on the EXPORTED axis while a
  //  disciplined clock sat unused in column 0 of every row.
  //
  //  Measured on 2026-07-26 by deciles of (host − device), with NO fitting of any kind:
  //      H10 ECG       −0.70 s over 434 min   −27 ppm, smooth
  //      Verity PPG    −0.34 s over 189 min   −30 ppm, smooth
  //      O2Ring PPG   −18.49 s over 190 min   NON-LINEAR — −3035 ppm decaying to −1622 ppm
  //  A counter reset was ruled out first (it would fake any global slope): the O2Ring ramp is
  //  smooth, so it is a genuine rate error — and because it is non-linear, NO single ppm and no
  //  linear fit describes it. That is why this interpolates a measured curve instead of fitting.
  //
  //  TWO properties of the correction, neither optional:
  //    • SLOW.   Its own slope is ~30 ppm (30 µs per second), so RR/PPI intervals keep the device's
  //      fine structure. The crystal is excellent at short scales; only its RATE is wrong. Correcting
  //      the rate must not disturb the intervals HRV is computed from.
  //    • ROBUST. Host stamps carry BLE delivery jitter (~0.1 s here — visible as the Verity's
  //      −0.15/−0.08/−0.26 wobble). Interpolating RAW anchors would inject that jitter straight into
  //      beat times, which for HRV is worse than the drift it fixes. A running median rejects it.
  //
  //  NO SPAN GATE HERE — and that is deliberate, because the sibling tool needed one. A ppm QUOTED
  //  from a short fragment is unreliable (dual-clock-rate.mjs measured the same H10 at −20.3 ppm over
  //  373 min and −65.8 ppm over 10.9 min), so that tool gates on span. This function is not quoting a
  //  rate: it INTERPOLATES the measured divergence, so the correction it applies is bounded by what it
  //  actually observed over that fragment. On a short H10 fragment the noise is ~12 ms; on a short
  //  O2Ring one the real error is ~3 s and very much worth removing. Gating on span would refuse
  //  exactly the case that needs it most. `ppm` is REPORTED for diagnosis — do not quote it from a
  //  short fragment without the span beside it.
  //
  //  ⚠ This does NOT claim the host is absolutely right. It places every device on ONE timebase, so
  //  they become mutually consistent; whether that timebase is itself correct is the host's business
  //  (0.008 ppm on the capture box — UNVERIFIED on phone captures, where the column is a real phone).
  //  Reported, never assumed: `maxStepMs` surfaces a genuine clock STEP smeared across one anchor gap
  //  (2026-07-26 carries a 1.90 s O2Ring step and a 3.22 s H10 one) rather than hiding it in a slope.
  //  Window CHOSEN BY MEASUREMENT, not taste — planted recovery against ±100 ms jitter over the real
  //  190 min / 2873-anchor O2Ring geometry (worst / rms residual, ms):
  //      win  9 → 77 / 36.3      win 21 → 57 / 18.7      win 41 → 168 / 16.5      win 81 → 245 / 24.8
  //  21 halves the jitter without over-smoothing; 41+ starts flattening the O2Ring's real curvature,
  //  which is the one thing this must follow. Step recovery is unaffected across the whole range.
  /* ── ALLAN DEVIATION, THE SPINE COPY (HOSTAXIS-STABILITY-2026-08-13-BRIEF) ─────────────────────────
     WHY IT LIVES HERE. `hostAxis` publishes a `ppm` with no statement of how far to trust it, and §7's
     rule "never quote a ppm without the span beside it" was enforced by prose plus one hand-picked
     threshold. Allan deviation is the standard answer — it says whether an error shrinks when you
     average longer, which a standard deviation CANNOT, because SD diverges for several of these noise
     types as N grows (NIST/Riley SP 1065).
     Promoted rather than copied: `ppgdex-dsp.js` had the only JS core and `ecgdex-dsp.js` had none, so
     giving each node its own would have made a fourth implementation. It sits in the spine for the same
     reason `parseTimestamp` does (§✅) — one definition, inlined everywhere, delegated to by name.
     `integrator-tch.js` deliberately keeps its own: different domain (frequency series, per-node
     three-cornered hat) and a different API. `capture-host/allan.py` is a different LANGUAGE lane and

// ── csvSafe: prevent Excel formula injection in CSV exports ──

  if (v === null || v === undefined) return '';

function sanitizeFname(s) {
  if (!s) return '';

    return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c];

      cnt = 0;

// Returns an array bl[] where bl[i] = mean(spo2[max(0,i-WIN)..i-1]).
// Replaces the O(n²) pattern: getBaseline(spo2.slice(0,i), WIN) inside loops.
// Usage: var blArr = computeBaselineArr(spo2, WIN); … var bl = blArr[i];

    cnt = 0;

    if (i > 0) {

      cnt++;
    }
    if (i > WIN) {
      sum -= spo2[i - WIN - 1];
      cnt--;
    }
    bl[i] = cnt > 0 ? sum / cnt : 95;
  }
  return bl;

// ── computeCeilingBaselineArr: O(n) trailing high-percentile "ceiling" baseline ──
// Returns bl[] where bl[i] = pct-th percentile of spo2[max(0,i-WIN)..i-1] (the recent
// resting/stable SpO2). Unlike the trailing MEAN (computeBaselineArr), brief dips sit in
// the lower tail and barely move a high percentile, so the ceiling is NOT dragged down by
// closely-spaced desaturations. This is the AASM-style reference level a 4% desaturation
// is defined against, and it removes the trailing-mean self-suppression that made ODI
// under-count proportionally to OSA severity (severe OSA dips drag a mean baseline below
// `baseline−4%`, hiding later events of equal depth). See OXYDEX-ODI-CEILING-FIX-BRIEF.md.
//
// Implementation: incremental 101-bin histogram over integer SpO2 0..100, slid one sample
// per index (add spo2[i-1], drop spo2[i-WIN-1]); the percentile is read by walking the
// histogram low→high to the first value whose cumulative count reaches the target rank.
// Integer SpO2 makes the histogram exact; the per-index walk is over a fixed 101 bins → O(n).
// Window/fallback semantics mirror computeBaselineArr exactly (same coverage, bl[0]=95).
function computeCeilingBaselineArr(spo2, WIN, pct) {
  WIN = WIN || 300;
  pct = pct == null ? 90 : pct; // p90 = the stable resting ceiling (default, brief §2a)
  var n = spo2.length;
  var bl = new Array(n);
  var NB = 101; // bins 0..100 (% SpO2, integer)
  var hist = new Int32Array(NB);
  var cnt = 0,
    i,
    b;
  function bin(v) {
    v = Math.round(v);
    return v < 0 ? 0 : v > 100 ? 100 : v;
  }
  for (i = 0; i < n; i++) {
    if (i > 0) {
      hist[bin(spo2[i - 1])]++;
      cnt++;
    }
    if (i > WIN) {
      hist[bin(spo2[i - WIN - 1])]--;
      cnt--;
    }
    if (cnt > 0) {
      var target = Math.ceil((pct / 100) * cnt);
      if (target < 1) target = 1;
      var acc = 0,
        v = 100;
      for (b = 0; b < NB; b++) {
        acc += hist[b];
        if (acc >= target) {
          v = b;
          break;
        }
      }
      bl[i] = v;
    } else {
      bl[i] = 95; // same cold-start fallback as the mean baseline
    }
  }
  return bl;
}

  var bap = upBAP();
  var vo2abs = upVO2abs();
  var vo2cat = UP.vo2GT > 0 ? upVO2category(UP.vo2GT) : null;

  function pd(id, html) {
    var el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  pd('pd_hrmax', '<b>HRmax: ' + hrm + ' bpm</b> (' + upHRmaxSource() + ')');
  pd('pd_bmi', '<b>BMI: ' + bmi + '</b> (' + upBMILabel(bmi) + ')');
  pd('pd_bsa', '<b>BSA: ' + bsa + ' m²</b> (DuBois)');
  pd('pd_ibw', '<b>IBW: ' + ibw + ' kg</b> (Devine)');
  pd('pd_map', '<b>MAP: ' + map + ' mmHg</b> (DBP+(SBP−DBP)/3)');
  pd('pd_pp', '<b>Pulse Pressure: ' + pp + ' mmHg</b> (' + (pp < 50 ? '✅ <50=optimal' : '⚠️ elevated') + ')');
  pd('pd_bmr', '<b>BMR: ' + bmr + ' kcal</b> (Mifflin-St Jeor)');
  pd('pd_bap', '<b>BAP: ' + bap + '</b> (' + (bap < 2.1 ? '✅ <2.1=good' : '⚠️ elevated') + ') <span class="bap-note">(non-standard · trend only)</span>');
  pd('pd_vo2abs', vo2abs !== null ? '<b>VO₂ absolute: ' + vo2abs + ' L/min</b>' : '<b>VO₂ absolute:</b> enter VO₂max above');
  pd('pd_vo2cat', vo2cat ? '<b>VO₂ category: ' + vo2cat.cat + '</b> (~' + vo2cat.pct + ' pct)' : '<b>VO₂ category:</b> enter VO₂max above');
  // NOTE (DEEP-AUDIT-II #43): the SpO₂ elevation adjustment is now disclosed at the
  // SpO₂ KPI via spo2ElevNote() (oxydex-render.js Oxygen card), where it grades a
  // number — not here, where the target `pd_elev` id never existed and rendered
  // nothing. The remaining pd_* writes below are likewise legacy no-ops (tracked
  // under §13's profile-panel findings), left untouched by this fix.

  // Karvonen zones — use UP.hrRest if auto-detected, else estimate
  // HRrest priority: 1) manual entry, 2) derived from user's nocturnal data, 3) age-adjusted population estimate
  var hrRestFallback = Math.round(Math.max(45, Math.min(80, 71 - 0.25 * (UP.age || 49)))); // literature: ~71-0.25×age
  var hrRest =
    UP.hrRestOverride && UP.hrRestOverride > 30 && UP.hrRestOverride < 100 ? UP.hrRestOverride : window._upHRrest && window._upHRrest > 30 && window._upHRrest < 80 ? window._upHRrest : hrRestFallback;
  var zones = [
    { id: 'pz1', lo: 0.5, hi: 0.6, label: 'Z1' },
    { id: 'pz2', lo: 0.6, hi: 0.7, label: 'Z2' },
    { id: 'pz3', lo: 0.7, hi: 0.8, label: 'Z3' },
    { id: 'pz4', lo: 0.8, hi: 0.9, label: 'Z4' },
    { id: 'pz5', lo: 0.9, hi: 1.0, label: 'Z5' }
  ];
  zones.forEach(function (z) {
    var zn = upKarvonenZone(z.lo, z.hi, hrRest, hrm);
    var el = document.getElementById(z.id);
    if (el) el.textContent = zn.low + '–' + (z.lo === 0.9 ? hrm + '+' : zn.high) + ' bpm';
  });

  // Weight/height hint
  var pop = upPopAvg();
  var ideal = upIdealWt();
  var wh = document.getElementById('profileWtHtHint');
  if (wh)
    wh.innerHTML =
      '📊 Pop avg (' +
      UP.sex +
      ', entered age ' +
      UP.age +
      '): ' +
      pop.wt +
      ' kg / ' +
      pop.ht +
      ' cm' +
      ' &nbsp;·&nbsp; 🎯 Ideal wt (BMI 22.5): ' +
      ideal +
      ' kg' +
      ' &nbsp;·&nbsp; Updates when age or sex changes';

  // ── Per-field projected value + formula sublabels ───────────────
  // Mirrors the Age field's pattern: every input shows what the
  // tool would predict for that field if left auto, plus the
  // formula. UNIVERSAL: projections use the system-DETECTED ANS age
  // (when available) rather than the manually-entered age, so the
  // yellow line shows what the system thinks regardless of input.
  // User-entered values stay in the white input box.
  function _sub(id, txt) {
    var el = document.getElementById(id);
    if (el) el.textContent = txt;
  }

  // ANS-age projection REMOVED 2026-06-23 (DEX-METRIC-REMOVAL-AUDIT 🔴): weight/HRmax/HRrest
  // projections use the user's CHRONOLOGICAL age (population default 49 if unset), never an
  // HRV-derived "autonomic age".
  var _projAge = UP.age || 49;
  var _ageNote = '';
  // CDC pop avg using projection age (not UP.age) — sex-aware
  var _popProj = UP.sex === 'male' ? { wt: +(86 + (_projAge - 40) * 0.1).toFixed(1), ht: 175.7 } : { wt: +(74 + (_projAge - 40) * 0.1).toFixed(1), ht: 161.8 };
  // Ideal weight using current height + BMI 22.5
  var _idealProj = upIdealWt();
  // HRmax using projection age (Tanaka)
  var _hrmaxProj = Math.round(208 - 0.7 * _projAge);

  // Sex — no projection; describe what the field drives
  _sub('profileSexSub', '— manual · drives BMR (Mifflin), IBW (Devine), VO₂ norms (ACSM)');

  // Weight — CDC pop avg using detected/manual age + ideal weight
  _sub('profileWtSub', '∼ CDC pop avg ' + _popProj.wt + ' kg (' + UP.sex + ', age ' + _projAge + _ageNote + ')' + ' · ideal (BMI 22.5) ' + _idealProj + ' kg');

  // Height — CDC pop avg by sex + BSA from current values
  _sub('profileHtSub', '∼ CDC pop avg ' + _popProj.ht + ' cm (' + UP.sex + ') · BSA ' + bsa + ' m² (DuBois)');

  // HRmax — Tanaka using projection age
  if (UP.hrmaxOverride > 0) {
    _sub('profileHRmaxSub', '∼ Tanaka: 208 − 0.7 × ' + _projAge + _ageNote + ' = ' + _hrmaxProj + ' bpm · override active: ' + UP.hrmaxOverride);
  } else {
    _sub('profileHRmaxSub', '∼ Tanaka: 208 − 0.7 × ' + _projAge + _ageNote + ' = ' + _hrmaxProj + ' bpm (auto)');
  }

  // HRrest — sublabel only seeded here if no nights loaded;
  // profileAutoDetectUpdate writes the data-driven avg+last version when nights exist.
  if (!window._upHRrest) {
    var _hrRestProj = Math.round(Math.max(45, Math.min(80, 71 - 0.25 * _projAge)));
    _sub('profileHRrestSub', '∼ age-est: 71 − 0.25 × ' + _projAge + _ageNote + ' ≈ ' + _hrRestProj + ' bpm · upload data for nocturnal p5');
  }

  // VO₂max — Uth-Sørensen formula using projected HRmax + current HRrest;
  // overridden by profileAutoDetectUpdate when night data exists.
  if (!window._upHRrest) {
    // only show formula version when no night data
    var _vo2Auto = +(15.3 * (_hrmaxProj / hrRest)).toFixed(1);
    var _vo2Cat = upVO2category(UP.vo2GT > 0 ? UP.vo2GT : _vo2Auto);
    var _vo2Txt = '∼ Uth-Sørensen: 15.3 × ' + _hrmaxProj + '/' + hrRest + ' = ' + _vo2Auto + ' mL/kg/min';
    if (_vo2Cat) _vo2Txt += ' · ' + _vo2Cat.cat + ' (' + _vo2Cat.pct + ')';
    _sub('profileVo2Sub', _vo2Txt);
  }

  // SBP / DBP — user-entered cuff values only (HRV/oximetry BP projection removed
  // 2026-06-23, DEX-METRIC-REMOVAL-AUDIT 🔴). No data-driven overwrite.
  if (!window._upHRrest) {
    _sub('profileSbpSub', '∼ enter cuff SBP (HRV/oximetry BP projection removed 2026-06-23)');
    _sub('profileDbpSub', '∼ enter cuff DBP (HRV/oximetry BP projection removed 2026-06-23)');
  }

  // Elevation — show current SpO₂ adjustment alongside formula. `_elv`/`_adj` were
  // shared with the dead `pd_elev` disclosure that DEEP-AUDIT-II #43 removed; this
  // profileElevSub sub still needs them, so they are declared locally here (the #43
  // removal dropped the shared declarations and left this line referencing undefined
  // names → a ReferenceError that broke profileDerivedUpdate — regression hotfix).
  var _elv = UP.elevation;
  var _adj = upSpo2Adj();
  /* Three states, three messages — an unmeasured profile must not read as a measured coast (§∅). */
  _sub(
    'profileElevSub',
    _elv == null
      ? '∼ not set — no altitude adjustment applied (enter your elevation; −1.8% SpO₂ per 1000 m, Roach 1998)'
      : _elv > 0
        ? '∼ Roach 1998: −1.8%/1000m · adj −' + _adj + '% (norm ≥' + (95 - _adj) + '%)'
        : '0 m = sea level (measured) · −1.8% SpO₂ per 1000m (Roach 1998)'
  );
}

function profileAutoDetectUpdate(allNights) {
  // Called after renderAll with the nights array — auto-fills from data
  if (!allNights || !allNights.length) return;

  var hrFloors = [],
    dates = [];
  var hrMins = [],
    hrMaxes = [],
    rmssdVals = [];
  // ANS-age component arrays (ansAges/c1s/c2s/c3s) REMOVED 2026-06-23 (DEX-METRIC-REMOVAL-AUDIT 🔴)

  allNights.forEach(function (n) {
    if (!n) return;
    dates.push(n.date);
    // Nocturnal p5 HR floor — more robust than absolute minHr
    // p5 is pre-computed in n.hrv.hrFloor during CSV parsing
    if (n.hrv && n.hrv.hrFloor > 30 && n.hrv.hrFloor < 80) hrFloors.push(n.hrv.hrFloor);
    if (n.stats) {
      hrMins.push(n.stats.minHr);
      hrMaxes.push(n.stats.maxHr);
    }
    // morning-% counter REMOVED (DSP-NITS-2026-07-03 §2): n.date is date-only ('YYYY-MM-DD', no 'T'),
    // so the old split('T')[1] guard was always false and morningPct was permanently 0 — and OxyDex
    // never surfaced it. hrvdex-profile.js is the working twin if a morning-% pill is ever wanted
    // (derive the hour from t0Ms via getUTCHours(), Clock Contract §5 — never string-split a date).
    if (n.hrv) {
      var rmssd = n.hrv.rmssd;
      if (rmssd != null && isFinite(rmssd)) rmssdVals.push(rmssd);
      // ANS-age 3-metric composite (C1 RMSSD·25% · C2 SDNN·40% · C3 HR-floor·35%) REMOVED
      // 2026-06-23 (DEX-METRIC-REMOVAL-AUDIT 🔴): a population age-regression dressed as a
      // personal "autonomic age" — indefensible single-number framing, no validation.
    }
  });

  var n = allNights.length;
  var span = 0;
  if (dates.length > 1) {
    var d1 = new Date(dates[0]),
      d2 = new Date(dates[dates.length - 1]);
    span = Math.abs(Math.round((d2 - d1) / (1000 * 60 * 60 * 24)));
  }

  // Median nocturnal p5 across all nights
  var hrFloorMed = hrFloors.length
    ? Math.round(
        hrFloors.sort(function (a, b) {
          return a - b;
        })[Math.floor(hrFloors.length / 2)]
      )
    : null;

  // Awake resting HR estimate:
  //   = nocturnal_p5 + 8
  // The +8 offset is a population mean (sleep HR is ~8 bpm below awake resting HR).
  // Athletes with strong autonomic tone typically show a larger dip (+12–15 bpm),
  // so the +8 estimate will underestimate awake resting HR for trained individuals.
  // Rule of thumb: if user's actual awake resting HR is known, always prefer manual entry.
  var hrRestEst = hrFloorMed ? hrFloorMed + 8 : null;

  var hrMin = hrMins.length ? Math.min.apply(null, hrMins) : null;
  var hrMax = hrMaxes.length ? Math.max.apply(null, hrMaxes) : null;
  // ANS age (ansAge / _ansBreakdown median) REMOVED 2026-06-23 (DEX-METRIC-REMOVAL-AUDIT 🔴).

  // Store detected floor for Karvonen fallback
  if (hrFloorMed) window._upHRrest = hrRestEst;

  // ── Capture LAST-NIGHT values for sublabel display ──────────────────
  // allNights is sorted ascending by date upstream; last element = most recent.
  var lastN = allNights[allNights.length - 1];
  var lastNightVals = {};
  if (lastN) {
    if (lastN.hrv && lastN.hrv.hrFloor > 30 && lastN.hrv.hrFloor < 80) {
      lastNightVals.hrFloor = lastN.hrv.hrFloor;
      lastNightVals.hrRest = lastN.hrv.hrFloor + 8;
    }
    if (lastN.vo2est && lastN.vo2est.vo2est) lastNightVals.vo2 = lastN.vo2est.vo2est;
    // lastNightVals.ansAge + bpProj SBP/DBP REMOVED 2026-06-23 (DEX-METRIC-REMOVAL-AUDIT 🔴).
  }

  // ANS-age exposure (window._ansAgeAvg / _ansAgeLast) REMOVED 2026-06-23
  // (DEX-METRIC-REMOVAL-AUDIT 🔴): projections now use chronological age only. Kept as
  // explicit null so any stray reader sees "no ANS age".
  window._ansAgeAvg = null;
  window._ansAgeLast = null;

  // Build auto-detect text
  var parts = [];
  parts.push(n + ' measurements over ' + (span || '?') + ' days');
  if (hrFloorMed) parts.push('Resting HR: ' + hrFloorMed + ' bpm (nocturnal p5)');
  // ANS-age auto-detect pill REMOVED 2026-06-23 (DEX-METRIC-REMOVAL-AUDIT 🔴).
  if (hrMin && hrMax) parts.push('HR range: ' + hrMin + '–' + hrMax + ' bpm');

  var el = document.getElementById('profileAutoText');
  if (el)
    el.innerHTML = parts
      .map(function (p) {
        return '<span class="auto-pill">' + p + '</span>';
      })
      .join('');

  // ANS-age sublabel + "Projected ANS Age" hero footer REMOVED 2026-06-23
  // (DEX-METRIC-REMOVAL-AUDIT 🔴): a population age-regression shown as a personal age.

  // Auto-fill HR rest (p5 + 8) if user hasn't manually set it
  // Detected resting HR → shared DETECTED tier (NOT manual identity). window._upHRrest
  // (set above) still feeds the Karvonen zones; the unified panel shows it as "detected".
  if (hrRestEst && window.DexProfile) {
    try {
      window.DexProfile.prefillFrom({ hrRest: hrRestEst });
    } catch (e) {}
  }
  // Always update HRrest sublabel with avg + last-night value
  if (hrFloorMed) {
    var hrSub = document.getElementById('profileHRrestSub');
    if (hrSub) {
      var txt = '∼ avg ' + (hrFloorMed + 8) + ' bpm (p5 ' + hrFloorMed + ' + 8)';
      if (lastNightVals.hrRest != null) {
        txt += ' · last ' + lastNightVals.hrRest + ' (p5 ' + lastNightVals.hrFloor + ' + 8)';
      }
      txt += ' · trained athletes typically 12–15 bpm lower';
      hrSub.textContent = txt;
    }
  }

  // HRV/oximetry→SBP/DBP autofill REMOVED 2026-06-23 (DEX-METRIC-REMOVAL-AUDIT 🔴):
  // cuffless BP from signals is indefensible (bpProj is already hard-null in dsp).
  // prof_sbp/prof_dbp stay USER-ENTERED cuff inputs only.

  // Auto-fill VO2 from best night estimate — sublabel shows avg + last + ACSM tier
  var vo2Nights = allNights.filter(function (n) {
    return n && n.vo2est && n.vo2est.vo2est;
  });
  if (vo2Nights.length) {
    var vo2s = vo2Nights
      .map(function (n) {
        return n.vo2est.vo2est;
      })
      .sort(function (a, b) {
        return a - b;
      });
    var vo2Med = +vo2s[Math.floor(vo2s.length / 2)].toFixed(1);
    if (window.DexProfile) {
      try {
        window.DexProfile.prefillFrom({ vo2: vo2Med });
      } catch (e) {}
    }
    // Update sublabel with avg + last + ACSM category
    var _vc = upVO2category(vo2Med);
    var vs = document.getElementById('profileVo2Sub');
    if (vs) {
      var vTxt = '∼ avg ' + vo2Med + ' mL/kg/min';
      if (lastNightVals.vo2 != null) {
        vTxt += ' · last ' + (+lastNightVals.vo2).toFixed(1);
      }
      vTxt += ' · Uth-Sørensen across ' + vo2Nights.length + ' nights';
      if (_vc) vTxt += ' · ' + _vc.cat + ' (' + _vc.pct + ')';
      vs.textContent = vTxt;
    }
  }

  profileDerivedUpdate();
  // No upSave: auto-detected values live in the DETECTED tier (prefillFrom above), never
  // persisted as manual. Only explicit panel edits write manual identity (no leak).
}

function recomputeFromProfile() {
  // Re-run VO2max and Karvonen zones for every loaded night using current UP profile.
  // Called when profile changes (age, HRmax override, HRrest override).
  // Does NOT re-parse raw CSV — uses stored night stats + current UP values.
  Object.values(allNights).forEach(function (n) {
    try {
      // ── VO2max (Uth-Sørensen: HRmax/HRrest * 15) ───────────────
      var hrMax = UP.hrmaxOverride && UP.hrmaxOverride > 100 ? UP.hrmaxOverride : Math.round(208 - 0.7 * (UP.age || 49));
      var hrRest = UP.hrRestOverride && UP.hrRestOverride > 30 && UP.hrRestOverride < 100 ? UP.hrRestOverride : n.vo2est ? n.vo2est.hrRest : n.hrv ? n.hrv.hrFloor : null;
      if (hrRest && hrRest > 30 && hrRest < 80 && hrMax > 100) {
        var _rmssdAdj = n.hrv && n.hrv.rmssd != null ? +Math.max(-3, Math.min(3, (n.hrv.rmssd - 1.4) * 1.05)).toFixed(1) : 0;
        var _newBase = +(15.3 * (hrMax / hrRest)).toFixed(1);
        var _newVo2 = +(_newBase + _rmssdAdj).toFixed(1);
        if (!n.vo2est) n.vo2est = {};
        n.vo2est.hrRest = hrRest;
        n.vo2est.hrMax = hrMax;
        n.vo2est.rmssdAdj = _rmssdAdj;
        n.vo2est.vo2est = _newVo2;
        n.vo2est.vo2Low = +(_newVo2 - 10.8).toFixed(1);
        n.vo2est.vo2High = +(_newVo2 + 10.8).toFixed(1);
        var _vc = upVO2category(_newVo2);
        if (_vc) {
          n.vo2est.vo2Category = _vc.cat + ' (' + _vc.pct + ')';
          n.vo2est.vo2Pct = _vc.pct;
        }
      }
      // ── Karvonen zones + readiness (pass null rows — guard allows it now) ──
      var newKarv = window.OxyDex._bare.computeKarvonenZones(null, n.hrv, n.vo2est, n.odi4, n.hypDose, n.sleepArch, n.stageProxy, UP.age || 49, n.stats ? n.stats.durationMin : null);
      if (newKarv) n.karv = newKarv;
    } catch (e) {}
  });
}

function profileChanged() {
  upFromDOM();
  upSave();
  profileDerivedUpdate();
  if (window.allNights && Object.keys(window.allNights).length > 0) {
    // Debounce the heavy dashboard re-render so typing in a profile field
    // doesn't rebuild #results on every keystroke (which moved the focused
    // input mid-edit and felt like the value was being lost).
    clearTimeout(window._profRenderTimer);
    window._profRenderTimer = setTimeout(function () {
      try {
        recomputeFromProfile(); // re-run VO2max + Karvonen before re-render
        renderAll();
      } catch (e) {}
    }, 450);
  }
}

function toggleProfile() {
  var body = document.getElementById('profileBody');
  var btn = document.getElementById('profileToggleBtn');
  if (!body || !btn) return;
  var isOpen = body.dataset.open !== 'false';
  body.dataset.open = isOpen ? 'false' : 'true';
  body.style.display = isOpen ? 'none' : 'block'; // explicit 'block', not '' (avoids CSS override)
  btn.textContent = isOpen ? '▼ expand' : '▲ collapse';
  btn.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
}

function openProfile() {
  var body = document.getElementById('profileBody');
  var btn = document.getElementById('profileToggleBtn');
  if (!body || !btn) return;
  body.dataset.open = 'true';
  body.style.display = 'block'; // explicit 'block' overrides any CSS display:none
  btn.textContent = '▲ collapse';
  btn.setAttribute('aria-expanded', 'true');
  var panel = document.getElementById('userProfilePanel');
  if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Init on page load ──
(function initProfile() {
  upLoad();
  upToDOM();
  profileDerivedUpdate();
  if (window.DexProfile && window.DexProfile.renderPanel) {
    window._oxyPanel = window.DexProfile.renderPanel({
      node: 'oxydex',
      mount: 'dexProfilePanel',
      onChange: function () {
        upLoad(); // adopt the now-non-pristine shared record into UP
        profileDerivedUpdate(); // refresh Karvonen zones (legacy pd_*/subs are no-ops)
        if (window.allNights && Object.keys(window.allNights).length > 0) {
          clearTimeout(window._profRenderTimer);
          window._profRenderTimer = setTimeout(function () {
            try {
              recomputeFromProfile();
              renderAll();
            } catch (e) {}
          }, 350);
        }
      }
    });
  }
})();

// ESM-MIGRATION deep-3: publish the cross-file surface (dsp's upVO2category reach-in,
// render's upSpo2Adj/profileAutoDetectUpdate calls, the app/data-act profile controls).
Object.assign(window, {
  upSpo2Adj,
  spo2ElevNote,
  upVO2category,
  profileAutoDetectUpdate,
  toggleProfile,
  openProfile
});
// FOLLOWUPS-II item 3: inject profile's VO₂-classifier hook into the DSP (no longer reached bare).
if (window.OxyDex && window.OxyDex.setHooks) window.OxyDex.setHooks({ upVO2category });

</script>

    // the Health-Box `*_OXYFRAME.txt` sidecar is a semicolon-separated SUPERSET of it — same
    // spo2/pulse/motion columns (so every SpO₂ metric is byte-identical either way) PLUS the O2Ring
    // live-header **perfusion index** (`pi_pct`, from frame byte [7]÷10) that the ViHealth CSV layout
    // has no column for. Detect the delimiter once so OxyDex can ingest either; a comma file simply
    // has no pi column and PI reads null (absent-safe, no fabrication).

  // block from the edges BEFORE any metric reads the rows. Runs first in processNight — same class of
  // action as parseCSV already dropping the device's '- -' no-reading rows (a non-signal edge block,
  // not real data). The O2Ring holds a byte-frozen (SpO2,HR) placeholder (observed 84/100, motion 0)

  //   ADAPTIVE     — trims the frozen run's ACTUAL length (0/8/25 s seen), never a fixed window;
  //   CONSERVATIVE — the run must be byte-frozen-identical in (SpO2,HR), sit at the very edge, be

      var pre = rows[n - 1 - tlen],
        first = rows[n - tlen];
      var dS2 = pre.spo2 - first.spo2; // step DOWN into placeholder
      var dH2 = Math.abs(pre.hr - first.hr);
      if (dS2 >= SPO2_STEP || dH2 >= HR_STEP) tail = tlen;
    }

    // ── FLOOR guard: never leave fewer than FLOOR rows (favor the head trim) ──
    if (n - head - tail < FLOOR) {
      if (n - head < FLOOR) head = Math.max(0, n - FLOOR);
      tail = Math.max(0, Math.min(tail, n - head - FLOOR));
    }

    if (tail) rows.splice(n - tail, tail); // splice tail first (original-n indices unaffected by head splice)
    if (head) rows.splice(0, head);
    return { head: head, tail: tail };
  }

  // Two-tier filter:
  //   Hard:  any 1-sample HR rise ≥ 20 BPM  → always artifact (physiologically impossible)
  //   Soft:  any 1-sample HR rise ≥ 15 BPM  within ±2 min of a clock hour → clock-aligned artifact
  //          (catches slower-ramp firmware cycles that don't trip the hard threshold)
  // OXYDEX-HR-ARTIFACT-RUNAWAY-FIX (2026-07-03, user-reported "100 bpm all night"): the recovery
  // search below used to run UNBOUNDED — if the signal never wandered back within RECOV of the
  // pre-jump `baseline`, every remaining row got overwritten with that one stale anchor, all the way
  // to the end of the recording. That anchor is often ITSELF the bad reading (an O2Ring warm-up /
  // contact-settling transient before the finger/ear clip seats — the first jump is usually seen in
  // the opening seconds), or the jump is a genuine sustained transition (e.g. awake→sleep HR drop)
  // that simply never returns near the pre-transition level. Either way, one early 1-sample trigger
  // could silently replace an entire multi-hour night with a flat, wrong number (observed: 22083 of
  // 22108 samples clamped to a flat 100 bpm, against the SAME night's independent ECGDex-measured
  // 48.4 bpm). HR_ARTIFACT_MAX_RUN_SEC bounds the search: if recovery hasn't arrived within that many
  // seconds, stop trusting the anchor and let the raw values stand — mirrors ECGDex's local-median
  // beat correction, which is bounded by construction (DEX-DSP-AUDIT-BEATS-ARTIFACT.md), and the
  // ECG-RPEAK-SEED-FIX precedent for a startup transient poisoning a whole-night detector.
  function cleanArtifactHR(rows) {
    var n = rows.length,
      cleaned = 0;
    var HARD = CFG.HR_ARTIFACT_JUMP;
    var SOFT = CFG.HR_ARTIFACT_JUMP_SOFT;
    var RECOV = HARD / 2;
    var MAX_RUN = CFG.HR_ARTIFACT_MAX_RUN_SEC; // O2Ring is ~1 Hz, so this doubles as a sample count
    var i = 1;
    while (i < n) {
      var rise = rows[i].hr - rows[i - 1].hr;
      var isHard = Math.abs(rise) >= HARD; // catch both sudden rises AND drops
      var isSoft = false;
      if (!isHard && rise >= SOFT) {
        var t = rows[i].t,
          minsec = t.getUTCMinutes() + t.getUTCSeconds() / 60;
        isSoft = minsec <= 2 || minsec >= 58; // v14: full ±2min at ANY clock hour
      }
      if (isHard || isSoft) {
        var baseline = rows[i - 1].hr,
          j = i;
        // For rises: recover when HR returns within RECOV of baseline
        // For drops: recover when HR returns within RECOV of baseline (above baseline-RECOV)
        var isRise = rise > 0;
        while (j < n && j - i < MAX_RUN && (isRise ? rows[j].hr > baseline + RECOV : rows[j].hr < baseline - RECOV)) {
          j++;
        }
        if (j - i >= MAX_RUN) {
          // Recovery never arrived within a plausible artifact duration — the anchor itself was bad, or
          // this is a real sustained transition. Bail WITHOUT clamping; resume scanning from j so a
          // genuinely new jump later on can still be caught against the (now-current) level.
          i = j;
        } else {
          for (var k = i; k < j; k++) {
            rows[k].hr = baseline;
            rows[k].hrArtifact = true;
            cleaned++;
          }
          i = j > i ? j : i + 1; // defensive: guarantee progress even if SOFT ≤ RECOV is ever configured
        }
      } else {
        i++;
      }
    }
    return cleaned;
  }

  // Post-spike-detection clock filter: removes spikes whose timestamp falls within
  // ±2 min of ANY clock hour (the :58–:02 window — v14; no hour gate, matching
  // cleanArtifactHR's soft-artifact rule). Catches gradual-ramp artifacts that the
  // single-sample HR cleaner cannot see.
  /* Reject the O2Ring's firmware HR artifact by WHAT IT IS, not by WHEN IT HAPPENS.
     (O2RING-HOURLY-HR-ARTIFACT-2026-08-02-BRIEF; vendor-confirmed by Wellue 2026-05-14 as a
     timer-driven routine that transiently double-counts cardiac cycles.)

     The previous rule dropped every spike landing within ±2 min of a clock hour — the vendor's own
     advice, and the obvious thing to do before the mechanism was understood. Measured across the
     corpus's 37 O2Ring nights (79 detected spikes; "artifact" = an onset no heart can produce):

         rule                    artifacts missed    GENUINE AROUSALS DELETED
         ±2 min clock window      1 of 44             11 of 35   (31 %)
         onset ≥ 15 BPM/s         0 of 44              0 of 35

     ±4 minutes of every hour is 6.7 % of the night, so the window rule was discarding real events for
     the crime of occurring near a clock hour — and still missed an artifact that drifted outside it.
     The onset test is what actually distinguishes them: a heart cannot gain 20 BPM in one second, an
     algorithm double-counting cycles can. Genuine arousals on post-firmware-fix nights top out at
     7 BPM/s (13 spikes, ≥2026-05-28) — that control is the non-circular evidence, since on the
     affected nights "impossible onset" is the definition of artifact rather than an independent test.

     `clockAligned` is still computed and reported, because the hourly pattern is the signature that
     identified this in the first place — but it is EVIDENCE, never the criterion. */
  function filterArtifactSpikes(spikes) {
    /* This is also the boundary between DETECTION INTERNALS and what the rest of the system sees.
       `onsetRise`/`clockAligned`/`artifact`/`artifactReason` are why a spike was judged; they are not
       properties of a surviving arousal, and every survivor carries `artifact:false` by construction —
       zero information, serialized into `hr_spikes.events` for every consumer forever. So the survivor
       keeps its original shape EXACTLY (which also means this change moves no export byte), and the
       verdict is published once per night as `stats.artifactSpikesRemoved` instead. */
    var kept = [];
    for (var i = 0; i < spikes.length; i++) {
      var sp = spikes[i];
      if (sp.artifact) continue;
      kept.push({ time: sp.time, baseline: sp.baseline, peak: sp.peak, duration: sp.duration, spo2: sp.spo2, mfm: sp.mfm });
    }
    return kept;
  }

  // ═══════════════════════════════════════════════════════════════
  // v20.2: 15 NEW METRICS
  // ═══════════════════════════════════════════════════════════════

  // ── SpO2 Pattern ───────────────────────────────────────────────

  // CT<94: cumulative seconds and % below 94% SpO2
  function computeCT94(rows) {
    var n = rows.length;
    if (n < 60) return null;
    var ct94s = 0;
    for (var i = 0; i < n; i++) {
      if (rows[i].spo2 < 94) ct94s++;
    }
    return { ct94Sec: ct94s, ct94Pct: +((ct94s / n) * 100).toFixed(2) };
  }

  // SpO2 dip and recovery slopes + MODL + desaturation clustering
  // Builds nadir events inline (same ODI-4 rolling-window logic as computeSpO2Advanced)
  function computeDesatSlopes(rows, blArr) {
    var n = rows.length;
    if (n < 60) return null;
    var spo2 = rows.map(function (r) {
      return r.spo2;
    });

    // Unified: ONE ceiling-baseline detection (DEX-EVENT-UNIFY Task A). §3 close-mode: ODI-4 entry +
    // anti-chatter HYSTERESIS close (no exitPct) — the SATELLITE set (slopes/MODL/clustering); chatter-
    // merging is desirable here, so this is intentionally NOT event-for-event with the simple-close
    // headline ODI-4 count. §1: shared p90-ceiling blArr threaded (bit-identical, one walk not many).
    var events = detectDesatEvents(spo2, { dropPct: DexKernel.K.ODI_DROP, blArr: blArr });

    if (!events.length)
      return {
        modl: null,
        meanDipSlope: null,
        meanRecSlope: null,
        clusteringIdx: null,
        firstHalfNadirs: 0,
        lastHalfNadirs: 0
      };

    // MODL: mean SpO2 of all samples inside dip events
    var dipSamples = [];
    events.forEach(function (e) {
      for (var i = e.startIdx; i <= e.endIdx; i++) dipSamples.push(spo2[i]);
    });
    var modl = dipSamples.length
      ? +(
          dipSamples.reduce(function (a, b) {
            return a + b;
          }, 0) / dipSamples.length
        ).toFixed(2)
      : null;

    // Slopes
    var meanDipSlope = events.length
      ? +(
          events.reduce(function (a, e) {
            return a + e.dipSlope;
          }, 0) / events.length
        ).toFixed(3)
      : 0;
    var meanRecSlope = events.length
      ? +(
          events.reduce(function (a, e) {
            return a + e.recSlope;
          }, 0) / events.length
        ).toFixed(3)
      : 0;

    // Clustering: first-half vs last-half of recording
    var midIdx = Math.floor(n / 2);
    var firstH = events.filter(function (e) {
      return e.nadirIdx < midIdx;
    }).length;
    var lastH = events.filter(function (e) {
      return e.nadirIdx >= midIdx;
    }).length;
    var total = firstH + lastH;
    var clusteringIdx = total > 0 ? +(lastH / total).toFixed(2) : null; // >0.6 = REM-concentrated

    return { modl: modl, meanDipSlope: meanDipSlope, meanRecSlope: meanRecSlope, clusteringIdx: clusteringIdx, firstHalfNadirs: firstH, lastHalfNadirs: lastH };
  }

  // ── Periodic Breathing Characterisation ────────────────────────

  function computePBmetrics(rows, osc) {
    var n = rows.length;
    if (!osc || osc.episodeCount < 1)
      return {
        pbCycleLen: null,
        pbCycleLenSD: null,
        pbAmplitude: null,
        pbLoad: null,
        pbFirstThirdRatio: null,
        pbEarlyCount: 0,
        pbLateCount: 0
      };
    var spo2 = rows.map(function (r) {
      return r.spo2;
    });
    var WIN = CFG.OSC_WINDOW_SEC; // 5-min windows (same as oscillation detection — single source: CFG)
    var THRESH = CFG.SPO2_OSC_THRESHOLD;

    // Re-detect crossing times to compute inter-crossing intervals
    var crossingTimes = [];
    var amplitudes = [];
    for (var w = 0; w + WIN <= n; w += WIN) {
      var seg = spo2.slice(w, w + WIN);
      var segMean =
        seg.reduce(function (a, b) {
          return a + b;
        }, 0) / seg.length;
      if (segMean >= THRESH) continue; // not an oscillating window
      var lastCross = -1,
        lastDir = 0,
        localCross = [];
      for (var i = 1; i < seg.length; i++) {
        var dir = seg[i] > THRESH ? 1 : seg[i] < THRESH ? -1 : 0;
        if (dir !== lastDir && dir !== 0) {
          localCross.push(w + i);
          lastCross = w + i;
          lastDir = dir;
        }
      }
      if (localCross.length >= 2) crossingTimes = crossingTimes.concat(localCross);
      // Amplitude: max - min within window
      var mx = seg.length ? Math.max.apply(null, seg) : 0,
        mn = seg.length ? Math.min.apply(null, seg) : 0;
      amplitudes.push(mx - mn);
    }

    // PB cycle length: mean interval between consecutive crossings (full cycle = 2 crossings)
    var intervals = [];
    for (var i = 1; i < crossingTimes.length; i++) {
      var iv = crossingTimes[i] - crossingTimes[i - 1];
      // ⚠️ `iv < 300` IS COUPLED TO `WIN` (= CFG.OSC_WINDOW_SEC = 300) AND MUST TRACK IT.
      // `crossingTimes` is concatenated across windows while non-oscillating windows are skipped
      // above, so two consecutive entries can sit either side of a skipped stretch. Straddling a whole
      // skipped window forces `iv` past the window width, which is why this bound catches every such
      // pair — measured 2026-08-17 on 61 real nights: 184 of 2438 intervals straddle a skipped window,
      // and 0 survive this guard. That is structural, not luck. Raise `OSC_WINDOW_SEC` without raising
      // this and gap-spanning pairs start being recorded as cycles across stretches already judged
      // non-oscillating. (OXYDEX-PB-DETECTOR-FOLLOWUPS §6.)
      if (iv > 5 && iv < 300) intervals.push(iv); // sanity: 5s–300s
    }
    // Full cycle = 2 half-cycles.
    // ⚠️ THIS IS A SLIDING VIEW: `.length` IS NOT THE NUMBER OF CYCLES. Each entry shares a half-cycle
    // with its neighbour, so `k` true cycles produce `2k − 1` entries (2 → 3, 3 → 5, 10 → 19). That is
    // harmless for what reads it here — the mean and SD below are unaffected (measured: SD 1.43 sliding
    // vs 1.41 disjoint) — but it is a trap for any future "≥ N consecutive cycles" test, which is
    // exactly the criterion AASM states and exactly what `detectSpO2Periodicity` needed; that function
    // pairs DISJOINTLY (`j += 2`) for this reason. If you need a cycle COUNT, do not use this array's
    // length. (OXYDEX-PB-DETECTOR-FOLLOWUPS §1.)
    var cycleIntervals = [];
    for (var i = 0; i + 1 < intervals.length; i++) cycleIntervals.push(intervals[i] + intervals[i + 1]);

    var pbCycleLen = cycleIntervals.length
      ? +(
          cycleIntervals.reduce(function (a, b) {
            return a + b;
          }, 0) / cycleIntervals.length
        ).toFixed(1)
      : null;

    var pbCycleLenSD = null;
    if (cycleIntervals.length > 1) {
      var mean =
        cycleIntervals.reduce(function (a, b) {
          return a + b;
        }, 0) / cycleIntervals.length;
      var variance =
        cycleIntervals.reduce(function (a, b) {
          return a + (b - mean) * (b - mean);
        }, 0) / cycleIntervals.length;
      pbCycleLenSD = +Math.sqrt(variance).toFixed(1);
    }

    var pbAmplitude = amplitudes.length
      ? +(
          amplitudes.reduce(function (a, b) {
            return a + b;
          }, 0) / amplitudes.length
        ).toFixed(2)
      : null;

    // PB Load: episodeCount × amplitude × estimated mean cycle length / 60 (per hour)
    var durationHr = n / 3600;
    var pbLoad = pbCycleLen && pbAmplitude && durationHr > 0 ? +((osc.episodeCount * pbAmplitude * (pbCycleLen / 60)) / durationHr).toFixed(3) : null;

    // Distribution: first-third vs last-third
    var t1 = Math.floor(n / 3),
      t2 = Math.floor((2 * n) / 3);
    var earlyCount = crossingTimes.filter(function (t) {
      return t < t1;
    }).length;
    var lateCount = crossingTimes.filter(function (t) {
      return t >= t2;
    }).length;
    var total = earlyCount + lateCount;
    var pbFirstThirdRatio = total > 0 ? +(earlyCount / total).toFixed(2) : null; // <0.4 = late/REM dominant

    return { pbCycleLen: pbCycleLen, pbCycleLenSD: pbCycleLenSD, pbAmplitude: pbAmplitude, pbLoad: pbLoad, pbFirstThirdRatio: pbFirstThirdRatio, pbEarlyCount: earlyCount, pbLateCount: lateCount };
  }

  // ── Sleep Architecture Proxies ─────────────────────────────────

  function computeSleepArch(rows) {
    var n = rows.length;
    if (n < 600) return null;
    var WIN = 60; // 1-min HR stability window

    // Sleep onset: first WIN-second window with HR SD < 5 bpm
    var solMin = null,
      onsetIdx = 0;
    for (var i = 0; i + WIN <= n; i++) {
      var seg = rows.slice(i, i + WIN).map(function (r) {
        return r.hr;
      });
      var mean =
        seg.reduce(function (a, b) {
          return a + b;
        }, 0) / seg.length;
      var sd = Math.sqrt(
        seg.reduce(function (a, b) {
          return a + (b - mean) * (b - mean);
        }, 0) / seg.length
      );
      if (sd < 5) {
        solMin = +(i / 60).toFixed(1);
        onsetIdx = i;
        break;
      }
    }

    // WASO: motion-flagged samples AFTER sleep onset only
    // v22.15 fix: guard against onsetIdx=0 fallback when onset is undetectable;
    // return null so UI correctly shows '—' instead of inflated whole-recording value.
    var wasoMin =
      solMin !== null
        ? +(
            rows.slice(onsetIdx).filter(function (r) {
              return r.motion > 0;
            }).length / 60
          ).toFixed(1)
        : null;

    // Ultradian cycle count: HR valleys separated by 60–120 min
    // 5-min centered rolling mean of HR — O(n) sliding window
    // v22.15 fix: previous trailing window displaced valley indices ~150s forward;
    // centered window aligns hrSmooth[i] with the midpoint of its contributing samples.
    var hrSmooth = new Array(n);
    var SMOOTH = 300,
      HALF = Math.floor(SMOOTH / 2);
    var rSum = 0,
      rCnt = 0;
    // Prime the first half-window
    for (var j = 0; j < Math.min(HALF, n); j++) {
      rSum += rows[j].hr;
      rCnt++;
    }
    for (var i = 0; i < n; i++) {
      // Add the right edge of the centered window as i advances
      var rEdge = i + HALF;
      if (rEdge < n) {
        rSum += rows[rEdge].hr;
        rCnt++;
      }
      // Remove the left edge that has fallen out of the window
      var lEdge = i - HALF - 1;
      if (lEdge >= 0) {
        rSum -= rows[lEdge].hr;
        rCnt--;
      }
      hrSmooth[i] = rCnt > 0 ? rSum / rCnt : rows[i].hr;
    }
    var valleys = [];
    var MIN_SEP = 3600; // 60 min minimum between valleys
    for (var i = 150; i < n - 150; i++) {
      if (hrSmooth[i] < hrSmooth[i - 150] && hrSmooth[i] < hrSmooth[i + 150]) {
        if (!valleys.length || i - valleys[valleys.length - 1] >= MIN_SEP) {
          valleys.push(i);
        }
      }
    }
    var ultradianCycles = Math.max(0, valleys.length - 1); // count intervals between valleys

    return { wasoMin: wasoMin, solMin: solMin, ultradianCycles: ultradianCycles, ultradianValleys: valleys.length };
  }

  // ── ODI-1 ──────────────────────────────────────────────────────

  function computeODI1(rows, blArr) {
    var n = rows.length;
    if (n < 60) return { odi1Rate: 0, odi1Total: 0 };
    var spo2 = rows.map(function (r) {
      return r.spo2;
    });
    // ODI-1 keeps its definitional 1% entry + shallow 0.5% re-rise exit and counts every
    // qualifying dip (minSec:0, no 10s floor) — but now shares the ONE ceiling-baseline
    // primitive instead of a private trailing-mean loop. (DEX-EVENT-UNIFY Task A)
    var events = detectDesatEvents(spo2, { dropPct: 1, exitPct: 0.5, minSec: 0, blArr: blArr }).length;
    var durationHr = n / 3600;
    return { odi1Rate: durationHr > 0 ? +(events / durationHr).toFixed(1) : 0, odi1Total: events };
  }

  // ── Literature Scores ──────────────────────────────────────────

  // McGill OxiMetry Score (MOS) 0-4
  // Grade 1: ODI-4 < 5, CT<90 < 1min
  // Grade 2: ODI-4 5-15 OR CT<90 1-5min
  // Grade 3: ODI-4 > 15 OR CT<90 > 5min, one criterion
  // Grade 4: both criteria exceeded
  function computeMOS(odi4Rate, ct90Sec) {
    var ct90Min = ct90Sec / 60;
    var odiHigh = odi4Rate >= DexKernel.K.MOS_LONG;
    var ctHigh = ct90Min >= 5;
    var odiMod = odi4Rate >= DexKernel.K.MOS_SHORT;
    var ctMod = ct90Min >= 1;
    var score;
    if (odiHigh && ctHigh) score = 4;
    else if (odiHigh || ctHigh) score = 3;
    else if (odiMod || ctMod) score = 2;
    else score = 1;
    var labels = ['', 'Normal', 'Borderline', 'Abnormal', 'Severely Abnormal'];
    return { mos: score, mosLabel: labels[score] };
  }

  // AHI estimates
  function computeAHIestimates(odi4Rate, odi3Rate, desSevRate, t95Pct) {
    // ODI-4 as AHI surrogate: AHI_est ≈ ODI-4 × 1.1 (ODI-4 is a widely-used oximetry AHI
    // surrogate; this conservative constant is OxyDex's). RE-EXAMINED after the v22.36 ceiling-
    // baseline fix removed the severity-proportional ODI undercount (OXYDEX-ODI-CEILING-FIX-
    // BRIEF.md §2c): on the v1.6 20k-cohort the residual through-origin relation is
    // truth-AHI ≈ 1.4 × ODI-4 — i.e. with the corrected detector ODI-4 still modestly
    // UNDER-represents planted AHI (expected: not every scored hypopnea desaturates ≥4%),
    // so the feared over-shoot did NOT materialize. Per the brief's guardrail (do not tune
    // the surrogate to chase the simulator), ×1.1 is retained UNCHANGED — conservative and
    // literature-consistent — rather than inflated to the synthetic-only slope.
    /* `null * 1.1` is 0, so an absent ODI-4 published an AHI estimate of 0.0 — the most reassuring
       possible reading of a measurement that never happened. */
    var ahiODI4 = odi4Rate == null ? null : +(odi4Rate * 1.1).toFixed(1);
    // Internal linear model (concept per Kulkas 2013 DesSev): AHI ≈ 0.8×ODI3 + 0.6×DesSev + 0.15×T95 − 1.2
    /* REFUSE rather than treat an absent term as zero (§2.6). `0.6 * null` is 0 in JS, so an
       unmeasured DesSev silently vanished from the sum and the estimate came out LOW — the
       reassuring direction, from missing data. Each estimate refuses only on the inputs it
       actually uses, so a missing DesSev does not take ahiODI4 down with it. */
    var ahiKulkas = odi3Rate == null || desSevRate == null || t95Pct == null ? null : Math.max(0, +(0.8 * odi3Rate + 0.6 * desSevRate + 0.15 * t95Pct - 1.2).toFixed(1));
    return { ahiODI4: ahiODI4, ahiKulkas: ahiKulkas };
  }

  // ═══════════════════════════════════════════════════════════════
  // v20.3: TIER 1 — Night Extras (12 simple metrics)
  // ═══════════════════════════════════════════════════════════════
  function computeNightExtras(rows, stats, desat, odi1, odi4, hb) {
    var n = rows.length;
    if (n < 60 || !stats) return null;
    var spo2 = rows.map(function (r) {
      return r.spo2;
    });
    var hr = rows.map(function (r) {
      return r.hr;
    });
    var TWO_HR = Math.min(n, 7200); // 2h in samples at 1Hz

    // SpO2 range
    var spo2Range = +(stats.maxSpo2 - stats.minSpo2).toFixed(1);

    // Time-in-range 94–99%
    var tirCount = spo2.filter(function (v) {
      return v >= 94 && v <= 99;
    }).length; // TIR94-99: excludes ceiling-artifact 100%
    var tir9499 = +((tirCount / n) * 100).toFixed(1);

    // Split-night SpO2
    var earlyS = spo2.slice(0, TWO_HR);
    var lateS = spo2.slice(Math.max(0, n - TWO_HR));
    var meanSpo2Early = +(
      earlyS.reduce(function (a, b) {
        return a + b;
      }, 0) / earlyS.length
    ).toFixed(2);
    var meanSpo2Late = +(
      lateS.reduce(function (a, b) {
        return a + b;
      }, 0) / lateS.length
    ).toFixed(2);

    // HR range + split-night HR
    var hrRange = +(stats.maxHr - stats.minHr).toFixed(0);
    var earlyH = hr.slice(0, TWO_HR);
    var lateH = hr.slice(Math.max(0, n - TWO_HR));
    var meanHrEarly = +(
      earlyH.reduce(function (a, b) {
        return a + b;
      }, 0) / earlyH.length
    ).toFixed(1);
    var meanHrLate = +(
      lateH.reduce(function (a, b) {
        return a + b;
      }, 0) / lateH.length
    ).toFixed(1);

    // Motion bursts (runs of motion>0 lasting ≥3s)
    var motionBursts = 0;
    var inBurst = false,
      burstLen = 0;
    for (var i = 0; i < n; i++) {
      if (rows[i].motion > 0) {
        inBurst = true;
        burstLen++;
      } else {
        if (inBurst && burstLen >= 3) motionBursts++;
        inBurst = false;
        burstLen = 0;
      }
    }
    if (inBurst && burstLen >= 3) motionBursts++;

    // Longest clean SpO2 run (>95%, in minutes)
    var longestCleanRun = 0,
      curRun = 0;
    for (var i = 0; i < n; i++) {
      if (spo2[i] > 95) {
        curRun++;
        if (curRun > longestCleanRun) longestCleanRun = curRun;
      } else curRun = 0;
    }
    longestCleanRun = +(longestCleanRun / 60).toFixed(1);

    // Nadir density
    var nadirCount = desat && desat.nadir ? desat.nadir.count : 0;
    var durationHr = n / 3600;
    var nadirDensity = durationHr > 0 ? +(nadirCount / durationHr).toFixed(2) : 0;

    // T95 burden score: T95% × sqrt(T-AUC weighted)
    var t95BurdenScore = null;
    if (stats && hb) {
      var tAUC = hb.total || 0;
      t95BurdenScore = +(stats.t95pct * Math.sqrt(Math.max(0, tAUC))).toFixed(2);
    }

    // ODI-4/ODI-1 ratio (depth distribution index)
    var odi41ratio = null;
    if (odi4 && odi1 && odi1.odi1Rate > 0) {
      odi41ratio = +(odi4.rate / odi1.odi1Rate).toFixed(3);
    }

    return {
      spo2Range: spo2Range,
      tir9499: tir9499,
      meanSpo2Early: meanSpo2Early,
      meanSpo2Late: meanSpo2Late,
      hrRange: hrRange,
      meanHrEarly: meanHrEarly,
      meanHrLate: meanHrLate,
      motionBursts: motionBursts,
      longestCleanRun: longestCleanRun,
      nadirDensity: nadirDensity,
      t95BurdenScore: t95BurdenScore,
      odi41ratio: odi41ratio
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // v20.3: TIER 2 — Rolling Window Metrics (8 metrics)
  // ═══════════════════════════════════════════════════════════════
  function computeRollingMetrics(rows, desat, comp, blArr) {
    var n = rows.length;
    if (n < 600) return null;
    var spo2 = rows.map(function (r) {
      return r.spo2;
    });
    var hr = rows.map(function (r) {
      return r.hr;
    });
    var W10 = 600; // 10-min
    var W30 = 1800; // 30-min
    var W5 = 300; // 5-min
    var durationHr = n / 3600;

    // Worst 10-min SpO2 window
    var worst10 = 100;
    for (var i = 0; i + W10 <= n; i += 60) {
      var seg = spo2.slice(i, i + W10);
      var m =
        seg.reduce(function (a, b) {
          return a + b;
        }, 0) / seg.length;
      if (m < worst10) worst10 = m;
    }
    worst10 = isFinite(worst10) ? +worst10.toFixed(2) : 0;

    // Worst 30-min T95 window
    var worstT95 = 0;
    for (var i = 0; i + W30 <= n; i += 60) {
      var seg = spo2.slice(i, i + W30);
      var cnt = seg.filter(function (v) {
        return v < 95;
      }).length;
      var pct = (cnt / seg.length) * 100;
      if (pct > worstT95) worstT95 = pct;
    }
    worstT95 = isFinite(worstT95) ? +worstT95.toFixed(1) : 0;

    // SpO2 stable windows (5-min with SD < 1%)
    var stableWins = 0;
    for (var i = 0; i + W5 <= n; i += W5) {
      var seg = spo2.slice(i, i + W5);
      var mean =
        seg.reduce(function (a, b) {
          return a + b;
        }, 0) / seg.length;
      var sd = Math.sqrt(
        seg.reduce(function (a, b) {
          return a + (b - mean) * (b - mean);
        }, 0) / seg.length
      );
      if (sd < 1) stableWins++;
    }

    // CDI: Cyclic Desaturation Index — SpO2 oscillations crossing mean±2SD per hour
    var globalMean =
      spo2.reduce(function (a, b) {
        return a + b;
      }, 0) / n;
    var globalSD = Math.sqrt(
      spo2.reduce(function (a, b) {
        return a + (b - globalMean) * (b - globalMean);
      }, 0) / n
    );
    var hiThresh = globalMean + 2 * globalSD,
      loThresh = globalMean - 2 * globalSD;
    var cdiCross = 0,
      cdiState = 0;
    for (var i = 0; i < n; i++) {
      var newState = spo2[i] > hiThresh ? 1 : spo2[i] < loThresh ? -1 : cdiState;
      if (newState !== cdiState && newState !== 0) {
        cdiCross++;
        cdiState = newState;
      }
    }
    var cdi = durationHr > 0 ? +(cdiCross / durationHr / 2).toFixed(2) : 0; // /2 = full cycles

    // Post-dip HR response: mean HR change 60s after each nadir
    var postDipDeltas = [];
    // §2: dropped the vestigial `desat.nadir.count > 0` pre-gate — a coarse "any events?" check from
    // the pre-unification separate loop. postDipDeltas.length below is the real gate, and it scores the
    // SET THIS USES (ODI-4 entry + anti-chatter HYSTERESIS close — §3 satellite set), not the simple-
    // close self-gated nadir.count. §1: shared p90-ceiling blArr threaded. DEX-EVENT-UNIFY-FOLLOWUPS-II.
    detectDesatEvents(spo2, { dropPct: DexKernel.K.ODI_DROP, blArr: blArr }).forEach(function (e) {
      var postIdx = Math.min(n - 1, e.nadirIdx + 60);
      if (postIdx < n && e.nadirIdx < n) postDipDeltas.push(hr[postIdx] - hr[e.nadirIdx]);
    });
    var postDipHrResponse = postDipDeltas.length
      ? +(
          postDipDeltas.reduce(function (a, b) {
            return a + b;
          }, 0) / postDipDeltas.length
        ).toFixed(1)
      : null;

    // HR deceleration runs: ≥3 BPM total decrease sustained ≥30s
    var hrDecelRuns = 0,
      decelLen = 0,
      decelStartHR = 0;
    for (var i = 1; i < n; i++) {
      if (hr[i] < hr[i - 1]) {
        if (decelLen === 0) decelStartHR = hr[i - 1]; // capture baseline before first step
        decelLen++;
      } else {
        if (decelLen >= 30 && decelStartHR - hr[i - 1] >= 3) hrDecelRuns++;
        decelLen = 0;
        decelStartHR = 0;
      }
    }
    if (decelLen >= 30 && decelStartHR - hr[n - 1] >= 3) hrDecelRuns++; // end-of-array run

    // SpO2-HR decoupling: use 30s windows to avoid 1Hz noise domination
    // 1-second comparison is meaningless (random ~50% by quantization noise)
    var decoupled = 0,
      dcTotal = 0;
    for (var i = 30; i < n; i += 30) {
      var dSpo2 = spo2[i] - spo2[i - 30];
      var dHr = hr[i] - hr[i - 30];
      if (dSpo2 !== 0 && dHr !== 0) {
        dcTotal++;
        if (dSpo2 > 0 !== dHr > 0) decoupled++;
      }
    }
    // DEEP-AUDIT-FOLLOWUPS §B4 — the sibling of §18's coupling fix. With no comparable 30 s windows
    // the decoupled FRACTION is 0/0 — undefined, not "0 % decoupled, a perfectly coupled night". The
    // value ships in the node-export, so a consumer reading 0 would take it as a measurement.
    var spo2HrDecouplingPct = dcTotal > 0 ? +((decoupled / dcTotal) * 100).toFixed(1) : null;

    // Intra-night NSI: NSI per 90-min epoch (early/mid/late)
    var EPOCH = 5400; // 90 min
    var intraNightNSI = [];
    for (var e = 0; e < 3; e++) {
      var start = e * EPOCH,
        end = Math.min(n, start + EPOCH);
      if (end <= start) break;
      var seg = rows.slice(start, end);
      var segSpo2 = seg.map(function (r) {
        return r.spo2;
      });
      var segHr = seg.map(function (r) {
        return r.hr;
      });
      var segN = seg.length;
      // Mini-NSI: T95 + HR variance + motion
      var segT95 = segN
        ? (segSpo2.filter(function (v) {
            return v < 95;
          }).length /
            segN) *
          100
        : 0;
      var segHrMean = segN
        ? segHr.reduce(function (a, b) {
            return a + b;
          }, 0) / segN
        : 0;
      var segHrSD = segN
        ? Math.sqrt(
            segHr.reduce(function (a, b) {
              return a + (b - segHrMean) * (b - segHrMean);
            }, 0) / segN
          )
        : 0;
      var segMot = segN
        ? (seg.filter(function (r) {
            return r.motion > 0;
          }).length /
            segN) *
          100
        : 0;
      var t95Norm = Math.min(1, segT95 / 30);
      var hrSdNorm = Math.min(1, segHrSD / 20);
      var motNorm = Math.min(1, segMot / 30);
      var miniNSI = Math.min(100, Math.round(((t95Norm + hrSdNorm + motNorm) / 3) * 100));
      intraNightNSI.push(miniNSI);
    }

    return {
      worst10minSpo2: worst10,
      worst30minT95: worstT95,
      spo2StableWindows: stableWins,
      cdi: cdi,
      postDipHrResponse: postDipHrResponse,
      hrDecelRuns: hrDecelRuns,
      spo2HrDecouplingPct: spo2HrDecouplingPct,
      intraNightNSI: intraNightNSI
    };
  }

  // ═══════════════════════════════════════════════════════════════
  // v20.3: TIER 3 — Pattern Probability Scores
  // ═══════════════════════════════════════════════════════════════
  function computePatternScores(pbMet, osc, cross, flags, odi4, comp) {
    // NOTE: cs/uars are CONSTRUCTED, NON-VALIDATED composite scores (0-3) meant as
    // directional flags for discussion, not diagnoses. See the on-page disclaimer.
    //
    // Cheyne-Stokes probability (0-3)
    // CS criterion: PB cycle within the clinical CSR range (~40-130 s; classic
    // 45-90 s, up to ~120 s in severe heart failure), plus BLUNTED_AROUSAL,
    // low cardiorespiratory coupling, and low ODI-4 despite high PB burden.
    var cs = 0;
    if (pbMet && pbMet.pbCycleLen !== null) {
      if (pbMet.pbCycleLen >= 40 && pbMet.pbCycleLen <= 130) cs++; // clinical CSR cycle window
    }
    if (
      flags &&
      flags.some(function (f) {
        return f.code.indexOf('BLUNTED_AROUSAL') >= 0;
      })
    )
      cs++;
    if (cross && cross.crcIdx != null && cross.crcIdx < 0.2) cs++;
    // CS-specific: low ODI despite high PB burden (central = less desaturation per event)
    if (odi4 && odi4.rate < 3 && osc && osc.episodeCount >= 5) cs++;
    cs = Math.min(3, cs);

    // UARS probability (0-3)
    // Criteria: short PB cycles (< 40 s), high AAI, normal-low ODI-4, high SpO2-HR decoupling
    var uars = 0;
    if (pbMet && pbMet.pbCycleLen !== null) {
      if (pbMet.pbCycleLen < 40) uars++;
    }
    if (cross && cross.autoArousalIdx >= 3) uars++;
    if (odi4 && odi4.rate < 5 && osc && osc.episodeCount >= 3) uars++;
    if (comp && comp.sfi >= 2) uars++;
    uars = Math.min(3, uars);

    /* THE LIKELIHOOD LADDER IS WITHDRAWN (OXYDEX-PB-OVERCALL-FOLLOWUPS §2).
       Both of these read `['Unlikely', 'Possible', 'Probable', 'Likely']` and were indexed by a 0-3
       INDICATOR COUNT. That is a likelihood word attached to a number that cannot carry one, and for
       CS the parent brief measured exactly why: `detectOscillations` has NO periodicity test — no
       cycle-length criterion, no crescendo-decrescendo — and counts crossings of an ABSOLUTE 95 %
       level, so on a corpus whose overnight mean is 94.6-96.6 % it tracks mild hypoxemia burden
       (r = 0.893 with time below 95 %) rather than the respiratory rhythm "Cheyne-Stokes" names.
       Night-level agreement with the CPAP's own PB scoring was kappa = -0.039, worse than chance.

       The score, its 0-3 ladder and every gate on it are UNCHANGED — this is a wording fix, not a
       retune, and §5.2 found no defensible threshold on this corpus so retuning would be guessing.
       What changes is that the surface now states the count it actually has. Same shape as the
       context line at the one-line impression, which the parent already tempered. */
    var csLabels = ['0/3 indicators', '1/3 indicators', '2/3 indicators', '3/3 indicators'];
    var uarsLabels = ['0/3 indicators', '1/3 indicators', '2/3 indicators', '3/3 indicators'];

    return { csScore: cs, csLabel: csLabels[cs], uarsScore: uars, uarsLabel: uarsLabels[uars] };
  }

  // ═══════════════════════════════════════════════════════════════
  // v20.4: TIER 3 continued — Signal Processing Metrics
  // ═══════════════════════════════════════════════════════════════

  // DFA α1 — Detrended Fluctuation Analysis (short-scale exponent)
  // OSA signature: α1 ≈ 0.5 (random-walk-like). Normal: α1 ≈ 0.8–1.1.
  // Uses log-log regression of RMS fluctuation vs window size (n=4..64).
  function computeDFA(rows) {
    var spo2 = (rows || [])
      .map(function (r) {
        return r && r.spo2 != null ? r.spo2 : null;
      })
      .filter(function (v) {
        return v != null && isFinite(v);
      });
    var n = spo2.length;
    if (n < 256) return null;
    // DEEP-AUDIT-2026-07-11 §9: the old `spo2.slice(0, 3600)` analysed only the FIRST HOUR of a 6–10 h
    // night and disclosed nothing — the surfaced DFA α1 chip described the settle-in window, not the
    // night. The cap was never performance-motivated (DFA is O(N·scales)), so it is simply gone: α1 now
    // spans the whole recording. Same defect the sibling computeHREntropy below already fixed — it was
    // applied to one of three siblings and these two were missed.
    var mean =
      spo2.reduce(function (a, b) {
        return a + b;
      }, 0) / n;
    var y = [];
    var cum = 0;
    for (var i = 0; i < n; i++) {
      cum += spo2[i] - mean;
      y.push(cum);
    }
    var scales = [4, 8, 16, 32, 64];
    var logN = [],
      logF = [];
    for (var s = 0; s < scales.length; s++) {
      var wn = scales[s];
      var rmsSum = 0,
        count = 0;
      for (var start = 0; start + wn <= n; start += wn) {
        var seg = y.slice(start, start + wn);
        var xm = (wn - 1) / 2;
        var ym =
          seg.reduce(function (a, b) {
            return a + b;
          }, 0) / wn;
        var num = 0,
          den = 0;
        for (var k = 0; k < wn; k++) {
          num += (k - xm) * (seg[k] - ym);
          den += (k - xm) * (k - xm);
        }
        var slope = den ? num / den : 0,
          intercept = ym - slope * xm;
        var resVar = 0;
        for (var k = 0; k < wn; k++) {
          var r = seg[k] - (slope * k + intercept);
          resVar += r * r;
        }
        rmsSum += Math.sqrt(resVar / wn);
        count++;
      }
      if (count > 0) {
        logN.push(Math.log(wn));
        logF.push(Math.log(Math.max(1e-12, rmsSum / count)));
      }
    }
    if (
      logN.length < 2 ||
      logF.some(function (v) {
        return !isFinite(v);
      })
    )
      return { alpha1: null, dfaLabel: '—' };
    var xm2 =
      logN.reduce(function (a, b) {
        return a + b;
      }, 0) / logN.length;
    var ym2 =
      logF.reduce(function (a, b) {
        return a + b;
      }, 0) / logF.length;
    var num2 = 0,
      den2 = 0;
    for (var i = 0; i < logN.length; i++) {
      num2 += (logN[i] - xm2) * (logF[i] - ym2);
      den2 += (logN[i] - xm2) * (logN[i] - xm2);
    }
    var alpha1 = den2 ? +(num2 / den2).toFixed(3) : null;
    var label = alpha1 === null || !isFinite(alpha1) ? '—' : 'SpO₂ DFA (α1=' + alpha1 + ') — HR-DFA thresholds do not apply to SpO₂ signal';
    return { alpha1: alpha1, dfaLabel: label };
  }

  // SpO2 FFT — dominant frequency in 0.01–0.05 Hz band (respiratory oscillation)
  // Fast: probe 20 candidate frequencies only instead of full DFT
  // FFT CYCLE LENGTH — periodic breathing / Cheyne-Stokes period, WITH A NULL.
  //
  // ⚠️ THIS USED TO RETURN A NUMBER ALWAYS. It took a raw-power argmax over 11 unevenly-spaced probe
  // frequencies with no background and no significance test, so it could not say "no cycle detected".
  // Measured on pure AR(1) with nothing planted, it pinned to the 0.005 Hz band edge in 12 % of runs at
  // rho=0, rising to 55 % at rho=0.995: on a featureless night it reported a confident cycle length.
  //
  // ⚠️ AND YET THE CORPUS SAYS THE METRIC IS REAL, which is why this is a significance test and NOT a
  // retraction. Across 103 O2Ring nights (median lag-1 rho 0.9813) only 19/103 = 18 % hit the 200 s edge
  // against a 42 % null — exact one-sided p = 3.3e-7, Wilson CI [0.121, 0.270] excluding 0.42 — and the
  // cycles spread across 62-125 s, the classic periodic-breathing range. The fix must KEEP those and drop
  // the fabricated ones. (OXYDEX-FFT-CYCLE-NULL-2026-08-16-BRIEF.)
  //
  // METHOD — Mann, M. E. & Lees, J. M. (1996), Climatic Change 33, 409-445, doi 10.1007/BF00142586:
  // test peak HEIGHT against a fitted red background, never peak LOCATION. In a red spectrum the argmax
  // sits near the low-frequency end by construction, so its position carries no information.
  //
  //   1. rho = lag-1 autocorrelation of the mean-removed series (the background's only parameter).
  //   2. AR(1) spectrum  S(f) ~ (1-rho^2) / (1 - 2 rho cos(2 pi f / fs) + rho^2), evaluated on the probe
  //      grid and scaled by the MEDIAN observed/theoretical ratio — median so a real peak cannot inflate
  //      the background that is supposed to expose it.
  //   3. A periodogram ordinate over its background is ~exponential (chi-square, 2 dof), so
  //      P(ratio > x) = exp(-x). With 11 probes the Sidak-corrected 95 % threshold is
  //      -ln(1 - 0.95^(1/11)) ~= 5.37.
  //
  // This ALSO fixes the uneven-grid bias the brief flagged: dividing by a frequency-dependent background
  // is the normalisation. Comparing raw power across unevenly spaced probes favoured the low end no
  // matter what the signal did.
  // ⚠️ NO FIXED PROBE GRID — the record's OWN Fourier bins.
  // Two grids were tried and both failed for the same reason. The original 11 hand-picked probes left
  // blind spots: a cycle planted at 80 s, between the 100 s and 77 s teeth, measured SNR p05 1.6 against
  // p05 37.0 for the same amplitude at 100 s — invisible. Log-spacing 33 probes did not fix it, it just
  // moved the teeth: 0.01 Hz stopped being a probe and the on-grid case collapsed to p05 3.2.
  //
  // The cause is resolution, not density. An N-sample record resolves fs/N; anything evaluated BETWEEN
  // its Fourier bins loses power to scalloping no matter how many spot frequencies you pick. So evaluate
  // ON the bins — k/N for every k in the band — which is also the basis in which periodogram statistics
  // are actually defined. `_FFT_MAX_BINS` strides if a long night would otherwise cost more than it is
  // worth; striding costs coverage, so it is reported rather than silent.
  var _FFT_LO_HZ = 0.005; // 200 s
  var _FFT_HI_HZ = 0.05; // 20 s
  var _FFT_MAX_BINS = 400;
  // ⚠️ THE THEORETICAL THRESHOLD IS ANTI-CONSERVATIVE AND THE GAP IS MEASURED, NOT GUESSED.
  // Sidak assumes a KNOWN background; ours is fitted from the same series, so the null tail is much
  // heavier than exp(-x) predicts. Measured over 80 pure-AR(1) runs at rho=0.98 (nothing planted):
  //     null   p50 6.1   p95 10.3   p99 14.6   max 23.9      theoretical threshold: 6.98
  // i.e. the theoretical value sits at the null MEDIAN and would fire on ~half of featureless nights.
  // The same geometry with a 2 %-amplitude 80 s cycle planted gives p05 23.7 / p50 43.1, so inflating
  // by 2.2x (-> ~15.4) puts the bar above the null p99 and well below the planted p05.
  // This is a correction for BACKGROUND ESTIMATION, stated and reproducible, not a fitted constant:
  // re-run the group's null/planted report if the background model changes.
  var _FFT_EST_BG_INFLATION = 2.2;
  var _FFT_CONF = 0.95;
  // The Sidak threshold is computed PER CALL from the bins actually tested — see computeSpO2FFT.

  function _lag1(x, mean) {
    var num = 0,
      den = 0,
      i;
    for (i = 0; i < x.length; i++) den += (x[i] - mean) * (x[i] - mean);
    for (i = 1; i < x.length; i++) num += (x[i] - mean) * (x[i - 1] - mean);
    if (!(den > 0)) return 0;
    var r = num / den;
    // A background needs a POSITIVE persistence; a negative or absurd rho is not a red spectrum, and
    // clamping is honest here because the alternative is a background that curves the wrong way.
    return r > 0.999 ? 0.999 : r < 0 ? 0 : r;
  }

  function _median(a) {
    var b = a.slice().sort(function (p, q) {
      return p - q;
    });
    var m = b.length >> 1;
    return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2;
  }

  function computeSpO2FFT(rows, fs) {
    var spo2 = rows.map(function (r) {
      return r.spo2;
    });
    var n = spo2.length;
    if (n < 512) return null;
    var RATE = fs > 0 ? fs : 1; // SpO2 rows are 1 Hz; the argument keeps that testable
    var mean =
      spo2.reduce(function (a, b) {
        return a + b;
      }, 0) / n;
    var rho = _lag1(spo2, mean);

    var kLo = Math.max(1, Math.ceil((_FFT_LO_HZ * n) / RATE));
    var kHi = Math.min(Math.floor(n / 2) - 1, Math.floor((_FFT_HI_HZ * n) / RATE));
    if (kHi <= kLo) return null;
    var stride = Math.max(1, Math.ceil((kHi - kLo + 1) / _FFT_MAX_BINS));

    var pows = [],
      bg = [],
      fss = [],
      k,
      t;
    for (k = kLo; k <= kHi; k += stride) {
      var f = (k * RATE) / n,
        re = 0,
        im = 0;
      for (t = 0; t < n; t++) {
        var ang = (2 * Math.PI * k * t) / n;
        re += (spo2[t] - mean) * Math.cos(ang);
        im -= (spo2[t] - mean) * Math.sin(ang);
      }
      pows.push((re * re + im * im) / n);
      var w = (2 * Math.PI * f) / RATE;
      bg.push((1 - rho * rho) / (1 - 2 * rho * Math.cos(w) + rho * rho));
      fss.push(f);
    }
    // Sidak across the bins ACTUALLY tested — the correction must follow the grid, not a constant.
    // Sidak across the bins ACTUALLY tested — the correction must follow the grid, not a constant.
    var thresh = -Math.log(1 - Math.pow(_FFT_CONF, 1 / pows.length)) * _FFT_EST_BG_INFLATION;
